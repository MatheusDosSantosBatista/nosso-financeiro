async function editTransaction(id){const pg=await sb.from('personal_goal_purchases').select('id').eq('transaction_id',id).maybeSingle();if(pg.error){toast(pg.error.message);return}if(pg.data){toast('Compra paga com reserva: edição bloqueada para preservar os saldos.');return}const linked=await nfLinkedTransaction(id);if(linked===null)return;if(linked){toast('Lançamento vinculado: desvincule o pagamento no histórico antes de editar.');return}let t=(window.__nfdata?.allTransactions||[]).find(z=>z.id===id);if(!t){let q=await sb.from('transactions').select('*').eq('id',id).single();t=q.data}if(!t)return;if(t.transfer_id){toast('Para manter os saldos corretos, cancele a transferência e registre outra.');return}if(t.owner_user_id!==state.user.id&&t.ownership!=='couple'){toast('Você pode editar somente seus lançamentos individuais.');return}let dt=t.transaction_at?new Date(t.transaction_at):new Date((t.transaction_date||new Date().toISOString().slice(0,10))+'T12:00:00');let local=new Date(dt.getTime()-dt.getTimezoneOffset()*60000).toISOString().slice(0,16);modal('Editar lançamento',`<div class="formgrid"><label class="full">Descrição<input id="f_desc" value="${esc(t.description)}" required></label><label>Valor<input id="f_amount" type="number" step="0.01" min="0.01" value="${Number(t.amount)}" required></label><label>Data e hora<input id="f_datetime" type="datetime-local" value="${local}" required></label><label>Categoria<input id="f_category" value="${esc(t.category_label||'Outros')}"></label><label>Origem/tipo<input id="f_source" value="${esc(t.movement_source||'')}"></label><label>Forma de pagamento<input id="f_payment" value="${esc(t.payment_method||'')}"></label><label>Visibilidade<select id="f_visibility"><option value="shared" ${t.visibility==='shared'?'selected':''}>Compartilhado</option><option value="private" ${t.visibility==='private'?'selected':''}>Privado</option></select></label><label class="full">Observações<textarea id="f_notes">${esc(t.notes||'')}</textarea></label></div><div class="notice">As alterações serão registradas no histórico de auditoria.</div>`,`submitTransactionEdit(event,'${id}')`)}async function submitTransactionEdit(e,id){e.preventDefault();const linked=await nfLinkedTransaction(id);if(linked===null)return;if(linked){toast('Este lançamento foi vinculado a um pagamento. Desvincule antes de editar.');return}let patch={description:v('f_desc'),amount:Number(v('f_amount')),transaction_date:(v('f_datetime')||new Date().toISOString()).slice(0,10),transaction_at:v('f_datetime')?new Date(v('f_datetime')).toISOString():new Date().toISOString(),category_label:v('f_category'),movement_source:v('f_source'),payment_method:v('f_payment'),visibility:v('f_visibility'),notes:v('f_notes'),updated_at:new Date().toISOString()};try{if(!await nfCheckDuplicate({...patch,kind:(window.__nfdata?.allTransactions||[]).find(t=>t.id===id)?.kind||'expense'},id))return}catch(err){toast('Não foi possível verificar possíveis duplicidades: '+err.message);return}let {error}=await sb.from('transactions').update(patch).eq('id',id);if(error)toast('Não foi possível editar: '+error.message);else{closeModal();toast('Lançamento atualizado e registrado no histórico');render()}}
// Aviso preventivo: consulta apenas registros que as políticas RLS permitem visualizar.
function nfNormalizeDescription(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function nfSimilarity(a,b){let x=nfNormalizeDescription(a),y=nfNormalizeDescription(b);if(!x||!y)return 0;if(x===y)return 1;if(x.includes(y)||y.includes(x))return .85;let aa=new Set(x.split(' ').filter(w=>w.length>2)),bb=new Set(y.split(' ').filter(w=>w.length>2));let common=[...aa].filter(w=>bb.has(w)).length;return common/Math.max(aa.size,bb.size,1)}
async function nfCheckDuplicate(candidate,excludeId){
 const day=candidate.transaction_date;const from=new Date(day+'T12:00:00');const min=new Date(from.getTime()-2*86400000).toISOString().slice(0,10);const max=new Date(from.getTime()+2*86400000).toISOString().slice(0,10);
 const {data:rows,error}=await sb.from('transactions').select('id,owner_user_id,description,amount,kind,transaction_date,transaction_at,ownership,visibility,deleted_at,transfer_id').eq('couple_id',state.coupleId).eq('kind',candidate.kind).gte('transaction_date',min).lte('transaction_date',max).is('deleted_at',null).limit(250);
 if(error)throw error;
 const matches=(rows||[]).filter(r=>r.id!==excludeId&&!r.transfer_id).map(r=>{let delta=Math.abs(Number(r.amount)-Number(candidate.amount));let sim=nfSimilarity(r.description,candidate.description);let dateDiff=Math.abs((new Date(r.transaction_date+'T12:00:00')-from)/86400000);let hourDiff=r.transaction_at&&candidate.transaction_at?Math.abs(new Date(r.transaction_at)-new Date(candidate.transaction_at))/3600000:null;let score=(delta<.005?5:delta<=Math.max(1,Number(candidate.amount)*.01)?2:0)+(dateDiff===0?2:dateDiff===1?1:0)+(sim>=.8?3:sim>=.4?1:0)+(hourDiff!==null&&hourDiff<=4?1:0);return {...r,score,sim,delta}}).filter(r=>r.delta<=Math.max(1,Number(candidate.amount)*.01)&&r.score>=7).sort((a,b)=>b.score-a.score);
 if(!matches.length)return true;
 let first=matches[0];let who=first.owner_user_id===state.user.id?'você':'outro membro do casal';let date=first.transaction_date.split('-').reverse().join('/');let amount=Number(first.amount).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
 return window.confirm('⚠️ POSSÍVEL LANÇAMENTO DUPLICADO\n\nEncontramos '+matches.length+' lançamento(s) semelhante(s) que você tem permissão para visualizar.\n\nDescrição: '+first.description+'\nValor: '+amount+'\nData: '+date+'\nRegistrado por: '+who+'\n\nOK = CONTINUAR e salvar mesmo assim.\nCancelar = NÃO salvar.\n\nEste aviso não impede pagamentos legítimos.');
}
async function submitTransaction(e,type){e.preventDefault();let payload={couple_id:state.coupleId,owner_user_id:state.user.id,description:v('f_desc'),amount:Number(v('f_amount')),kind:type==='income'?'income':'expense',ownership:v('f_ownership'),visibility:v('f_visibility')||'shared',account_id:v('f_account')||null,payment_method:v('f_payment'),category_label:v('f_category'),movement_source:v('f_source'),transaction_date:(v('f_datetime')||new Date().toISOString()).slice(0,10),transaction_at:v('f_datetime')?new Date(v('f_datetime')).toISOString():new Date().toISOString(),notes:v('f_notes')};
try{if(!await nfCheckDuplicate(payload,null))return}catch(err){toast('Não foi possível verificar possíveis duplicidades. Tente novamente: '+err.message);return}
let {error}=await sb.from('transactions').insert(payload);if(error)toast(error.message);else{closeModal();toast('Lançamento salvo; saldo da conta atualizado');render()}}

function nfRecordActions(type,id){
 const maps={transaction:{label:'lançamento',edit:()=>editTransaction(id),table:'transactions'},
 account:{label:'conta',edit:()=>editAccount(id),table:'accounts'},
 debt:{label:'dívida',edit:()=>editDebt(id),table:'debts'},
 project:{label:'projeto',edit:()=>editProject(id),table:'projects'}};
 const a=maps[type];if(!a)return;
 const item=(window.__nfdata?.[type==='transaction'?'allTransactions':type==='account'?'accounts':type==='debt'?'debts':'projects']||[]).find(x=>x.id===id);
 const label=item?.name||item?.description||a.label;
 const root=document.getElementById('modalRoot');if(!root)return;
 root.innerHTML=`<div class="modal"><div class="modalbox"><div class="modalhead"><div><h2>${esc(label)}</h2><p class="muted" style="margin:5px 0 0">Escolha uma ação para este ${esc(a.label)}.</p></div><button class="close" type="button" onclick="closeModal()" aria-label="Fechar">×</button></div><div class="nf-record-actions"><button class="btn primary" type="button" id="nfActionEdit">Editar</button>${type==='project'?'<button class="btn" type="button" id="nfActionOpen">Abrir projeto</button>':''}<button class="btn danger" type="button" id="nfActionDelete">Excluir</button><button class="btn" type="button" onclick="closeModal()">Cancelar</button></div></div></div>`;
 document.getElementById('nfActionEdit').onclick=()=>a.edit();
 const open=document.getElementById('nfActionOpen');if(open)open.onclick=()=>{closeModal();openProject(id)};
 document.getElementById('nfActionDelete').onclick=()=>{closeModal();del(a.table,id)};
}
function nfRecordClickHandler(event){
 if(event.target.closest('button,a,input,select,textarea,label'))return;
 const target=event.target.closest('[data-nf-record][data-nf-id]');
 if(!target||!target.closest('.main'))return;
 if(target.dataset.nfRecord==='project'){openProject(target.dataset.nfId);return}nfRecordActions(target.dataset.nfRecord,target.dataset.nfId);
}
document.addEventListener('click',nfRecordClickHandler);
document.addEventListener('keydown',event=>{
 if(event.key!=='Enter'&&event.key!==' ')return;
 if(event.target.matches('[data-nf-record][data-nf-id]')){event.preventDefault();event.target.dataset.nfRecord==='project'?openProject(event.target.dataset.nfId):nfRecordActions(event.target.dataset.nfRecord,event.target.dataset.nfId)}
});

async function submitDebtEdit(e,id){
 e.preventDefault();
 const remaining=Number(v('f_remaining')),total=Number(v('f_total'));
 if(remaining>total){toast('O saldo restante não pode ultrapassar o valor total.');return}
 const payload={name:v('f_name'),total_amount:total,remaining_amount:remaining,installments_total:Number(v('f_installments'))||null,notes:v('f_notes')};
 const current=(window.__nfdata?.debts||[]).find(x=>x.id===id);
 payload[current&&Object.prototype.hasOwnProperty.call(current,'next_due_date')?'next_due_date':'due_date']=v('f_due')||null;
 const r=await sb.from('debts').update(payload).eq('id',id).eq('couple_id',state.coupleId);
 if(r.error){toast('Não foi possível salvar: '+r.error.message);return}
 closeModal();toast('Dívida atualizada');render();
}

init();
</script>
</body></html>
