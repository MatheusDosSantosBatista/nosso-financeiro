function nfCatSave(){let name=document.getElementById('nf_cat_name')?.value.trim();if(!name){toast('Informe o nome da categoria.');return}let ed=nfCatEditing;if(!ed)return;let all=nfIncomeCategories();if(ed.isSub){let parent=all.find(x=>x.n===ed.parent);if(parent?.s.some(x=>x.toLowerCase()===name.toLowerCase()&&x!==ed.oldName)){toast('Essa subcategoria já existe.');return}}else if(all.some(x=>x.n.toLowerCase()===name.toLowerCase()&&x!==ed.oldName)){toast('Essa categoria já existe.');return}
 let custom=nfIncomeStored();if(ed.editing){let prev=custom.find(x=>x.parent===(ed.isSub?ed.parent:null)&&x.name===ed.oldName);if(prev){prev.name=name;prev.icon=nfCatChosenIcon;prev.color=nfCatChosenColor;prev.deleted=false}else custom.push({parent:ed.isSub?ed.parent:null,name,icon:nfCatChosenIcon,color:nfCatChosenColor});if(!ed.isSub&&name!==ed.oldName){custom.filter(x=>x.parent===ed.oldName).forEach(x=>x.parent=name);if(nfScopedDefaults().some(x=>x.n===ed.oldName))custom.push({parent:null,name:ed.oldName,deleted:true})}if(nfIncomeCategory?.parent===ed.oldName&&!ed.isSub)nfIncomeCategory.parent=name;if(ed.isSub&&nfIncomeCategory?.parent===ed.parent&&nfIncomeCategory?.sub===ed.oldName)nfIncomeCategory.sub=name;
 }else custom.push({parent:ed.isSub?ed.parent:null,name,icon:nfCatChosenIcon,color:nfCatChosenColor});
 try{nfWriteScopedCategories(custom)}catch(e){toast('Não foi possível salvar no navegador.');return}
 nfSyncCategories();nfIncomeExpanded=ed.isSub?ed.parent:name;nfCatClose();nfIncomeDrawCategories();if(nfIncomeCategory)nfIncomePick(nfIncomeCategory.parent,nfIncomeCategory.sub);toast('Categoria salva neste dispositivo');
}
function nfCatDelete(){let ed=nfCatEditing;if(!ed?.editing)return;let message=ed.isSub?'Excluir esta subcategoria? Os lançamentos antigos continuarão com a classificação original.':'Excluir esta categoria e ocultar suas subcategorias? Os lançamentos antigos não serão apagados.';if(!confirm(message))return;let custom=nfIncomeStored();let meta=custom.find(x=>x.parent===(ed.isSub?ed.parent:null)&&x.name===ed.oldName);if(meta)meta.deleted=true;else custom.push({parent:ed.isSub?ed.parent:null,name:ed.oldName,deleted:true});try{nfWriteScopedCategories(custom)}catch(e){toast('Não foi possível excluir.');return}if(nfIncomeCategory?.parent===ed.oldName||ed.isSub&&nfIncomeCategory?.parent===ed.parent&&nfIncomeCategory?.sub===ed.oldName)nfIncomeCategory={parent:'Outros',sub:''};nfSyncCategories();nfCatClose();nfIncomeDrawCategories();nfIncomePick(nfIncomeCategory.parent,nfIncomeCategory.sub);toast('Categoria excluída da lista')}

 const {data:rows,error}=await sb.from('transactions').select('id,owner_user_id,description,amount,kind,transaction_date,transaction_at,ownership,visibility,deleted_at,transfer_id').eq('couple_id',state.coupleId).eq('kind',candidate.kind).gte('transaction_date',min).lte('transaction_date',max).is('deleted_at',null).limit(250);
 if(error)throw error;
 const matches=(rows||[]).filter(r=>r.id!==excludeId&&!r.transfer_id).map(r=>{let delta=Math.abs(Number(r.amount)-Number(candidate.amount));let sim=nfSimilarity(r.description,candidate.description);let dateDiff=Math.abs((new Date(r.transaction_date+'T12:00:00')-from)/86400000);let hourDiff=r.transaction_at&&candidate.transaction_at?Math.abs(new Date(r.transaction_at)-new Date(candidate.transaction_at))/3600000:null;let score=(delta<.005?5:delta<=Math.max(1,Number(candidate.amount)*.01)?2:0)+(dateDiff===0?2:dateDiff===1?1:0)+(sim>=.8?3:sim>=.4?1:0)+(hourDiff!==null&&hourDiff<=4?1:0);return {...r,score,sim,delta}}).filter(r=>r.delta<=Math.max(1,Number(candidate.amount)*.01)&&r.score>=7).sort((a,b)=>b.score-a.score);
 if(!matches.length)return true;
 let first=matches[0];let who=first.owner_user_id===state.user.id?'você':'outro membro do casal';let date=first.transaction_date.split('-').reverse().join('/');let amount=Number(first.amount).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
 return window.confirm('⚠️ POSSÍVEL LANÇAMENTO DUPLICADO\n\nEncontramos '+matches.length+' lançamento(s) semelhante(s) que você tem permissão para visualizar.\n\nDescrição: '+first.description+'\nValor: '+amount+'\nData: '+date+'\nRegistrado por: '+who+'\n\nOK = CONTINUAR e salvar mesmo assim.\nCancelar = NÃO salvar.\n\nEste aviso não impede pagamentos legítimos.');
}
async function submitTransaction(e,type){e.preventDefault();let payload={couple_id:state.coupleId,owner_user_id:state.user.id,description:v('f_desc'),amount:Number(v('f_amount')),kind:type==='income'?'income':'expense',...nfCurrentScope(),account_id:v('f_account')||nfAccountChoice()||null,payment_method:v('f_payment'),category_label:v('f_category'),movement_source:v('f_source'),transaction_date:(v('f_datetime')||new Date().toISOString()).slice(0,10),transaction_at:v('f_datetime')?new Date(v('f_datetime')).toISOString():new Date().toISOString(),notes:v('f_notes')};
try{if(!await nfCheckDuplicate(payload,null))return}catch(err){toast('Não foi possível verificar possíveis duplicidades. Tente novamente: '+err.message);return}
let {error}=await sb.from('transactions').insert(payload);if(error)toast(error.message);else{closeModal();toast('Lançamento salvo; saldo da conta atualizado');render()}}

async function submitTransfer(e){e.preventDefault();let from=v('f_from'),to=v('f_to'),amount=Number(v('f_amount'));if(!from||!to||from===to){toast('Escolha duas contas diferentes.');return}let {error}=await sb.rpc('create_financial_transfer',{p_couple_id:state.coupleId,p_from_account:from,p_to_account:to,p_amount:amount,p_description:v('f_desc')||'Transferência entre contas',p_transaction_at:v('f_datetime')?new Date(v('f_datetime')).toISOString():new Date().toISOString(),p_visibility:nfCurrentScope().visibility,p_notes:v('f_notes')||null});if(error){toast('Não foi possível registrar a transferência. Confirme se a atualização SQL foi aplicada: '+error.message);return}closeModal();toast('Transferência registrada; saldos atualizados');render()}
async function submitAccount(e){e.preventDefault();let own=v('f_ownership');let {error}=await sb.from('accounts').insert({couple_id:state.coupleId,owner_user_id:state.user.id,name:v('f_name'),account_type:v('f_type'),ownership:own,institution:v('f_inst'),current_balance:Number(v('f_balance')),image_url:v('f_image_data')||null,notes:v('f_notes')});if(error)toast(error.message);else{closeModal();toast('Conta salva');render()}}
async function submitDebt(e){e.preventDefault();let {error}=await sb.from('debts').insert({couple_id:state.coupleId,owner_user_id:state.user.id,name:v('f_name'),ownership:v('f_ownership'),total_amount:Number(v('f_total')),remaining_amount:Number(v('f_remaining')),installments_total:Number(v('f_installments'))||null,next_due_date:v('f_due')||null,notes:v('f_notes')});if(error)toast(error.message);else{closeModal();toast('Dívida salva');render()}}
async function submitProject(e){e.preventDefault();let {error}=await sb.from('projects').insert({couple_id:state.coupleId,name:v('f_name'),emoji:v('f_emoji'),target_amount:Number(v('f_target')),saved_amount:Number(v('f_saved')),target_date:v('f_date')||null,place:v('f_place'),notes:v('f_notes')});if(error)toast(error.message);else{closeModal();toast('Projeto salvo');render()}}
async function submitGoal(e){e.preventDefault();let {error}=await sb.from('goals').insert({couple_id:state.coupleId,owner_user_id:state.user.id,name:v('f_name'),ownership:v('f_ownership'),target_amount:Number(v('f_target')),saved_amount:Number(v('f_saved')),deadline:v('f_deadline')||null,notes:v('f_notes')});if(error)toast(error.message);else{closeModal();toast('Objetivo salvo');render()}}
async function editAccount(aid){let a=(window.__nfdata?.accounts||[]).find(z=>z.id===aid);if(!a)return;if(a.owner_user_id!==state.user.id&&a.ownership!=='couple'){toast('Somente o titular pode editar esta conta.');return}modal('Editar conta',`<div class="formgrid"><label>Nome<input id="f_name" required value="${esc(a.name)}"></label><label>Instituição<input id="f_inst" value="${esc(a.institution||'')}"></label><label>Tipo<select id="f_type"><option value="bank" ${a.account_type==='bank'?'selected':''}>Conta bancária</option><option value="credit_card" ${a.account_type==='credit_card'?'selected':''}>Cartão de crédito</option><option value="savings" ${a.account_type==='savings'?'selected':''}>Poupança</option><option value="wallet" ${a.account_type==='wallet'?'selected':''}>Carteira</option></select></label><label>Saldo atual (movimentações)<input id="f_balance" type="number" step="0.01" disabled value="${Number(a.current_balance||0)}"></label><label class="full">Trocar logo/imagem<input id="f_image" type="file" accept="image/*" onchange="previewImage(event)"><input id="f_image_data" type="hidden"><span class="mini">Deixe vazio para manter a imagem atual.</span></label><label class="full">Observações<textarea id="f_notes">${esc(a.notes||'')}</textarea></label></div>`,`submitAccountEdit(event,'${aid}')`)}async function submitAccountEdit(e,aid){e.preventDefault();let patch={name:v('f_name'),institution:v('f_inst'),notes:v('f_notes'),updated_at:new Date().toISOString()};if(v('f_image_data'))patch.image_url=v('f_image_data');let {error}=await sb.from('accounts').update(patch).eq('id',aid);if(error)toast(error.message);else{closeModal();toast('Conta atualizada');render()}}
async function editProject(pid){let {data:p,error}=await sb.from('projects').select('*').eq('id',pid).single();if(error||!p)return;modal('Editar projeto',`<div class="formgrid"><label>Nome<input id="f_name" value="${esc(p.name)}"></label><label>Símbolo do projeto<input id="f_emoji" value="${nfProjectIcon(p.emoji,p.name)}"></label><label>Meta<input id="f_target" type="number" step="0.01" value="${p.target_amount||0}"></label><label>Já reservado<input id="f_saved" type="number" step="0.01" value="${p.saved_amount||0}"></label><label>Data<input id="f_date" type="date" value="${p.target_date||''}"></label><label>Local/destino<input id="f_place" value="${esc(p.place||'')}"></label><label class="full">Observações<textarea id="f_notes">${esc(p.notes||'')}</textarea></label></div>`,`submitProjectEdit(event,'${pid}')`)}
async function submitProjectEdit(e,pid){e.preventDefault();let {error}=await sb.from('projects').update({name:v('f_name'),emoji:v('f_emoji'),target_amount:Number(v('f_target')),saved_amount:Number(v('f_saved')),target_date:v('f_date')||null,place:v('f_place'),notes:v('f_notes'),updated_at:new Date().toISOString()}).eq('id',pid);if(error)toast(error.message);else{closeModal();toast('Projeto atualizado');render()}}

function nfRecordActions(type,id){
 const maps={transaction:{label:'lançamento',edit:()=>editTransaction(id),table:'transactions'},
 account:{label:'conta',edit:()=>editAccount(id),table:'accounts'},
 debt:{label:'dívida',edit:()=>editDebt(id),table:'debts'},
 project:{label:'projeto',edit:()=>editProject(id),table:'projects'}};
 const a=maps[type];if(!a)return;
 const item=(window.__nfdata?.[type==='transaction'?'allTransactions':type==='account'?'accounts':type==='debt'?'debts':'projects']||[]).find(x=>x.id===id);
 const label=item?.name||item?.description||a.label;
 const canModify=type==='account'?(item?.owner_user_id===state.user?.id||item?.ownership==='couple'):type!=='transaction'||item?.owner_user_id===state.user?.id||nfCanEditTransaction(item);const canDelete=type==='account'?(item?.account_type!=='wallet'&&canModify):type!=='transaction'||item?.owner_user_id===state.user?.id;
 const root=document.getElementById('modalRoot');if(!root)return;
 root.innerHTML=`<div class="modal"><div class="modalbox"><div class="modalhead"><div><h2>${esc(label)}</h2><p class="muted" style="margin:5px 0 0">Escolha uma ação para este ${esc(a.label)}.</p></div><button class="close" type="button" onclick="closeModal()" aria-label="Fechar">×</button></div><div class="nf-record-actions">${canModify?'<button class="btn primary" type="button" id="nfActionEdit">Editar</button>':'<p class="muted">Você não tem permissão para editar ou excluir este lançamento.</p>'}${type==='project'?'<button class="btn" type="button" id="nfActionOpen">Abrir projeto</button>':''}${canDelete?'<button class="btn danger" type="button" id="nfActionDelete">Excluir</button>':''}<button class="btn" type="button" onclick="closeModal()">Cancelar</button></div></div></div>`;
 const editButton=document.getElementById('nfActionEdit');if(editButton)editButton.onclick=()=>a.edit();
 const open=document.getElementById('nfActionOpen');if(open)open.onclick=()=>{closeModal();openProject(id)};
 const deleteButton=document.getElementById('nfActionDelete');if(deleteButton)deleteButton.onclick=()=>{closeModal();if(type==='account')nfDeleteAccount(id);else del(a.table,id)};
}
function nfRecordClickHandler(event){
 if(event.target.closest('button,a,input,select,textarea,label'))return;
 const target=event.target.closest('[data-nf-record][data-nf-id]');
 if(!target||!target.closest('.main'))return;
 if(target.dataset.nfRecord==='project'){openProject(target.dataset.nfId);return}nfRecordActions(target.dataset.nfRecord,target.dataset.nfId);
}
document.addEventListener('click',nfRecordClickHandler);
document.addEventListener('keydown',event=>{
 if(event.key!=='Enter'&&event.key!==' ')return;
 if(event.target.matches('[data-nf-record][data-nf-id]')){event.preventDefault();event.target.dataset.nfRecord==='project'?openProject(event.target.dataset.nfId):nfRecordActions(event.target.dataset.nfRecord,event.target.dataset.nfId)}
});
async function editDebt(id){
 let d=(window.__nfdata?.debts||[]).find(x=>x.id===id);
 if(!d){const r=await sb.from('debts').select('*').eq('id',id).eq('couple_id',state.coupleId).maybeSingle();if(r.error){toast(r.error.message);return}d=r.data}
 if(!d){toast('Dívida não encontrada');return}
 modal('Editar dívida',`<div class="formgrid"><label class="full">Nome<input id="f_name" required value="${esc(d.name)}"></label><label>Valor total<input id="f_total" type="number" step="0.01" min="0" value="${Number(d.total_amount)||0}"></label><label>Saldo restante<input id="f_remaining" type="number" step="0.01" min="0" value="${Number(d.remaining_amount)||0}"></label><label>Total de parcelas<input id="f_installments" type="number" min="0" value="${Number(d.installments_total)||0}"></label><label>Próximo vencimento<input id="f_due" type="date" value="${esc((d.next_due_date||d.due_date||'').slice(0,10))}"></label><label class="full">Observações<textarea id="f_notes">${esc(d.notes||'')}</textarea></label></div>`,`submitDebtEdit(event,'${id}')`);
}
async function submitDebtEdit(e,id){
 e.preventDefault();
 const remaining=Number(v('f_remaining')),total=Number(v('f_total'));
 if(remaining>total){toast('O saldo restante não pode ultrapassar o valor total.');return}
 const payload={name:v('f_name'),total_amount:total,remaining_amount:remaining,installments_total:Number(v('f_installments'))||null,notes:v('f_notes')};
 const current=(window.__nfdata?.debts||[]).find(x=>x.id===id);
 payload[current&&Object.prototype.hasOwnProperty.call(current,'next_due_date')?'next_due_date':'due_date']=v('f_due')||null;
 const r=await sb.from('debts').update(payload).eq('id',id).eq('couple_id',state.coupleId);
 if(r.error){toast('Não foi possível salvar: '+r.error.message);return}
 closeModal();toast('Dívida atualizada');render();
}

init();
</script>
<script id="nf-calendar-script">
(function(){
const months=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const weekdays=['SEG','TER','QUA','QUI','SEX','SÁB','DOM'];
const pad=n=>String(n).padStart(2,'0');
const iso=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
function format(v,datetime){if(!v)return 'Selecionar data'+(datetime?' e hora':'');const [date,time]=v.split('T');const [y,m,d]=date.split('-');return `${d}/${m}/${y}`+(datetime&&time?' · '+time.slice(0,5):'');}
function enhance(input){if(input.dataset.nfCalReady)return;input.dataset.nfCalReady='1';const shell=document.createElement('div');shell.className='nf-date-shell';input.parentNode.insertBefore(shell,input);shell.appendChild(input);const btn=document.createElement('button');btn.type='button';btn.className='nf-date-button';btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg><span class="nf-date-text"></span><span class="nf-date-arrow">›</span>';shell.appendChild(btn);const dt=input.type==='datetime-local';const refresh=()=>btn.querySelector('.nf-date-text').textContent=format(input.value,dt);refresh();btn.addEventListener('click',()=>open(input,refresh));input.addEventListener('change',refresh);input.addEventListener('input',refresh);const obs=new MutationObserver(refresh);obs.observe(input,{attributes:true,attributeFilter:['value']});}
function open(input,refresh){document.querySelector('.nf-calendar-overlay')?.remove();const dt=input.type==='datetime-local';const now=new Date();const v=input.value;const initial=v?new Date(v.slice(0,10)+'T12:00:00'):now;let year=initial.getFullYear(),month=initial.getMonth(),selected=v?v.slice(0,10):'';let time=dt?(v.split('T')[1]||`${pad(now.getHours())}:${pad(now.getMinutes())}`).slice(0,5):'';
const overlay=document.createElement('div');overlay.className='nf-calendar-overlay';overlay.innerHTML='<div class="nf-calendar-panel" role="dialog" aria-modal="true" aria-label="Selecionar data"><p class="nf-cal-title">Selecione uma data</p><div class="nf-cal-head"><button type="button" data-prev aria-label="Mês anterior">❮</button><strong></strong><button type="button" data-next aria-label="Próximo mês">❯</button></div><div class="nf-cal-week"></div><div class="nf-cal-days"></div><div class="nf-cal-time" style="display:none"><label for="nf_cal_time">Horário</label><input id="nf_cal_time" type="time"></div><div class="nf-cal-footer"><button type="button" class="nf-cal-today">Hoje</button><button type="button" class="nf-cal-cancel">Cancelar</button><button type="button" class="nf-cal-ok">Confirmar</button></div></div>';document.body.appendChild(overlay);
const panel=overlay.firstElementChild;panel.querySelector('.nf-cal-week').innerHTML=weekdays.map(w=>`<span>${w}</span>`).join('');const timeBox=panel.querySelector('.nf-cal-time');if(dt){timeBox.style.display='flex';timeBox.querySelector('input').value=time;}
function draw(){panel.querySelector('.nf-cal-head strong').textContent=`${months[month]} ${year}`;const days=panel.querySelector('.nf-cal-days');days.innerHTML='';const offset=(new Date(year,month,1).getDay()+6)%7;for(let i=0;i<offset;i++){const spacer=document.createElement('span');spacer.className='nf-cal-spacer';days.appendChild(spacer)}const total=new Date(year,month+1,0).getDate();const today=iso(now.getFullYear(),now.getMonth(),now.getDate());for(let d=1;d<=total;d++){const date=iso(year,month,d),b=document.createElement('button');b.type='button';b.className='nf-cal-day'+(selected===date?' selected':'')+(date===today?' today':'');b.textContent=d;b.disabled=!!((input.min&&date<input.min.slice(0,10))||(input.max&&date>input.max.slice(0,10)));b.addEventListener('click',()=>{selected=date;draw()});days.appendChild(b)}}
const move=n=>{month+=n;if(month<0){month=11;year--}if(month>11){month=0;year++}draw()};panel.querySelector('[data-prev]').onclick=()=>move(-1);panel.querySelector('[data-next]').onclick=()=>move(1);panel.querySelector('.nf-cal-today').onclick=()=>{year=now.getFullYear();month=now.getMonth();selected=iso(year,month,now.getDate());draw()};const close=()=>{document.removeEventListener('keydown',onKey);overlay.remove()};const onKey=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',onKey);overlay.addEventListener('click',e=>{if(e.target===overlay)close()});panel.querySelector('.nf-cal-cancel').onclick=close;panel.querySelector('.nf-cal-ok').onclick=()=>{if(!selected){selected=iso(year,month,1)}const t=dt?(timeBox.querySelector('input').value||'00:00'):'';const next=selected+(dt?'T'+t:'');if((input.min&&next<input.min)||(input.max&&next>input.max)){alert('Selecione uma data dentro do período permitido.');return}const setter=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set;setter.call(input,next);input.dispatchEvent(new Event('input',{bubbles:true}));input.dispatchEvent(new Event('change',{bubbles:true}));refresh();close()};draw();}
function scan(root=document){root.querySelectorAll('input[type="date"],input[type="datetime-local"]').forEach(enhance)}
function boot(){scan();const observer=new MutationObserver(muts=>{for(const m of muts){for(const n of m.addedNodes){if(n.nodeType===1){if(n.matches?.('input[type="date"],input[type="datetime-local"]'))enhance(n);scan(n)}}}});observer.observe(document.body,{childList:true,subtree:true})}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
<script id="nf-account-row-script">
(function(){
const wallet='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="15" rx="2"/><path d="M3 10h18M16 15h3"/><path d="M5 6V4a2 2 0 012-2h12"/></svg>';
const bank='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M7 16h4"/></svg>';
function accounts(){return window.__nfdata?.accounts||[]}
function thumb(value){let a=accounts().find(x=>String(x.id)===String(value));if(!value||a?.account_type==='wallet')return wallet;if(a?.image_url){let u=String(a.image_url);if(u.startsWith('data:image/')||u.startsWith('https://')||u.startsWith('http://')){let im=document.createElement('img');im.src=u;im.alt='';return im}}return bank}
function addThumb(node,value){node.textContent='';const content=thumb(value);if(typeof content==='string')node.innerHTML=content;else node.appendChild(content)}
function label(sel){return sel.id==='f_from'?'Conta de origem':sel.id==='f_to'?'Conta de destino':(sel.closest('label')?.textContent||'').includes('Pago com')?'Pago com':'Recebido em'}
function chosen(sel){const option=sel.selectedOptions[0];if(!sel.value)return 'Minha Carteira';return accounts().find(a=>String(a.id)===sel.value)?.name||option?.textContent?.split(' · ')[0]||'Selecionar conta'}
function update(sel){const row=sel.nextElementSibling;if(!row?.classList.contains('nf-account-row'))return;row.querySelector('.nf-account-row-title').textContent=label(sel);row.querySelector('.nf-account-row-value').textContent=chosen(sel);addThumb(row.querySelector('.nf-account-thumb'),sel.value)}
function choose(sel){document.querySelector('.nf-account-overlay')?.remove();const overlay=document.createElement('div');overlay.className='nf-account-overlay';const panel=document.createElement('div');panel.className='nf-account-panel';panel.setAttribute('role','dialog');panel.setAttribute('aria-modal','true');panel.setAttribute('aria-label','Selecionar conta');const heading=document.createElement('h3');heading.textContent=label(sel);panel.appendChild(heading);for(const opt of [...sel.options]){const b=document.createElement('button');b.type='button';b.className='nf-account-option';b.setAttribute('aria-selected',String(sel.value===opt.value));const icon=document.createElement('span');icon.className='nf-account-thumb';addThumb(icon,opt.value);const name=document.createElement('span');name.textContent=opt.value?(accounts().find(a=>String(a.id)===opt.value)?.name||opt.textContent.split(' · ')[0]):(sel.id==='f_account'?'Minha Carteira':'Selecionar conta');b.append(icon,name);b.addEventListener('click',()=>{sel.value=opt.value;sel.dispatchEvent(new Event('change',{bubbles:true}));update(sel);overlay.remove()});panel.appendChild(b)}const close=document.createElement('button');close.type='button';close.className='nf-account-close';close.textContent='Cancelar';close.onclick=()=>overlay.remove();panel.appendChild(close);overlay.appendChild(panel);overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove()});document.body.appendChild(overlay)}
function enhance(sel){if(sel.dataset.nfAccountReady)return;sel.dataset.nfAccountReady='1';sel.classList.add('nf-account-select');const parent=sel.closest('label');if(parent){parent.classList.add('nf-account-label');const text=[...parent.childNodes].find(n=>n.nodeType===3);if(text)text.textContent=''}const row=document.createElement('button');row.type='button';row.className='nf-account-row';row.innerHTML='<span class="nf-account-thumb"></span><span class="nf-account-row-title"></span><span class="nf-account-row-value"></span><span class="nf-account-row-arrow">›</span>';sel.after(row);row.addEventListener('click',()=>choose(sel));sel.addEventListener('change',()=>update(sel));update(sel);const ob=new MutationObserver(()=>update(sel));ob.observe(sel,{childList:true,subtree:true})}
function scan(root=document){if(root.matches?.('select#f_account,select#f_from,select#f_to'))enhance(root);root.querySelectorAll?.('select#f_account,select#f_from,select#f_to').forEach(enhance)}
function boot(){scan();new MutationObserver(records=>{for(const rec of records)for(const node of rec.addedNodes)if(node.nodeType===1)scan(node)}).observe(document.body,{childList:true,subtree:true})}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>

<style id="nf-auto-scrollbar-style">
/* A barra nativa fica sempre escondida: sem setas e sem alterar a largura dos quadros. */
.modalbox, .modalbox *, .nf-calendar-panel, .nf-calendar-panel *,
.nf-inc-picker-box, .nf-inc-picker-box *, .nf-account-panel, .nf-account-panel * {
  scrollbar-width: none !important;
  -ms-overflow-style: none !important;
}
.modalbox::-webkit-scrollbar, .modalbox *::-webkit-scrollbar,
.nf-calendar-panel::-webkit-scrollbar, .nf-calendar-panel *::-webkit-scrollbar,
.nf-inc-picker-box::-webkit-scrollbar, .nf-inc-picker-box *::-webkit-scrollbar,
.nf-account-panel::-webkit-scrollbar, .nf-account-panel *::-webkit-scrollbar {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
}
/* Indicador flutuante independente: nunca ocupa espaço no layout. */
#nf-floating-scroll-thumb {
  position: fixed !important;
  z-index: 2147483646;
  width: 4px;
  border-radius: 999px;
  background: rgba(152, 164, 183, .64);
  box-shadow: 0 0 0 1px rgba(0,0,0,.08);
  pointer-events: none;
  opacity: 0;
  visibility: hidden;
  transition: opacity .2s ease, visibility .2s ease;
}
#nf-floating-scroll-thumb.nf-active { opacity: 1; visibility: visible; }
</style>
<script id="nf-auto-scrollbar-script">
(() => {
  const selector = '.modalbox, .nf-calendar-panel, .nf-inc-picker-box, .nf-account-panel';
  let thumb, timer, active;
  function ensureThumb() {
    if (!thumb) {
      thumb = document.createElement('div');
      thumb.id = 'nf-floating-scroll-thumb';
      thumb.setAttribute('aria-hidden', 'true');
      document.body.appendChild(thumb);
    }
    return thumb;
  }
  function getScroller(node) {
    if (!(node instanceof Element) || !node.closest(selector)) return null;
    let el = node;
    while (el && el instanceof Element && el.closest(selector)) {
      if (el.scrollHeight > el.clientHeight + 2 && el.clientHeight > 0) return el;
      el = el.parentElement;
    }
    return null;
  }
  function position(el) {
    if (!el || !el.isConnected || el.scrollHeight <= el.clientHeight + 2) return false;
    const rect = el.getBoundingClientRect();
    const top = Math.max(rect.top, 0);
    const bottom = Math.min(rect.bottom, window.innerHeight);
    const visible = bottom - top;
    if (visible < 24 || rect.right < 0 || rect.left > window.innerWidth) return false;
    const h = Math.max(22, Math.min(visible, visible * el.clientHeight / el.scrollHeight));
    const fraction = el.scrollTop / Math.max(1, el.scrollHeight - el.clientHeight);
    const y = top + Math.max(0, visible - h) * Math.max(0, Math.min(1, fraction));
    const bar = ensureThumb();
    bar.style.top = `${y}px`;
    bar.style.left = `${Math.min(window.innerWidth - 5, rect.right - 7)}px`;
    bar.style.height = `${h}px`;
    return true;
  }
  function hide() {
    if (thumb) thumb.classList.remove('nf-active');
    active = null;
  }
  document.addEventListener('scroll', e => {
    const el = getScroller(e.target);
    if (!el) return;
    active = el;
    if (position(el)) ensureThumb().classList.add('nf-active');
    clearTimeout(timer);
    timer = setTimeout(hide, 1000);
  }, true);
  window.addEventListener('resize', () => { if (active && !position(active)) hide(); });
  document.addEventListener('click', e => {
    if (active && !e.target.closest(selector)) hide();
  }, true);
})();
</script>
</body></html>
