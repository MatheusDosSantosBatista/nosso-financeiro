<style>
:root{--bg:#f5f1eb;--card:#fffdf9;--ink:#302b27;--muted:#786f68;--navy:#243447;--terr:#b66f55;--moss:#65705a;--beige:#e5d8c8;--line:#e8e0d7;--danger:#a34f45;--shadow:0 8px 28px #302b2710}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{display:flex;min-height:100vh}.side{width:245px;background:#fffaf4;border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh}.brand{font-weight:800;font-size:21px;padding:4px 10px 25px;color:var(--navy)}.brand small{display:block;font-weight:500;color:var(--muted);font-size:11px;margin-top:4px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:11px;color:#5c554f}.nav button.active,.nav button:hover{background:var(--beige);color:var(--ink);font-weight:700}.main{flex:1;padding:26px;max-width:1500px;margin:auto;width:100%}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.title h1{margin:0;font-size:28px}.title p{margin:5px 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fffdf9;border-radius:10px;padding:10px 14px;color:var(--ink)}.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.danger{color:var(--danger)}.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.metric small,.muted{color:var(--muted)}.metric strong{display:block;font-size:25px;margin:7px 0}.positive{color:var(--moss)}.negative{color:var(--danger)}.section{margin-top:20px}.section h2{font-size:18px;margin:0 0 12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.list{display:grid;gap:9px}.item{display:flex;align-items:center;gap:11px;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff}.thumb{width:42px;height:42px;border-radius:10px;object-fit:cover;background:var(--beige);display:grid;place-items:center;font-size:20px;flex:0 0 42px}.item .info{flex:1;min-width:0}.item .info b{display:block}.item .info span{font-size:12px;color:var(--muted)}.tag{padding:4px 8px;border-radius:20px;background:#eee6dd;font-size:11px}.bar{height:9px;background:#eee8e0;border-radius:9px;overflow:hidden}.fill{height:100%;background:var(--terr)}.form{display:grid;gap:12px}.form label{display:grid;gap:6px;font-size:12px;color:var(--muted);font-weight:600}.form input,.form select,.form textarea{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px;color:var(--ink);outline:none}.form textarea{min-height:80px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.formgrid .full{grid-column:1/-1}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);font-size:13px}.table th{color:var(--muted);font-size:11px;text-transform:uppercase}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.notice{padding:12px 14px;border-radius:12px;background:#f1eadf;color:#655a50;margin-bottom:14px}.modal{position:fixed;inset:0;background:#302b2755;display:grid;place-items:center;padding:20px;z-index:10}.modalbox{background:var(--card);border-radius:18px;width:min(720px,100%);max-height:90vh;overflow:auto;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.close{border:0;background:transparent;font-size:22px}.progressline{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:8px 0}.mini{font-size:11px;color:var(--muted)}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(430px,100%);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:var(--shadow)}.loginbox h1{margin:0;color:var(--navy);font-size:28px}.loginbox p{color:var(--muted);line-height:1.5}.loginbox .form{margin-top:22px}.status{padding:10px 12px;border-radius:10px;background:#f1eadf;color:#655a50;font-size:13px}.switch{display:flex;gap:6px;padding:4px;background:#eee8e0;border-radius:11px}.switch button{flex:1;border:0;background:transparent;padding:8px;border-radius:8px}.switch button.active{background:#fff;color:var(--navy);font-weight:700}.userpill{display:flex;align-items:center;gap:8px}.avatar{width:34px;height:34px;border-radius:50%;background:var(--beige);display:grid;place-items:center;font-weight:700}.authbar{display:flex;align-items:center;gap:10px}.smallbtn{border:0;background:transparent;color:var(--muted);font-size:12px}.toast{position:fixed;right:18px;bottom:18px;background:var(--navy);color:#fff;padding:12px 15px;border-radius:12px;z-index:30;box-shadow:var(--shadow)}@media(max-width:900px){.side{width:72px;padding:18px 8px}.brand{font-size:0}.brand:before{content:"NF";font-size:18px}.brand small,.nav button span{display:none}.nav button{text-align:center}.main{padding:18px}.g4,.g3{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.side{display:none}.main{padding:14px}.top{align-items:flex-start;gap:10px}.g4,.g3,.g2,.formgrid{grid-template-columns:1fr}.title h1{font-size:23px}.authbar .userpill{display:none}}
</style>

<body>
<div id="root"></div>
<script>
const SUPABASE_URL='https://tkbzgewhaguetumpqweq.supabase.co';
const SUPABASE_KEY='sb_publishable_qAiYf6vwU_pYY8LZDNt1rg_VWctios6';
if(!window.supabase || typeof window.supabase.createClient!=='function'){document.getElementById('root').innerHTML='<div class="login"><div class="loginbox"><h1>Nosso Financeiro</h1><div class="status">Não foi possível carregar o módulo de conexão. Verifique sua internet e tente abrir novamente.</div></div></div>'; throw new Error('Supabase JS não carregou');}
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let state={user:null,profile:null,coupleId:null,page:'dashboard',view:'couple',loading:true,realtime:null};
const brl=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const toast=(m)=>{let e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)};
function diag(msg,ok=false){let r=document.getElementById('diag');if(!r)return;let d=document.createElement('div');d.className='status';d.style.marginTop='8px';d.style.background=ok?'#e8f1e8':'#f7e8e5';d.innerHTML=(ok?'✅ ':'❌ ')+esc(msg);r.appendChild(d)}
async function init(){document.getElementById('root').innerHTML='<div class="login"><div class="loginbox"><h1>Nosso Financeiro</h1><p>Diagnóstico de conexão</p><div id="diag"></div></div></div>';try{if(!window.supabase||typeof window.supabase.createClient!=='function')throw new Error('Biblioteca Supabase não carregou');diag('Biblioteca Supabase carregada',true);let res=await fetch(SUPABASE_URL+'/auth/v1/settings',{method:'GET',headers:{'apikey':SUPABASE_KEY}});diag('Endpoint Supabase respondeu: HTTP '+res.status,res.ok||res.status===400||res.status===401);let body='';try{body=await res.text()}catch(_){}if(!res.ok)throw new Error('Endpoint auth/v1/settings retornou HTTP '+res.status+(body?' — '+body.slice(0,300):''));const {data:{session},error}=await sb.auth.getSession();if(error)throw new Error('Auth getSession: '+error.message);diag('Auth getSession funcionando',true);state.user=session?.user||null;if(state.user){diag('Sessão encontrada: '+state.user.email,true);await loadContext();}else diag('Nenhuma sessão ativa. Isso é normal antes do login.',true);await render();sb.auth.onAuthStateChange(async(_e,s)=>{state.user=s?.user||null;if(state.user) await loadContext();else {state.profile=null;state.coupleId=null}await render()});}catch(e){console.error('DIAGNÓSTICO',e);diag('FALHA: '+(e?.message||String(e)),false);}}
async function setupRealtime(){if(!state.coupleId)return;if(state.realtime){try{await sb.removeChannel(state.realtime)}catch(e){}}state.realtime=sb.channel('nosso-financeiro-'+state.coupleId).on('postgres_changes',{event:'*',schema:'public',table:'transactions',filter:'couple_id=eq.'+state.coupleId},()=>render()).on('postgres_changes',{event:'*',schema:'public',table:'accounts',filter:'couple_id=eq.'+state.coupleId},()=>render()).on('postgres_changes',{event:'*',schema:'public',table:'debts',filter:'couple_id=eq.'+state.coupleId},()=>render()).on('postgres_changes',{event:'*',schema:'public',table:'projects',filter:'couple_id=eq.'+state.coupleId},()=>render()).on('postgres_changes',{event:'*',schema:'public',table:'goals',filter:'couple_id=eq.'+state.coupleId},()=>render()).subscribe();}
async function loadContext(){let r=await sb.from('profiles').select('*').eq('id',state.user.id).maybeSingle();if(r.error)throw new Error('Tabela profiles: '+r.error.message+' (HTTP '+(r.status||'?')+')');state.profile=r.data;diag('Tabela profiles acessível',true);let {data:cm,error,status}=await sb.from('couple_members').select('couple_id,role').eq('user_id',state.user.id).maybeSingle();if(error)throw new Error('Tabela couple_members: '+error.message+' (HTTP '+(status||'?')+')');state.coupleId=cm?.couple_id||null;diag(state.coupleId?'Vínculo com o casal encontrado':'Usuário sem vínculo com casal',!!state.coupleId);if(state.coupleId){await ensureProjects();await setupRealtime();}}
async function ensureProjects(){let {count}=await sb.from('projects').select('*',{count:'exact',head:true}).eq('couple_id',state.coupleId);if(count===0){await sb.from('projects').insert([{couple_id:state.coupleId,name:'Casamento',emoji:'💍',target_amount:60000,saved_amount:0},{couple_id:state.coupleId,name:'Casa',emoji:'🏠',target_amount:0,saved_amount:0},{couple_id:state.coupleId,name:'Carro',emoji:'🚗',target_amount:0,saved_amount:0},{couple_id:state.coupleId,name:'Viagem',emoji:'✈️',target_amount:0,saved_amount:0},{couple_id:state.coupleId,name:'Filho',emoji:'👶',target_amount:0,saved_amount:0}]);}}
function login(){return `<div class="login"><div class="loginbox"><div style="font-size:34px">💍</div><h1>Nosso Financeiro</h1><p>Organização financeira para vocês dois. Entre com sua própria conta para manter seus dados individuais separados e compartilhar o que for do casal.</p><div id="loginMsg" class="status hidden"></div><form class="form" onsubmit="doLogin(event)"><label>E-mail<input id="email" type="email" required autocomplete="email"></label><label>Senha<input id="password" type="password" required autocomplete="current-password"></label><button class="btn primary" type="submit">Entrar</button></form></div></div>`}
function shell(content){let name=state.profile?.display_name||state.user?.email?.split('@')[0]||'Você';return `<div class="app"><aside class="side"><div class="brand">Nosso Financeiro<small>organização a dois</small></div><div class="nav">${nav('dashboard','⌂','Visão geral')}${nav('lancamentos','↕','Lançamentos')}${nav('contas','💳','Contas e cartões')}${nav('dividas','◒','Dívidas')}${nav('projetos','♡','Projetos do casal')}${nav('objetivos','🎯','Objetivos')}${nav('relatorios','▥','Relatórios')}${nav('config','⚙','Configurações')}</div></aside><main class="main"><div class="top"><div></div><div class="authbar"><div class="userpill"><div class="avatar">${esc(name[0]?.toUpperCase()||'V')}</div><span>${esc(name)}</span></div><button class="smallbtn" onclick="logout()">Sair</button></div></div>${content}</main></div><div id="modalRoot"></div>`}
function nav(k,emoji,label){return `<button onclick="go('${k}')" class="${state.page===k?'active':''}"><span>${emoji} ${label}</span></button>`}
function layout(title,sub,actions=''){return `<div class="top"><div class="title"><h1>${title}</h1><p>${sub}</p></div><div class="actions">${actions}</div></div>`}
async function data(){if(!state.coupleId)return {transactions:[],accounts:[],debts:[],projects:[],goals:[]};let [t,a,d,p,g]=await Promise.all([sb.from('transactions').select('*').eq('couple_id',state.coupleId).order('transaction_date',{ascending:false}),sb.from('accounts').select('*').eq('couple_id',state.coupleId).order('created_at',{ascending:false}),sb.from('debts').select('*').eq('couple_id',state.coupleId).order('created_at',{ascending:false}),sb.from('projects').select('*').eq('couple_id',state.coupleId).order('created_at'),sb.from('goals').select('*').eq('couple_id',state.coupleId).order('created_at')]);return {transactions:t.data||[],accounts:a.data||[],debts:d.data||[],projects:p.data||[],goals:g.data||[]}}
function projectCard(p){let pct=Number(p.target_amount)?Math.min(100,Number(p.saved_amount)/Number(p.target_amount)*100):0;return `<div class="item" onclick="editProject('${p.id}')" style="cursor:pointer"><div class="thumb">${esc(p.emoji||'🎯')}</div><div class="info"><b>${esc(p.name)}</b><span>${esc(p.target_date||'Data não definida')} · ${esc(p.place||'Local não definido')}</span><div class="progressline"><span>${brl(p.saved_amount)} de ${brl(p.target_amount)}</span><span>${pct.toFixed(0)}%</span></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div></div></div>`}
async function dashboard(){let x=await data(), mine=x.transactions.filter(t=>t.owner_user_id===state.user.id&&t.ownership==='individual'), shared=x.transactions.filter(t=>t.ownership==='couple'), all=x.transactions;let mr=mine.filter(t=>t.kind==='income').reduce((s,t)=>s+Number(t.amount),0),md=mine.filter(t=>t.kind==='expense').reduce((s,t)=>s+Number(t.amount),0),cr=all.filter(t=>t.kind==='income').reduce((s,t)=>s+Number(t.amount),0),cd=all.filter(t=>t.kind==='expense').reduce((s,t)=>s+Number(t.amount),0),debt=x.debts.reduce((s,d)=>s+Number(d.remaining_amount),0);return layout('Nossa vida financeira','Visão individual + visão do casal, sincronizadas na nuvem.',`<button class="btn" onclick="openForm('expense')">+ Gasto</button><button class="btn primary" onclick="openForm('income')">+ Receita</button>`)+`<div class="switch" style="max-width:420px;margin-bottom:16px"><button class="${state.view==='individual'?'active':''}" onclick="state.view='individual';render()">👤 Minha visão</button><button class="${state.view==='couple'?'active':''}" onclick="state.view='couple';render()">💍 Visão do casal</button></div><div class="grid g4"><div class="card metric"><small>Minha receita</small><strong>${brl(mr)}</strong><span class="positive">Individual</span></div><div class="card metric"><small>Minha despesa</small><strong>${brl(md)}</strong><span class="negative">Individual</span></div><div class="card metric"><small>Receitas do casal</small><strong>${brl(cr)}</strong><span class="positive">Compartilhado + individuais visíveis</span></div><div class="card metric"><small>Dívidas restantes</small><strong>${brl(debt)}</strong><span class="muted">A pagar</span></div></div><div class="section grid g2"><div class="card"><div class="row"><h2>Projetos</h2><button class="btn" onclick="go('projetos')">Ver todos</button></div><div class="list">${x.projects.slice(0,5).map(projectCard).join('')||'<div class="empty">Nenhum projeto ainda.</div>'}</div></div><div class="card"><div class="row"><h2>Últimos lançamentos</h2><button class="btn" onclick="openForm('expense')">Adicionar</button></div><div class="list">${all.slice(0,5).map(t=>`<div class="item"><div class="thumb">${t.kind==='expense'?'💸':'💰'}</div><div class="info"><b>${esc(t.description)}</b><span>${t.ownership==='couple'?'💍 Casal':'👤 Individual'} · ${esc(t.transaction_date)}</span></div><strong class="${t.kind==='expense'?'negative':'positive'}">${t.kind==='expense'?'-':''}${brl(t.amount)}</strong></div>`).join('')||'<div class="empty">Nenhum lançamento cadastrado.</div>'}</div></div></div><div class="section card"><h2>Como estamos organizados</h2><div class="notice">🔐 Cada um entra com seu próprio login. Registros marcados como <b>Individual</b> ficam vinculados ao usuário; registros <b>Casal</b> são compartilhados.</div><div class="grid g3"><div><div class="mini">Meu saldo</div><strong>${brl(mr-md)}</strong></div><div><div class="mini">Saldo considerando tudo visível</div><strong>${brl(cr-cd)}</strong></div><div><div class="mini">Projetos ativos</div><strong>${x.projects.length}</strong></div></div></div>`}
async function lancamentos(){let x=await data();return layout('Lançamentos','Receitas e despesas sincronizadas entre os dispositivos.',`<button class="btn" onclick="openForm('income')">+ Receita</button><button class="btn primary" onclick="openForm('expense')">+ Despesa</button>`)+`<div class="card"><table class="table"><thead><tr><th>Item</th><th>Tipo</th><th>Quem</th><th>Categoria</th><th>Data</th><th>Valor</th><th></th></tr></thead><tbody>${x.transactions.map(t=>`<tr><td>${esc(t.description)}</td><td>${t.kind==='expense'?'Despesa':'Receita'}</td><td>${t.ownership==='couple'?'💍 Casal':'👤 Individual'}</td><td>${esc(t.category_id||'-')}</td><td>${esc(t.transaction_date)}</td><td class="${t.kind==='expense'?'negative':'positive'}">${t.kind==='expense'?'-':''}${brl(t.amount)}</td><td><button class="btn" onclick="del('transactions','${t.id}')">Excluir</button></td></tr>`).join('')||'<tr><td colspan="7"><div class="empty">Nenhum lançamento.</div></td></tr>'}</tbody></table></div>`}
async function contas(){let x=await data();return layout('Contas e cartões','Bancos, cartões e contas que vocês utilizam.',`<button class="btn primary" onclick="openForm('account')">+ Nova conta/cartão</button>`)+`<div class="grid g3">${x.accounts.map(a=>`<div class="card"><div class="thumb">💳</div><h3>${esc(a.name)}</h3><p class="muted">${esc(a.institution||a.account_type)} · ${a.ownership==='couple'?'Casal':'Individual'}</p><strong>${brl(a.current_balance)}</strong><div style="margin-top:12px"><button class="btn" onclick="del('accounts','${a.id}')">Excluir</button></div></div>`).join('')||'<div class="empty">Cadastrem bancos, contas e cartões. A opção de imagem ficará disponível quando vocês quiserem.</div>'}</div>`}
async function dividas(){let x=await data();return layout('Dívidas e parcelas','Acompanhe o que falta pagar.',`<button class="btn primary" onclick="openForm('debt')">+ Nova dívida</button>`)+`<div class="list">${x.debts.map(d=>{let pct=Number(d.total_amount)?(Number(d.total_amount)-Number(d.remaining_amount))/Number(d.total_amount)*100:0;return `<div class="card"><div class="row"><div><h3>${esc(d.name)}</h3><span class="muted">${d.installments_total||'-'} parcelas · ${d.ownership==='couple'?'Casal':'Individual'}</span></div><strong>${brl(d.remaining_amount)}</strong></div><div class="progressline"><span>Pago ${brl(Number(d.total_amount)-Number(d.remaining_amount))}</span><span>${pct.toFixed(0)}%</span></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div><div style="margin-top:12px"><button class="btn" onclick="del('debts','${d.id}')">Excluir</button></div></div>`}).join('')||'<div class="empty">Nenhuma dívida cadastrada.</div>'}</div>`}
async function projetos(){let x=await data();return layout('Projetos do casal','Grandes planos com meta, data, local e informações editáveis.',`<button class="btn primary" onclick="openForm('project')">+ Novo projeto</button>`)+`<div class="grid g3">${x.projects.map(projectCard).join('')||'<div class="empty">Nenhum projeto.</div>'}</div>`}
async function objetivos(){let x=await data();return layout('Objetivos','Metas financeiras que podem ser individuais ou do casal.',`<button class="btn primary" onclick="openForm('goal')">+ Novo objetivo</button>`)+`<div class="grid g3">${x.goals.map(g=>{let pct=Number(g.target_amount)?Math.min(100,Number(g.saved_amount)/Number(g.target_amount)*100):0;return `<div class="card"><div class="thumb">🎯</div><h3>${esc(g.name)}</h3><p class="muted">${g.ownership==='couple'?'💍 Casal':'👤 Individual'} · ${esc(g.deadline||'Sem prazo')}</p><strong>${brl(g.saved_amount)} / ${brl(g.target_amount)}</strong><div class="bar" style="margin-top:10px"><div class="fill" style="width:${pct}%"></div></div><div style="margin-top:12px"><button class="btn" onclick="del('goals','${g.id}')">Excluir</button></div></div>`}).join('')||'<div class="empty">Nenhum objetivo.</div>'}</div>`}
async function relatorios(){let x=await data(),r=x.transactions.filter(t=>t.kind==='income').reduce((s,t)=>s+Number(t.amount),0),d=x.transactions.filter(t=>t.kind==='expense').reduce((s,t)=>s+Number(t.amount),0);return layout('Relatórios','Resumo dos dados que já estão no banco.')+`<div class="grid g3"><div class="card metric"><small>Receitas</small><strong>${brl(r)}</strong></div><div class="card metric"><small>Despesas</small><strong>${brl(d)}</strong></div><div class="card metric"><small>Comprometimento</small><strong>${r?(d/r*100).toFixed(1):0}%</strong></div></div><div class="section card"><div class="notice">📊 Os relatórios passam a refletir os lançamentos reais dos dois usuários conforme a base for preenchida.</div></div>`}
function config(){return layout('Configurações','Conta, casal e conexão.')+`<div class="card"><h2>Perfil</h2><p><b>${esc(state.profile?.display_name||'Usuário')}</b><br><span class="muted">${esc(state.user?.email||'')}</span></p><div class="notice">☁️ Conectado ao Supabase. Seus dados não dependem do navegador onde o site foi aberto.</div><button class="btn danger" onclick="logout()">Sair da conta</button></div>`}
async function render(){if(!state.user){document.getElementById('root').innerHTML=login();return}if(!state.coupleId){document.getElementById('root').innerHTML='<div class="login"><div class="loginbox"><h1>Quase pronto</h1><p>Seu usuário foi autenticado, mas ainda não encontramos o vínculo com o casal.</p></div></div>';return}let fn={dashboard,lancamentos,contas,dividas,projetos,objetivos,relatorios,config}[state.page]||dashboard;let content=await fn();document.getElementById('root').innerHTML=shell(content)}
async function doLogin(e){e.preventDefault();let email=document.getElementById('email').value,password=document.getElementById('password').value;let m=document.getElementById('loginMsg');m.classList.remove('hidden');m.textContent='Entrando...';let {error}=await sb.auth.signInWithPassword({email,password});if(error){m.textContent=error.message;return}m.textContent='Login realizado.'}
async function logout(){await sb.auth.signOut()}
function go(p){state.page=p;render()}
async function del(table,id){if(!confirm('Excluir este item?'))return;let {error}=await sb.from(table).delete().eq('id',id);if(error)toast(error.message);else{toast('Excluído');render()}}
function modal(title,fields,submit){document.getElementById('modalRoot').innerHTML=`<div class="modal"><div class="modalbox"><div class="modalhead"><h2>${title}</h2><button class="close" onclick="closeModal()">×</button></div><form class="form" onsubmit="${submit}">${fields}<div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar</button></div></form></div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function ownField(){return `<label>Visibilidade<select id="f_ownership"><option value="individual">👤 Só meu</option><option value="couple">💍 Casal</option></select></label>`}
function openForm(type){if(type==='income'||type==='expense'){modal(type==='income'?'Nova receita':'Novo gasto',`<div class="formgrid"><label>Descrição<input id="f_desc" required placeholder="Ex.: Salário, supermercado"></label><label>Valor<input id="f_amount" required type="number" step="0.01"></label><label>Categoria<input id="f_category" placeholder="Ex.: Alimentação"></label><label>Data<input id="f_date" type="date" value="${new Date().toISOString().slice(0,10)}"></label>${ownField()}<label>Forma de pagamento<input id="f_payment" placeholder="Pix, Nubank, dinheiro..."></label><label class="full">Observações<textarea id="f_notes"></textarea></label></div>`,`submitTransaction(event,'${type}')`);return}
if(type==='account'){modal('Nova conta ou cartão',`<div class="formgrid"><label>Nome<input id="f_name" required placeholder="Nubank"></label><label>Instituição<input id="f_inst" placeholder="Nubank"></label><label>Tipo<select id="f_type"><option value="bank">Conta bancária</option><option value="credit_card">Cartão de crédito</option><option value="savings">Poupança</option><option value="wallet">Carteira</option></select></label><label>Saldo atual<input id="f_balance" type="number" step="0.01" value="0"></label>${ownField()}<label>Observações<textarea id="f_notes"></textarea></label></div>`,`submitAccount(event)`);return}
if(type==='debt'){modal('Nova dívida',`<div class="formgrid"><label>Nome<input id="f_name" required placeholder="Ex.: Financiamento"></label><label>Valor total<input id="f_total" type="number" step="0.01"></label><label>Valor restante<input id="f_remaining" type="number" step="0.01"></label><label>Total de parcelas<input id="f_installments" type="number"></label>${ownField()}<label>Próximo vencimento<input id="f_due" type="date"></label><label class="full">Observações<textarea id="f_notes"></textarea></label></div>`,`submitDebt(event)`);return}
if(type==='project'){modal('Novo projeto',`<div class="formgrid"><label>Nome<input id="f_name" required placeholder="Ex.: Casamento 2027"></label><label>Emoji<input id="f_emoji" value="🎯"></label><label>Meta financeira<input id="f_target" type="number" step="0.01" value="0"></label><label>Já reservado<input id="f_saved" type="number" step="0.01" value="0"></label><label>Data<input id="f_date" type="date"></label><label>Local/destino<input id="f_place" placeholder="Recife, Santiago..."></label><label class="full">Observações<textarea id="f_notes"></textarea></label></div>`,`submitProject(event)`);return}
if(type==='goal'){modal('Novo objetivo',`<div class="formgrid"><label>Nome<input id="f_name" required placeholder="Ex.: Reserva de emergência"></label><label>Meta<input id="f_target" type="number" step="0.01"></label><label>Já guardado<input id="f_saved" type="number" step="0.01"></label>${ownField()}<label>Prazo<input id="f_deadline" type="date"></label><label class="full">Observações<textarea id="f_notes"></textarea></label></div>`,`submitGoal(event)`)}}
function v(id){return document.getElementById(id)?.value||''}
async function submitTransaction(e,type){e.preventDefault();let {error}=await sb.from('transactions').insert({couple_id:state.coupleId,owner_user_id:state.user.id,description:v('f_desc'),amount:Number(v('f_amount')),kind:type==='income'?'income':'expense',ownership:v('f_ownership'),payment_method:v('f_payment'),transaction_date:v('f_date'),notes:v('f_notes')});if(error)toast(error.message);else{closeModal();toast('Lançamento salvo na nuvem');render()}}
async function submitAccount(e){e.preventDefault();let own=v('f_ownership');let {error}=await sb.from('accounts').insert({couple_id:state.coupleId,owner_user_id:state.user.id,name:v('f_name'),account_type:v('f_type'),ownership:own,institution:v('f_inst'),current_balance:Number(v('f_balance')),notes:v('f_notes')});if(error)toast(error.message);else{closeModal();toast('Conta salva');render()}}
async function submitDebt(e){e.preventDefault();let {error}=await sb.from('debts').insert({couple_id:state.coupleId,owner_user_id:state.user.id,name:v('f_name'),ownership:v('f_ownership'),total_amount:Number(v('f_total')),remaining_amount:Number(v('f_remaining')),installments_total:Number(v('f_installments'))||null,next_due_date:v('f_due')||null,notes:v('f_notes')});if(error)toast(error.message);else{closeModal();toast('Dívida salva');render()}}
async function submitProject(e){e.preventDefault();let {error}=await sb.from('projects').insert({couple_id:state.coupleId,name:v('f_name'),emoji:v('f_emoji'),target_amount:Number(v('f_target')),saved_amount:Number(v('f_saved')),target_date:v('f_date')||null,place:v('f_place'),notes:v('f_notes')});if(error)toast(error.message);else{closeModal();toast('Projeto salvo');render()}}
async function submitGoal(e){e.preventDefault();let {error}=await sb.from('goals').insert({couple_id:state.coupleId,owner_user_id:state.user.id,name:v('f_name'),ownership:v('f_ownership'),target_amount:Number(v('f_target')),saved_amount:Number(v('f_saved')),deadline:v('f_deadline')||null,notes:v('f_notes')});if(error)toast(error.message);else{closeModal();toast('Objetivo salvo');render()}}
async function editProject(pid){let {data:p,error}=await sb.from('projects').select('*').eq('id',pid).single();if(error||!p)return;modal('Editar projeto',`<div class="formgrid"><label>Nome<input id="f_name" value="${esc(p.name)}"></label><label>Emoji<input id="f_emoji" value="${esc(p.emoji||'🎯')}"></label><label>Meta<input id="f_target" type="number" step="0.01" value="${p.target_amount||0}"></label><label>Já reservado<input id="f_saved" type="number" step="0.01" value="${p.saved_amount||0}"></label><label>Data<input id="f_date" type="date" value="${p.target_date||''}"></label><label>Local/destino<input id="f_place" value="${esc(p.place||'')}"></label><label class="full">Observações<textarea id="f_notes">${esc(p.notes||'')}</textarea></label></div>`,`submitProjectEdit(event,'${pid}')`)}
async function submitProjectEdit(e,pid){e.preventDefault();let {error}=await sb.from('projects').update({name:v('f_name'),emoji:v('f_emoji'),target_amount:Number(v('f_target')),saved_amount:Number(v('f_saved')),target_date:v('f_date')||null,place:v('f_place'),notes:v('f_notes'),updated_at:new Date().toISOString()}).eq('id',pid);if(error)toast(error.message);else{closeModal();toast('Projeto atualizado');render()}}
init();
</script>
</body></html>
