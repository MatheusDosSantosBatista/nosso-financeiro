/* Tema escuro opcional */
body.dark-mode{--bg:#050608;--card:#111418;--ink:#f5f7fa;--muted:#a7b0bc;--navy:#8ab4e0;--terr:#6fa8dc;--moss:#58c58a;--beige:#202833;--line:#303741;--danger:#ff7770;--shadow:0 8px 28px #00000055;background:var(--bg);color:var(--ink)}
body.dark-mode .side,body.dark-mode .btn,body.dark-mode .item,body.dark-mode .form input,body.dark-mode .form select,body.dark-mode .form textarea,body.dark-mode .loginbox,body.dark-mode .modalbox{background:var(--card)!important;color:var(--ink)!important;border-color:var(--line)!important}

/* Identidade visual profissional — cores secundárias com significado */
:root{
  --bg:#f5f7fb; --card:#ffffff; --ink:#182638; --muted:#687789;
  --navy:#193b5a; --terr:#3977a8; --moss:#23845b; --beige:#edf2f8;
  --line:#e0e7ef; --danger:#c0392b; --shadow:0 8px 26px rgba(28,48,74,.07);
  --accent-blue:#3478b8; --accent-teal:#138a8a; --accent-purple:#7564bd;
  --accent-coral:#d66b58; --accent-green:#27845b; --accent-amber:#b98220;
}
body{background:var(--bg);color:var(--ink)}
.side{background:linear-gradient(180deg,#fff 0%,#f8faff 100%);box-shadow:3px 0 18px rgba(25,59,90,.025)}
.brand{color:#193b5a;letter-spacing:-.55px;position:relative}
.brand:after{content:"";display:block;width:42px;height:4px;border-radius:5px;margin:12px 0 0 0;background:linear-gradient(90deg,#3478b8 0 34%,#138a8a 34% 67%,#7564bd 67%)}
.brand small{letter-spacing:.1px}
.nav{gap:7px}
.nav button{border:1px solid transparent;transition:background .18s ease,border-color .18s ease,transform .18s ease;font-weight:500}
.nav button:hover{transform:translateX(2px)}
.nav button:nth-child(1).active{background:#e7f0fb;color:#245f9b;border-color:#d3e4f7}
.nav button:nth-child(2).active{background:#e1f5f2;color:#087b76;border-color:#c5eae5}
.nav button:nth-child(3).active{background:#eee9fc;color:#6651ad;border-color:#ded5fa}
.nav button:nth-child(4).active{background:#fff0e9;color:#b84d35;border-color:#f8d9cc}
.nav button:nth-child(5).active{background:#fbe8ef;color:#ad3e69;border-color:#f4d1df}
.nav button:nth-child(6).active{background:#e5f5e9;color:#237348;border-color:#cdebd6}
.nav button:nth-child(7).active{background:#fff4d9;color:#91600b;border-color:#f5e4b1}
.nav button:nth-child(8).active{background:#e9eef3;color:#4a5b6c;border-color:#d9e1e9}
.title h1{color:#183b5b;letter-spacing:-.8px;font-weight:800;position:relative;padding-left:14px}
.title h1:before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:4px;border-radius:5px;background:linear-gradient(180deg,#3478b8,#138a8a)}
.title p{font-size:13px}
.section h2{color:#234765;font-weight:750;letter-spacing:-.25px}
.card{box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease;border-radius:16px}
.card:hover{box-shadow:0 12px 30px rgba(28,48,74,.09)}
.grid.g4>.card:nth-child(4n+1){border-top:3px solid #3478b8}
.grid.g4>.card:nth-child(4n+2){border-top:3px solid #138a8a}
.grid.g4>.card:nth-child(4n+3){border-top:3px solid #7564bd}
.grid.g4>.card:nth-child(4n){border-top:3px solid #d66b58}
.grid.g3>.card:nth-child(3n+1){border-top:3px solid #3478b8}
.grid.g3>.card:nth-child(3n+2){border-top:3px solid #138a8a}
.grid.g3>.card:nth-child(3n){border-top:3px solid #7564bd}
.grid.g2>.card:nth-child(2n+1){border-top:3px solid #3478b8}
.grid.g2>.card:nth-child(2n){border-top:3px solid #138a8a}
.metric strong{letter-spacing:-.7px;font-weight:800}
.metric small{font-weight:650;letter-spacing:.15px}
.tag{background:#e8f0f8;color:#355b7c;font-weight:650}
.thumb{background:#edf3fa}
.btn{transition:filter .15s ease,transform .15s ease;box-shadow:0 1px 2px rgba(15,23,42,.025)}
.btn:hover{filter:brightness(.98);transform:translateY(-1px)}
.btn.primary{background:#244f76;border-color:#244f76}
.form input:focus,.form select:focus,.form textarea:focus{border-color:#5d9bd0;box-shadow:0 0 0 3px rgba(52,120,184,.13)}
.notice{background:#eaf2fa;color:#2d4d69;border-left:3px solid #3478b8}
.status{background:#eaf2fa;color:#2d4d69}
.loginbox h1{color:#193b5a;letter-spacing:-.8px}
.avatar{background:#dceafa;color:#244f76}

/* Paleta equivalente no tema escuro, mantendo contraste e identidade */
body.dark-mode{--bg:#07090d;--card:#11161d;--ink:#f4f7fb;--muted:#a4afbd;--navy:#9ac7f0;--terr:#78b4e5;--moss:#65d29b;--beige:#202a36;--line:#2a3542;--danger:#ff8178;--shadow:0 8px 28px rgba(0,0,0,.32);background:#07090d;color:#f4f7fb}
body.dark-mode .side{background:linear-gradient(180deg,#10151c 0%,#0c1117 100%);border-color:#27313c}
body.dark-mode .brand{color:#e8f2fc}
body.dark-mode .title h1{color:#f0f6fc}
body.dark-mode .section h2{color:#d8e8f7}
body.dark-mode .nav button:nth-child(1).active{background:#1b3045;color:#b7dcff;border-color:#294866}
body.dark-mode .nav button:nth-child(2).active{background:#153533;color:#a4eee5;border-color:#245451}
body.dark-mode .nav button:nth-child(3).active{background:#292340;color:#d2c7ff;border-color:#403565}
body.dark-mode .nav button:nth-child(4).active{background:#3a2522;color:#ffc0ad;border-color:#5b3731}
body.dark-mode .nav button:nth-child(5).active{background:#3a202c;color:#ffc0d5;border-color:#5c3043}
body.dark-mode .nav button:nth-child(6).active{background:#1b3327;color:#b0efc3;border-color:#2b513a}
body.dark-mode .nav button:nth-child(7).active{background:#382e19;color:#ffe1a0;border-color:#594824}
body.dark-mode .nav button:nth-child(8).active{background:#252d36;color:#d3dee8;border-color:#3b4856}
body.dark-mode .tag{background:#202c39;color:#d2e5f7}
body.dark-mode .thumb{background:#202c39}
body.dark-mode .notice,body.dark-mode .status{background:#1a2938!important;color:#d8e9f8!important;border-left-color:#6ca6d8}
body.dark-mode .avatar{background:#233c54;color:#c9e4ff}
body.dark-mode .grid.g4>.card,body.dark-mode .grid.g3>.card,body.dark-mode .grid.g2>.card{border-left-color:var(--line);border-right-color:var(--line);border-bottom-color:var(--line)}
body.dark-mode .grid.g4>.card:nth-child(4n+1),body.dark-mode .grid.g3>.card:nth-child(3n+1),body.dark-mode .grid.g2>.card:nth-child(2n+1){border-top-color:#5b9fe0}
body.dark-mode .grid.g4>.card:nth-child(4n+2),body.dark-mode .grid.g3>.card:nth-child(3n+2),body.dark-mode .grid.g2>.card:nth-child(2n){border-top-color:#45bdb3}
body.dark-mode .grid.g4>.card:nth-child(4n+3),body.dark-mode .grid.g3>.card:nth-child(3n){border-top-color:#a397ec}
body.dark-mode .grid.g4>.card:nth-child(4n){border-top-color:#ee927e}
@media(max-width:900px){.nav button:hover{transform:none}}



/* Cores semânticas para receitas e despesas */
:root{--income:#21845b;--income-soft:#e4f5eb;--expense:#c44848;--expense-soft:#fdeaea;--progress-red:#e04444;--progress-orange:#f39a38;--progress-yellow:#d8bd42;--progress-green:#27845b}
.positive{color:var(--income)!important;font-weight:700}
.negative{color:var(--expense)!important;font-weight:700}
.finance-positive-value{color:var(--income)!important}
.finance-negative-value{color:var(--expense)!important}
.item strong.positive,.item strong.negative{padding:6px 9px;border-radius:8px;white-space:nowrap;font-size:13px}
.item strong.positive{background:var(--income-soft)}
.item strong.negative{background:var(--expense-soft)}
.metric .positive,.metric .negative{display:inline-flex;align-items:center;gap:5px;width:max-content;max-width:100%;padding:5px 8px;border-radius:8px;font-size:11px}
.metric .positive{background:var(--income-soft)}
.metric .negative{background:var(--expense-soft)}
.bar{height:10px;background:#e9edf2;border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(15,23,42,.06)}
.fill{height:100%;border-radius:99px;background:var(--progress-red);transition:width .45s ease,background-color .45s ease;box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.nav button{display:flex;align-items:center;gap:11px;min-height:43px}
.nav button .nav-icon{width:19px;height:19px;flex:0 0 19px;display:inline-grid;place-items:center;color:currentColor;opacity:.9}
.nav button .nav-icon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.active .nav-icon{opacity:1}
.thumb{border:1px solid rgba(100,116,139,.12);box-shadow:0 2px 5px rgba(15,23,42,.035);font-size:19px}
body.dark-mode{--income:#70d6a0;--income-soft:#153a2b;--expense:#ff8b8b;--expense-soft:#421f25;--progress-red:#f06c6c;--progress-orange:#f4a261;--progress-yellow:#e2cc5c;--progress-green:#55c98b}
body.dark-mode .bar{background:#252d37}
body.dark-mode .item strong.positive{background:var(--income-soft)}
body.dark-mode .item strong.negative{background:var(--expense-soft)}
body.dark-mode .metric .positive{background:var(--income-soft)}
body.dark-mode .metric .negative{background:var(--expense-soft)}
body.dark-mode .nav button .nav-icon{color:currentColor}


/* Ícones com cores próprias: paleta profissional, sem monocromia */
.nav button:nth-child(1) .nav-icon{color:#3978b8}
.nav button:nth-child(2) .nav-icon{color:#15968b}
.nav button:nth-child(3) .nav-icon{color:#7962c4}
.nav button:nth-child(4) .nav-icon{color:#d46b4f}
.nav button:nth-child(5) .nav-icon{color:#c4547c}
.nav button:nth-child(6) .nav-icon{color:#34865b}
.nav button:nth-child(7) .nav-icon{color:#b98520}
.nav button:nth-child(8) .nav-icon{color:#64748b}
.nav button .nav-icon{opacity:1}
.nav button.active .nav-icon{filter:saturate(1.12)}
/* Emojis permanecem coloridos; o fundo recebe uma tonalidade discreta */
.thumb{background:linear-gradient(145deg,#f1f5f9,#e8eef5);border-color:#e1e7ef;color:inherit}
.item:nth-child(6n+1) .thumb{background:#e7f0fb;border-color:#d5e4f6}
.item:nth-child(6n+2) .thumb{background:#e1f5f2;border-color:#ccebe6}
.item:nth-child(6n+3) .thumb{background:#eee9fc;border-color:#e0d8f8}
.item:nth-child(6n+4) .thumb{background:#fff0e9;border-color:#f7ded4}
.item:nth-child(6n+5) .thumb{background:#fbe8ef;border-color:#f3d5e0}
.item:nth-child(6n) .thumb{background:#e5f5e9;border-color:#d1ebd8}
body.dark-mode .thumb{background:#202833;border-color:#354150;color:#f3f4f6}
body.dark-mode .item:nth-child(6n+1) .thumb{background:#1b3045;border-color:#294866}
body.dark-mode .item:nth-child(6n+2) .thumb{background:#153533;border-color:#245451}
body.dark-mode .item:nth-child(6n+3) .thumb{background:#292340;border-color:#403565}
body.dark-mode .item:nth-child(6n+4) .thumb{background:#3a2522;border-color:#5b3731}
body.dark-mode .item:nth-child(6n+5) .thumb{background:#3a202c;border-color:#5c3043}
body.dark-mode .item:nth-child(6n) .thumb{background:#1d3528;border-color:#2d5940}


/* Minimizar cartões diretamente no painel */
.dash-card-minimize{position:absolute;right:12px;top:12px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:8px;width:30px;height:28px;display:inline-grid;place-items:center;font-size:18px;line-height:1;flex:0 0 auto;padding:0;z-index:2}
.dash-card-minimize:hover{color:var(--navy);background:var(--beige)}
.dash-card-collapsed-label{display:none;font-weight:700;font-size:14px;padding:2px 40px 2px 0;color:var(--ink)}
.card.dash-card-is-collapsed{padding-top:15px;padding-bottom:15px;min-height:56px}
.card.dash-card-is-collapsed .dash-card-content{display:none!important}
.card.dash-card-is-collapsed .dash-card-collapsed-label{display:block}
.card.dash-card-is-collapsed .dash-card-minimize{position:absolute;right:12px;top:12px}
.card.dash-card-has-minimize{position:relative}
.card.dash-card-has-minimize h2,.card.dash-card-has-minimize h3{padding-right:42px}
body.dark-mode .dash-card-minimize{background:#202833;color:#e8edf3;border-color:var(--line)}


/* Central de alertas: compatível com tema claro/escuro e cartões minimizáveis */
.alert-center{min-width:0}.alert-title{align-items:flex-start;gap:12px;flex-wrap:wrap}.alert-title h2{margin:0}.alert-title p{margin:5px 0 0}.alert-title .btn{margin-left:auto}
.alert-pills{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.alert-pill{border-radius:100px;padding:6px 10px;font-size:12px;font-weight:700}
.alert-pill-overdue{background:#25272c;color:white}.alert-pill-urgent{background:#fce5e4;color:#a52b27}.alert-pill-attention{background:#fff0cc;color:#8b5d0b}
.alert-list{display:grid;gap:8px}.alert-row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-left:4px solid transparent;border-radius:10px;padding:12px;background:var(--card)}
.alert-row.alert-overdue{border-left-color:#202124}.alert-row.alert-urgent{border-left-color:#d53f3a}.alert-row.alert-attention{border-left-color:#e2a72a}.alert-row.alert-ok{border-left-color:#279368}
.alert-dot{height:12px;width:12px;flex:0 0 12px;border-radius:50%;background:#279368}.alert-overdue .alert-dot{background:#202124}.alert-urgent .alert-dot{background:#d53f3a}.alert-attention .alert-dot{background:#e2a72a}
.alert-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}.alert-main b{overflow-wrap:anywhere}.alert-main small,.alert-value small{color:var(--muted);font-size:12px}.alert-value{display:flex;flex-direction:column;gap:4px;align-items:flex-end;text-align:right}

<div id="root"></div>
<script>
try{if(localStorage.getItem('nf-theme')==='dark')document.body.classList.add('dark-mode')}catch(e){}
const SUPABASE_URL='https://tkbzgewhaguetumpqweq.supabase.co';
const SUPABASE_KEY='sb_publishable_qAiYf6vwU_pYY8LZDNt1rg_VWctios6';
if(!window.supabase || typeof window.supabase.createClient!=='function'){document.getElementById('root').innerHTML='<div class="login"><div class="loginbox"><h1>Nosso Financeiro</h1><div class="status">Não foi possível carregar o módulo de conexão. Verifique sua internet e tente abrir novamente.</div></div></div>'; throw new Error('Supabase JS não carregou');}
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let state={user:null,profile:null,coupleId:null,page:'dashboard',view:'couple',loading:true,realtime:null,period:'month',from:'',to:'',selectedGoalId:null,selectedProjectId:null};
const brl=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const toast=(m)=>{let e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)};
function diag(msg,ok=false){let r=document.getElementById('diag');if(!r)return;let d=document.createElement('div');d.className='status';d.style.marginTop='8px';d.style.background=ok?'#e5f5ec':'#fdecea';d.innerHTML=(ok?'✅ ':'❌ ')+esc(msg);r.appendChild(d)}
async function init(){document.getElementById('root').innerHTML='<div class="login"><div class="loginbox"><h1>Nosso Financeiro</h1><p>Diagnóstico de conexão</p><div id="diag"></div></div></div>';try{if(!window.supabase||typeof window.supabase.createClient!=='function')throw new Error('Biblioteca Supabase não carregou');diag('Biblioteca Supabase carregada',true);let res=await fetch(SUPABASE_URL+'/auth/v1/settings',{method:'GET',headers:{'apikey':SUPABASE_KEY}});diag('Endpoint Supabase respondeu: HTTP '+res.status,res.ok||res.status===400||res.status===401);let body='';try{body=await res.text()}catch(_){}if(!res.ok)throw new Error('Endpoint auth/v1/settings retornou HTTP '+res.status+(body?' — '+body.slice(0,300):''));const {data:{session},error}=await sb.auth.getSession();if(error)throw new Error('Auth getSession: '+error.message);diag('Auth getSession funcionando',true);state.user=session?.user||null;if(state.user){diag('Sessão encontrada: '+state.user.email,true);await loadContext();}else diag('Nenhuma sessão ativa. Isso é normal antes do login.',true);await render();sb.auth.onAuthStateChange(async(_e,s)=>{state.user=s?.user||null;if(state.user) await loadContext();else {state.profile=null;state.coupleId=null}await render()});}catch(e){console.error('DIAGNÓSTICO',e);diag('FALHA: '+(e?.message||String(e)),false);}}
async function setupRealtime(){if(!state.coupleId)return;if(state.realtime){try{await sb.removeChannel(state.realtime)}catch(e){}}state.realtime=sb.channel('nosso-financeiro-'+state.coupleId).on('postgres_changes',{event:'*',schema:'public',table:'transactions',filter:'couple_id=eq.'+state.coupleId},()=>render()).on('postgres_changes',{event:'*',schema:'public',table:'accounts',filter:'couple_id=eq.'+state.coupleId},()=>render()).on('postgres_changes',{event:'*',schema:'public',table:'debts',filter:'couple_id=eq.'+state.coupleId},()=>render()).on('postgres_changes',{event:'*',schema:'public',table:'projects',filter:'couple_id=eq.'+state.coupleId},()=>render()).on('postgres_changes',{event:'*',schema:'public',table:'goals',filter:'couple_id=eq.'+state.coupleId},()=>render()).on('postgres_changes',{event:'*',schema:'public',table:'goal_items',filter:'couple_id=eq.'+state.coupleId},()=>render()).on('postgres_changes',{event:'*',schema:'public',table:'project_items',filter:'couple_id=eq.'+state.coupleId},()=>render()).subscribe();}
async function loadContext(){let r=await sb.from('profiles').select('*').eq('id',state.user.id).maybeSingle();if(r.error)throw new Error('Tabela profiles: '+r.error.message+' (HTTP '+(r.status||'?')+')');state.profile=r.data;diag('Tabela profiles acessível',true);let {data:cm,error,status}=await sb.from('couple_members').select('couple_id,role').eq('user_id',state.user.id).maybeSingle();if(error)throw new Error('Tabela couple_members: '+error.message+' (HTTP '+(status||'?')+')');state.coupleId=cm?.couple_id||null;diag(state.coupleId?'Vínculo com o casal encontrado':'Usuário sem vínculo com casal',!!state.coupleId);if(state.coupleId){await ensureProjects();await setupRealtime();}}
async function ensureProjects(){let {count}=await sb.from('projects').select('*',{count:'exact',head:true}).eq('couple_id',state.coupleId);if(count===0){await sb.from('projects').insert([{couple_id:state.coupleId,name:'Casamento',emoji:'💍',target_amount:60000,saved_amount:0},{couple_id:state.coupleId,name:'Casa',emoji:'🏠',target_amount:0,saved_amount:0},{couple_id:state.coupleId,name:'Carro',emoji:'🚗',target_amount:0,saved_amount:0},{couple_id:state.coupleId,name:'Viagem',emoji:'✈️',target_amount:0,saved_amount:0},{couple_id:state.coupleId,name:'Filho',emoji:'👶',target_amount:0,saved_amount:0}]);}}
function login(){return `<div class="login"><div class="loginbox"><div style="font-size:34px">💍</div><h1>Nosso Financeiro</h1><p>Organização financeira para vocês dois. Entre com sua própria conta para manter seus dados individuais separados e compartilhar o que for do casal.</p><div id="loginMsg" class="status hidden"></div><form class="form" onsubmit="doLogin(event)"><label>E-mail<input id="email" type="email" required autocomplete="email"></label><label>Senha<input id="password" type="password" required autocomplete="current-password"></label><button class="btn primary" type="submit">Entrar</button></form></div></div>`}
function toggleTheme(){const dark=!document.body.classList.contains('dark-mode');document.body.classList.toggle('dark-mode',dark);try{localStorage.setItem('nf-theme',dark?'dark':'light')}catch(e){}render()}
function shell(content){let name=state.profile?.display_name||state.user?.email?.split('@')[0]||'Você';return `<div class="app"><aside class="side"><div class="brand">Nosso Financeiro<small>organização a dois</small></div><div class="nav">${nav('dashboard','home','Visão geral')}${nav('lancamentos','activity','Lançamentos')}${nav('contas','wallet','Contas e cartões')}${nav('dividas','debt','Dívidas')}${nav('projetos','heart','Projetos do casal')}${nav('objetivos','target','Objetivos')}${nav('relatorios','chart','Relatórios')}${nav('config','settings','Configurações')}</div></aside><main class="main"><div class="top"><div></div><div class="authbar"><div class="userpill"><div class="avatar">${esc(name[0]?.toUpperCase()||'V')}</div><span>${esc(name)}</span></div><button class="btn theme-toggle" onclick="toggleTheme()">${document.body.classList.contains('dark-mode')?'◐ Modo claro':'◑ Modo escuro'}</button><button class="smallbtn" onclick="logout()">Sair</button></div></div>${content}</main></div><div id="modalRoot"></div>`}
function navIcon(name){const paths={home:'<path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9"/><path d="M9 20v-6h6v6"/>',activity:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',wallet:'<rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 8h18"/><path d="M16 14h2"/>',debt:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M15 9.5c-.5-1-1.5-1.5-3-1.5-1.7 0-3 .8-3 2s1.3 2 3 2 3 1 3 2-1.3 2-3 2c-1.5 0-2.5-.5-3-1.5"/>',heart:'<path d="M20.8 8.8c0 5.2-8.8 10.2-8.8 10.2S3.2 14 3.2 8.8A4.8 4.8 0 0 1 12 6.2a4.8 4.8 0 0 1 8.8 2.6Z"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',chart:'<path d="M4 19V5M4 19h17"/><rect x="7" y="11" width="3" height="5" rx=".5"/><rect x="13" y="7" width="3" height="9" rx=".5"/><rect x="19" y="3" width="2" height="13" rx=".5"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.1 1.9-2 3.4-2.2-.4a8 8 0 0 1-1.8 1l-.7 2h-4l-.7-2a8 8 0 0 1-1.8-1l-2.2.4-2-3.4 1.1-1.9a8 8 0 0 1 0-2.1l-1.1-1.9 2-3.4 2.2.4a8 8 0 0 1 1.8-1l.7-2h4l.7 2a8 8 0 0 1 1.8 1l2.2-.4 2 3.4-1.1 1.9a8 8 0 0 1-.1 2Z" transform="translate(0 -1) scale(.92)"/>'};return `<span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24">${paths[name]||paths.home}</svg></span>`}
function nav(k,icon,label){return `<button aria-label="${label}" onclick="go('${k}')" class="${state.page===k?'active':''}">${navIcon(icon)}<span>${label}</span></button>`}
function periodControl(){return `<div class="row" style="flex-wrap:wrap;margin:0 0 14px"><label class="mini">Período <select class="btn" onchange="setPeriod(this.value)"><option value="week" ${state.period==='week'?'selected':''}>Esta semana</option><option value="month" ${state.period==='month'?'selected':''}>Este mês</option><option value="year" ${state.period==='year'?'selected':''}>Este ano</option><option value="all" ${state.period==='all'?'selected':''}>Todo o histórico</option><option value="custom" ${state.period==='custom'?'selected':''}>Personalizado</option></select></label>${state.period==='custom'?`<label class="mini">De <input type="date" value="${state.from}" onchange="state.from=this.value;render()"></label><label class="mini">Até <input type="date" value="${state.to}" onchange="state.to=this.value;render()"></label>`:''}</div>`}function setPeriod(p){state.period=p;render()}function periodBounds(){let now=new Date(),start=null,end=new Date(now);if(state.period==='week'){let d=(now.getDay()+6)%7;start=new Date(now);start.setDate(now.getDate()-d)}else if(state.period==='month'){start=new Date(now.getFullYear(),now.getMonth(),1)}else if(state.period==='year'){start=new Date(now.getFullYear(),0,1)}else if(state.period==='custom'){start=state.from?new Date(state.from+'T00:00:00'):null;end=state.to?new Date(state.to+'T23:59:59'):null}else return {start:null,end:null};return {start,end}}function layout(title,sub,actions=''){return `<div class="top"><div class="title"><h1>${title}</h1><p>${sub}</p></div><div class="actions">${actions}</div></div>${periodControl()}`}
async function data(){if(!state.coupleId)return {transactions:[],accounts:[],debts:[],projects:[],goals:[]};let [t,a,d,p,g]=await Promise.all([sb.from('transactions').select('*').eq('couple_id',state.coupleId).order('transaction_date',{ascending:false}),sb.from('accounts').select('*').eq('couple_id',state.coupleId).order('created_at',{ascending:false}),sb.from('debts').select('*').eq('couple_id',state.coupleId).order('created_at',{ascending:false}),sb.from('projects').select('*').eq('couple_id',state.coupleId).order('created_at'),sb.from('goals').select('*').eq('couple_id',state.coupleId).order('created_at')]);let bounds=periodBounds();let tx=t.data||[];if(bounds.start)tx=tx.filter(z=>new Date(z.transaction_at||z.transaction_date+'T00:00:00')>=bounds.start);if(bounds.end)tx=tx.filter(z=>new Date(z.transaction_at||z.transaction_date)<=bounds.end);let out={transactions:tx,allTransactions:t.data||[],accounts:a.data||[],debts:d.data||[],projects:p.data||[],goals:g.data||[]};window.__nfdata=out;return out}
function progressColor(percent){let p=Math.max(0,Math.min(100,Number(percent)||0));const stops=[{p:0,c:[224,68,68]},{p:35,c:[243,154,56]},{p:65,c:[216,189,66]},{p:100,c:[39,132,91]}];let a=stops[0],b=stops[stops.length-1];for(let i=0;i<stops.length-1;i++){if(p>=stops[i].p&&p<=stops[i+1].p){a=stops[i];b=stops[i+1];break}}let t=(p-a.p)/(b.p-a.p||1),c=a.c.map((v,i)=>Math.round(v+(b.c[i]-v)*t));return `rgb(${c[0]}, ${c[1]}, ${c[2]})`}
function projectCard(p){let pct=Number(p.target_amount)?Math.min(100,Number(p.saved_amount)/Number(p.target_amount)*100):0;return `<div class="card nf-record-click" role="button" tabindex="0" data-nf-record="project" data-nf-id="${esc(p.id)}" title="Abrir opções do projeto"><div class="row"><div class="thumb">${esc(p.emoji||'🎯')}</div><span class="tag">Projeto do casal</span></div><h3>${esc(p.name)}</h3><p class="muted">${esc(p.target_date||'Data não definida')} · ${esc(p.place||'Local não definido')}</p><div class="progressline"><span>${brl(p.saved_amount)} de ${brl(p.target_amount)}</span><span>${pct.toFixed(0)}%</span></div><div class="bar"><div class="fill" style="width:${pct}%;background-color:${progressColor(pct)}"></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="openProject('${p.id}')">Entrar no projeto</button><button class="btn" onclick="editProject('${p.id}')">Editar</button></div></div>`}
function dashboardPrefs(){const defaults=['balance','alerts','metrics','projects','transactions','partner','organization'];try{let saved=JSON.parse(localStorage.getItem('nf-dashboard-'+state.user.id)||'null');if(saved&&Array.isArray(saved.order)){let order=[...saved.order.filter(k=>defaults.includes(k)),...defaults.filter(k=>!saved.order.includes(k))];return {order,hidden:Array.isArray(saved.hidden)?saved.hidden.filter(k=>defaults.includes(k)):[]}}}catch(e){}return {order:defaults,hidden:[]}}

function openDashboardSettings(){let prefs=dashboardPrefs(),widgets=dashboardWidgetList();document.getElementById('modalRoot').innerHTML=`<div class="modal"><div class="modalbox"><div class="modalhead"><div><h2>Personalizar painel</h2><p class="muted" style="margin:5px 0 0">Escolha os cartões que quer ver e organize a ordem.</p></div><button class="close" onclick="closeModal()">×</button></div><div id="dashboardWidgetSettings" class="list">${prefs.order.map((id,i)=>{let w=widgets.find(x=>x.id===id);return `<div class="item dashboard-setting-row" data-widget="${id}"><input type="checkbox" data-visible="${id}" ${prefs.hidden.includes(id)?'':'checked'} aria-label="Mostrar ${w.name}" style="width:18px;height:18px;accent-color:#3478b8"><div class="info"><b>${w.name}</b><span>${w.description}</span></div><div class="actions"><button type="button" class="btn" onclick="moveDashboardWidget('${id}',-1)" ${i===0?'disabled':''} aria-label="Mover ${w.name} para cima">↑</button><button type="button" class="btn" onclick="moveDashboardWidget('${id}',1)" ${i===prefs.order.length-1?'disabled':''} aria-label="Mover ${w.name} para baixo">↓</button></div></div>`}).join('')}</div><div class="actions" style="justify-content:space-between;margin-top:18px"><button class="btn" onclick="resetDashboardPrefs()">Restaurar padrão</button><div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="applyDashboardPrefs()">Salvar painel</button></div></div><p class="mini" style="margin-top:12px">A personalização fica salva neste navegador para o seu usuário; não altera os dados financeiros nem o Supabase.</p></div></div>`}
function moveDashboardWidget(id,delta){let root=document.getElementById('dashboardWidgetSettings');if(!root)return;let rows=[...root.querySelectorAll('.dashboard-setting-row')],i=rows.findIndex(r=>r.dataset.widget===id),j=i+delta;if(i<0||j<0||j>=rows.length)return;if(delta<0)root.insertBefore(rows[i],rows[j]);else root.insertBefore(rows[j],rows[i]);[...root.querySelectorAll('.dashboard-setting-row')].forEach((r,i,a)=>{let bs=r.querySelectorAll('button');bs[0].disabled=i===0;bs[1].disabled=i===a.length-1})}
function applyDashboardPrefs(){let root=document.getElementById('dashboardWidgetSettings');if(!root)return;let order=[...root.querySelectorAll('.dashboard-setting-row')].map(r=>r.dataset.widget),hidden=[...root.querySelectorAll('input[data-visible]:not(:checked)')].map(x=>x.dataset.visible);if(saveDashboardPrefs({order,hidden})){closeModal();toast('Painel personalizado salvo');render()}}
function resetDashboardPrefs(){let defaults=['balance','alerts','metrics','projects','transactions','partner','organization'];saveDashboardPrefs({order:defaults,hidden:[]});openDashboardSettings()}
function dashboardCardKey(card,index){let label=card.querySelector('h2')?.textContent?.trim()||card.querySelector('.metric small')?.textContent?.trim()||card.querySelector('small')?.textContent?.trim()||card.querySelector('.notice')?.textContent?.trim()||`cartao-${index+1}`;return label.toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,70)||`cartao-${index+1}`}
function dashboardMinimizedPrefs(){try{return JSON.parse(localStorage.getItem('nf-dashboard-minimized-'+state.user.id)||'[]')}catch(e){return []}}
function toggleDashboardCard(key){let saved=dashboardMinimizedPrefs();saved=saved.includes(key)?saved.filter(k=>k!==key):[...saved,key];try{localStorage.setItem('nf-dashboard-minimized-'+state.user.id,JSON.stringify(saved))}catch(e){toast('Não foi possível salvar esta preferência neste navegador.')}let card=document.querySelector(`[data-dash-min-key=\"${key}\"]`);if(card){let collapsed=saved.includes(key),btn=card.querySelector('.dash-card-minimize');card.classList.toggle('dash-card-is-collapsed',collapsed);if(btn){btn.textContent=collapsed?'+':'−';btn.setAttribute('aria-label',`${collapsed?'Expandir':'Minimizar'} ${card.querySelector('.dash-card-collapsed-label')?.textContent||'cartão'}`);btn.title=collapsed?'Expandir cartão':'Minimizar cartão'}}}
function enhanceDashboardCards(){if(state.page!=='dashboard'||!state.user)return;let root=document.querySelector('.main');if(!root)return;let cards=[...root.querySelectorAll('.title ~ .card, .title ~ .grid .card, .title ~ .section .card, .switch ~ .card, .switch ~ .grid .card, .switch ~ .section .card')];
// Seleciona cartões dentro do conteúdo do painel, sem tocar em modais ou elementos globais.
let mainContent=root;cards=[...mainContent.querySelectorAll('.card')].filter(c=>!c.closest('.modal'));
let saved=dashboardMinimizedPrefs();cards.forEach((card,index)=>{if(card.dataset.dashMinReady==='1')return;card.dataset.dashMinReady='1';let key=dashboardCardKey(card,index);card.dataset.dashMinKey=key;card.classList.add('dash-card-has-minimize');let label=card.querySelector('h2')?.textContent?.trim()||card.querySelector('.metric small')?.textContent?.trim()||card.querySelector('small')?.textContent?.trim()||`Cartão ${index+1}`;let body=document.createElement('div');body.className='dash-card-content';while(card.firstChild)body.appendChild(card.firstChild);let collapsedLabel=document.createElement('div');collapsedLabel.className='dash-card-collapsed-label';collapsedLabel.textContent=label;let button=document.createElement('button');button.type='button';button.className='dash-card-minimize';button.setAttribute('aria-label',`Minimizar ${label}`);button.setAttribute('title','Minimizar cartão');button.textContent='−';button.addEventListener('click',()=>toggleDashboardCard(key));card.append(collapsedLabel,body,button);if(saved.includes(key)){card.classList.add('dash-card-is-collapsed');button.textContent='+';button.setAttribute('aria-label',`Expandir ${label}`);button.setAttribute('title','Expandir cartão')}})}

function enhanceExpandableCards(){
  if(!state.user)return;
  const root=document.querySelector('.main');if(!root)return;
  const cards=[...root.querySelectorAll('.card')];
  cards.forEach((card,index)=>{
    if(card.classList.contains('nf-card-limited'))return;
    // Keep existing dashboard minimization control outside the height-limited area.
    let body=card.classList.contains('dash-card-has-minimize')?card.querySelector(':scope > .dash-card-content'):null;
    if(!body){body=document.createElement('div');body.className='nf-limit-content';while(card.firstChild)body.appendChild(card.firstChild);card.appendChild(body)}
    else body.classList.add('nf-limit-content');
    card.classList.add('nf-card-limited');
    if(!card.style.getPropertyValue('--nf-card-limit')){
      const limit=card.closest('.nf-slot-balance')?340:card.closest('.nf-slot-alerts')?245:card.closest('.nf-slot-projects')?260:card.closest('.nf-slot-transactions')?260:card.closest('.nf-slot-partner')?210:260;
      card.style.setProperty('--nf-card-limit',limit+'px');
    }
    const label=card.querySelector('h2,h3,small')?.textContent?.trim()||'cartão';
    const key='nf-expand-'+state.user.id+'-'+state.page+'-'+index+'-'+label.slice(0,40);
    let expanded=false;try{expanded=localStorage.getItem(key)==='1'}catch(e){}
    const button=document.createElement('button');button.type='button';button.className='nf-expand-action';button.textContent=expanded?'Ver menos ↑':'Ver mais ↓';button.setAttribute('aria-label',(expanded?'Ver menos de ':'Ver mais de ')+label);
    card.classList.toggle('nf-card-expanded',expanded);
    button.addEventListener('click',()=>{
      expanded=!expanded;card.classList.toggle('nf-card-expanded',expanded);
      button.textContent=expanded?'Ver menos ↑':'Ver mais ↓';button.setAttribute('aria-expanded',String(expanded));
      try{localStorage.setItem(key,expanded?'1':'0')}catch(e){}
      if(!expanded)card.scrollIntoView({block:'nearest',behavior:'smooth'});
    });
    card.appendChild(button);
    const height=parseFloat(getComputedStyle(body).maxHeight)||260;
    // The button only exists visually if the natural content exceeds its limit.
    // Use a second layout frame so fonts, grid widths and inserted controls settle.
    const updateOverflow=()=>{
      const over=body.scrollHeight>height+2;
      body.classList.toggle('nf-is-overflowing',over);
      button.hidden=!over;
      if(!over){card.classList.remove('nf-card-expanded');button.setAttribute('aria-expanded','false')}
    };
    updateOverflow();
    requestAnimationFrame(updateOverflow);
  });
}

function alertDueInfo(raw){
  if(!raw)return null;
  const m=String(raw).slice(0,10).match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return null;
  const due=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]),12);
  if(due.getFullYear()!==Number(m[1])||due.getMonth()!==Number(m[2])-1||due.getDate()!==Number(m[3]))return null;
  const today=new Date();today.setHours(12,0,0,0);
  const days=Math.round((due-today)/86400000);
  const level=days<0?'overdue':days<=3?'urgent':days<=7?'attention':'ok';
  const label=days<0?'Atrasado':days<=3?'Urgente':days<=7?'Atenção':'No prazo';
  const when=days<0?`Atrasado há ${-days} dia(s)`:days===0?'Vence hoje':`Vence em ${days} dia(s)`;
  return {days,level,label,when,date:due.toLocaleDateString('pt-BR')};
}
function alertCenterMarkup(debts){
  const items=(debts||[]).filter(d=>Number(d.remaining_amount)>0&&(d.next_due_date||d.due_date)).map(d=>({debt:d,due:alertDueInfo(d.next_due_date||d.due_date)})).filter(z=>z.due).sort((a,b)=>a.due.days-b.due.days);
  const overdue=items.filter(z=>z.due.level==='overdue').length;
  const urgent=items.filter(z=>z.due.level==='urgent').length;
  const attention=items.filter(z=>z.due.level==='attention').length;
  const tip=overdue?`Existem ${overdue} compromisso(s) com data vencida. Confira se já foram pagos; caso contrário, priorize regularizar e verificar possíveis encargos.`:urgent?`Existem ${urgent} compromisso(s) vencendo em até 3 dias. Confira seu saldo e programe os pagamentos.`:attention?`Existem ${attention} compromisso(s) vencendo entre 4 e 7 dias. Separe o valor necessário com antecedência.`:items.length?'Nenhum compromisso cadastrado exige atenção imediata. Continue acompanhando seus próximos vencimentos.':'Cadastre o próximo vencimento na seção Dívidas para começar a receber alertas.';
  const list=items.length?`<div class="alert-list">${items.slice(0,8).map(({debt,due})=>`<div class="alert-row alert-${due.level} nf-record-click" role="button" tabindex="0" data-nf-record="debt" data-nf-id="${esc(debt.id)}" title="Abrir opções desta dívida"><span class="alert-dot" aria-hidden="true"></span><div class="alert-main"><b>${esc(debt.name||'Dívida')}</b><small>${esc(due.when)} · ${esc(due.date)}</small></div><div class="alert-value"><b>${brl(debt.remaining_amount)}</b><small>${due.label}</small></div></div>`).join('')}</div>${items.length>8?`<p class="mini">Mostrando 8 de ${items.length} compromissos. Veja os demais na seção Dívidas.</p>`:''}`:'<p class="muted">Nenhum vencimento pendente encontrado nas dívidas cadastradas.</p>';
  return `<div class="card section alert-center"><div class="row alert-title"><div><h2>Central de alertas</h2><p class="muted">Acompanhe os próximos pagamentos e os atrasos.</p></div><button class="btn" onclick="go('dividas')">Ver dívidas</button></div><div class="alert-pills"><span class="alert-pill alert-pill-overdue">${overdue} atrasado(s)</span><span class="alert-pill alert-pill-urgent">${urgent} urgente(s)</span><span class="alert-pill alert-pill-attention">${attention} atenção</span></div>${list}<div class="alert-tip"><span aria-hidden="true">✦</span><div><b>Sugestão automática</b><p>${esc(tip)}</p><small>Baseada apenas nos dados cadastrados. Não confirma se um boleto foi pago fora do aplicativo.</small></div></div></div>`;
}

async function contas(){let x=await data();let visible=x.accounts.filter(a=>a.ownership==='couple'||a.owner_user_id===state.user.id);let total=visible.reduce((n,a)=>n+Number(a.current_balance||0),0);return layout('Contas e cartões','Bancos, cartões e contas que vocês utilizam.',`<button class="btn primary" onclick="openForm('account')">+ Nova conta/cartão</button>`)+`<div class="card metric section"><small>Saldo total das minhas contas</small><strong>${brl(total)}</strong><span class="muted">Soma dos saldos atuais das contas que você pode visualizar.</span></div><div class="grid g3 section">${visible.map(a=>`<div class="card nf-record-click" role="button" tabindex="0" data-nf-record="account" data-nf-id="${esc(a.id)}" title="Abrir opções da conta"><div class="row"><div class="thumb">${a.image_url?`<img src="${a.image_url}" alt="Logo ${esc(a.name)}" style="width:100%;height:100%;object-fit:cover;border-radius:10px">`:'💳'}</div><span class="tag">${a.ownership==='couple'?'Casal':'Individual'}</span></div><h3>${esc(a.name)}</h3><p class="muted">${esc(a.institution||a.account_type)}</p><strong>${brl(a.current_balance)}</strong><div style="margin-top:12px"><button class="btn" onclick="editAccount('${a.id}')">Editar</button> <button class="btn danger" onclick="del('accounts','${a.id}')">Excluir</button></div></div>`).join('')||'<div class="empty">Cadastrem bancos, contas e cartões.</div>'}</div>`}
async function dividas(){let x=await data();return layout('Dívidas e parcelas','Acompanhe o que falta pagar.',`<button class="btn primary" onclick="openForm('debt')">+ Nova dívida</button>`)+`<div class="list">${x.debts.map(d=>{let pct=Number(d.total_amount)?(Number(d.total_amount)-Number(d.remaining_amount))/Number(d.total_amount)*100:0;return `<div class="card nf-record-click" role="button" tabindex="0" data-nf-record="debt" data-nf-id="${esc(d.id)}" title="Abrir opções da dívida"><div class="row"><div><h3>${esc(d.name)}</h3><span class="muted">${d.installments_total||'-'} parcelas · ${d.ownership==='couple'?'Casal':'Individual'}</span></div><strong class="finance-negative-value">${brl(d.remaining_amount)}</strong></div><div class="progressline"><span>Pago ${brl(Number(d.total_amount)-Number(d.remaining_amount))}</span><span>${pct.toFixed(0)}%</span></div><div class="bar"><div class="fill" style="width:${pct}%;background-color:${progressColor(pct)}"></div></div><div style="margin-top:12px"><button class="btn" onclick="del('debts','${d.id}')">Excluir</button></div></div>`}).join('')||'<div class="empty">Nenhuma dívida cadastrada.</div>'}</div>`}
async function projetos(){let x=await data();return layout('Projetos do casal','Grandes planos com meta, data, local e informações editáveis.',`<button class="btn primary" onclick="openForm('project')">+ Novo projeto</button>`)+`<div class="grid g3">${x.projects.map(projectCard).join('')||'<div class="empty">Nenhum projeto.</div>'}</div>`}
async function openProject(id){state.selectedProjectId=id;state.page='projectDetail';await render()}
async function projectDetail(){let x=await data(),p=x.projects.find(z=>z.id===state.selectedProjectId);if(!p){state.page='projetos';return projetos()}let q=await sb.from('project_items').select('*').eq('project_id',p.id).eq('couple_id',state.coupleId).order('created_at',{ascending:true});if(q.error){return layout(esc(p.name),'Detalhamento do projeto do casal.',`<button class="btn" onclick="go('projetos')">← Voltar aos projetos</button>`)+`<div class="notice">Não foi possível carregar as etapas: ${esc(q.error.message)}. Confirme se a migração SQL de projetos detalhados foi executada.</div>`}let items=q.data||[];let pct=items.length?items.reduce((a,i)=>a+Number(i.progress_percent||0),0)/items.length:(Number(p.target_amount)?Math.min(100,Number(p.saved_amount)/Number(p.target_amount)*100):0);let estimated=items.reduce((a,i)=>a+Number(i.estimated_amount||0),0),paid=items.reduce((a,i)=>a+Number(i.paid_amount||0),0);return layout(esc(p.name),'Área interna do projeto: organize subobjetivos, etapas, fornecedores e progresso.',`<button class="btn" onclick="go('projetos')">← Voltar aos projetos</button><button class="btn" onclick="editProject('${p.id}')">Editar projeto</button><button class="btn primary" onclick="openProjectItemForm('${p.id}')">+ Adicionar subobjetivo</button>`)+`<div class="grid g3"><div class="card metric"><small>Progresso geral</small><strong>${pct.toFixed(0)}%</strong><div class="bar"><div class="fill" style="width:${pct}%;background-color:${progressColor(pct)}"></div></div><span class="mini">${items.length?'Média do progresso das '+items.length+' etapas':'Adicione subobjetivos para calcular o progresso'}</span></div><div class="card metric"><small>Orçamento das etapas</small><strong>${brl(estimated)}</strong><span class="muted">${brl(paid)} já pago</span></div><div class="card metric"><small>Meta do projeto</small><strong>${brl(p.target_amount)}</strong><span class="muted">Reservado: ${brl(p.saved_amount)}</span></div></div><div class="section card"><div class="row"><h2>Subobjetivos e etapas</h2><span class="tag">${items.length} itens</span></div><p class="muted">Ex.: fornecedores, buffet, decoração, banda, cerimonialista, local, fotógrafo ou qualquer etapa deste projeto.</p>${items.length?`<div class="grid g2">${items.map(i=>{let ip=Math.max(0,Math.min(100,Number(i.progress_percent)||0));return `<div class="card"><div class="row"><h3>${esc(i.name)}</h3><span class="tag">${esc(i.status||'Pendente')}</span></div><p class="muted">${esc(i.category||'Outros')}${i.due_date?' · Prazo: '+esc(i.due_date):''}</p><div class="row"><strong>${ip.toFixed(0)}% concluído</strong><span class="mini">${brl(i.paid_amount)} / ${brl(i.estimated_amount)} pagos</span></div><div class="bar" style="margin:8px 0 12px"><div class="fill" style="width:${ip}%;background-color:${progressColor(ip)}"></div></div><div class="progressline"><span>Orçamento: ${brl(i.estimated_amount)}</span><span>${i.estimated_amount?Math.min(100,Number(i.paid_amount||0)/Number(i.estimated_amount)*100).toFixed(0):0}% pago</span></div>${i.notes?`<p class="mini">${esc(i.notes)}</p>`:''}<div class="actions" style="margin-top:12px"><button class="btn" onclick="editProjectItem('${i.id}')">Editar</button><button class="btn danger" onclick="deleteProjectItem('${i.id}')">Excluir</button></div></div>`}).join('')}</div>`:'<div class="empty">Ainda não há subobjetivos. Clique em “+ Adicionar subobjetivo” para criar o primeiro.</div>'}</div><div class="section card"><h2>Informações do projeto</h2><p>${esc(p.notes||'Nenhuma observação adicionada.')}</p><p class="muted">Data: ${esc(p.target_date||'não definida')} · Local/destino: ${esc(p.place||'não definido')}</p></div>`}
function openProjectItemForm(projectId,item=null){let isEdit=!!item;modal(isEdit?'Editar etapa do projeto':'Adicionar subobjetivo ao projeto',`<div class="formgrid"><label class="full">Nome do subobjetivo<input id="f_pi_name" required placeholder="Ex.: Buffet, decoração, banda" value="${esc(item?.name||'')}"></label><label>Categoria<select id="f_pi_category">${['Fornecedor','Buffet','Decoração','Banda/DJ','Cerimonialista','Local/espaço','Fotografia e vídeo','Vestimenta','Convites','Documentação','Pagamento','Outra'].map(c=>`<option ${item?.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label>Status<select id="f_pi_status">${['Pendente','Pesquisando','Orçamento recebido','Contratado','Sinal pago','Parcialmente pago','Pago','Concluído','Cancelado'].map(c=>`<option ${item?.status===c?'selected':''}>${c}</option>`).join('')}</select></label><label>Progresso (%)<input id="f_pi_progress" type="number" min="0" max="100" step="1" value="${Math.max(0,Math.min(100,Number(item?.progress_percent||0)))}"></label><label>Valor estimado<input id="f_pi_estimated" type="number" min="0" step="0.01" value="${Number(item?.estimated_amount||0)}"></label><label>Valor já pago<input id="f_pi_paid" type="number" min="0" step="0.01" value="${Number(item?.paid_amount||0)}"></label><label>Prazo/vencimento<input id="f_pi_due" type="date" value="${esc(item?.due_date||'')}"></label><label class="full">Observações<textarea id="f_pi_notes">${esc(item?.notes||'')}</textarea></label></div>`,`submitProjectItem(event,'${projectId}'${isEdit?`, '${item.id}'`:''})`)}
async function submitProjectItem(e,projectId,itemId=null){e.preventDefault();let payload={project_id:projectId,couple_id:state.coupleId,owner_user_id:state.user.id,name:v('f_pi_name'),category:v('f_pi_category'),status:v('f_pi_status'),progress_percent:Math.max(0,Math.min(100,Number(v('f_pi_progress')||0))),estimated_amount:Number(v('f_pi_estimated')||0),paid_amount:Number(v('f_pi_paid')||0),due_date:v('f_pi_due')||null,notes:v('f_pi_notes'),updated_at:new Date().toISOString()};let q=itemId?await sb.from('project_items').update(payload).eq('id',itemId).eq('couple_id',state.coupleId):await sb.from('project_items').insert(payload);if(q.error){toast('Não foi possível salvar a etapa: '+q.error.message+' (confirme a migração SQL de projetos detalhados)');return}closeModal();toast(itemId?'Etapa atualizada':'Subobjetivo adicionado');render()}
async function editProjectItem(id){let q=await sb.from('project_items').select('*').eq('id',id).eq('couple_id',state.coupleId).single();if(q.error||!q.data){toast('Não foi possível abrir esta etapa.');return}openProjectItemForm(q.data.project_id,q.data)}
async function deleteProjectItem(id){if(!confirm('Excluir este subobjetivo do projeto?'))return;let q=await sb.from('project_items').delete().eq('id',id).eq('couple_id',state.coupleId);if(q.error)toast('Não foi possível excluir: '+q.error.message);else{toast('Subobjetivo excluído');render()}}
async function objetivos(){let x=await data();let iq=await sb.from('goal_items').select('goal_id,progress_percent,estimated_amount,paid_amount').eq('couple_id',state.coupleId);let itemRows=iq.error?[]:(iq.data||[]);let byGoal={};for(let it of itemRows){(byGoal[it.goal_id]||(byGoal[it.goal_id]=[])).push(it)}return layout('Objetivos','Entre em um objetivo para organizar subobjetivos, etapas e acompanhar o progresso de cada um.',`<button class="btn primary" onclick="openForm('goal')">+ Novo objetivo</button>`)+`<div class="grid g3">${x.goals.map(g=>{let vals=byGoal[g.id]||[];let paid=vals.reduce((a,i)=>a+Number(i.paid_amount||0),0),estimated=vals.reduce((a,i)=>a+Number(i.estimated_amount||0),0);let pct=vals.length?vals.reduce((a,i)=>a+Number(i.progress_percent||0),0)/vals.length:(Number(g.target_amount)?Math.min(100,Number(g.saved_amount)/Number(g.target_amount)*100):0);return `<div class="card"><div class="row"><div class="thumb">${g.name.toLowerCase().includes('casamento')?'💍':'🎯'}</div><span class="tag">${g.ownership==='couple'?'Casal':'Individual'}</span></div><h3>${esc(g.name)}</h3><p class="muted">${esc(g.deadline||'Sem prazo')}</p><strong>${pct.toFixed(0)}% concluído</strong><div class="bar" style="margin-top:10px"><div class="fill" style="width:${pct}%;background-color:${progressColor(pct)}"></div></div><div class="progressline"><span>${vals.length?vals.length+' subobjetivo(s)':'Progresso financeiro'}</span><span>${vals.length?'Etapas concluídas (média)':'Meta financeira'}</span></div><div class="nf-goal-rollup"><div class="row"><span>Orçamento dos subobjetivos</span><b>${brl(estimated)}</b></div><div class="row"><span>Total pago nos subobjetivos</span><b class="positive">${brl(paid)}</b></div><div class="row"><span>Falta pagar</span><b>${brl(Math.max(0,estimated-paid))}</b></div><div class="mini">Reservado no objetivo: ${brl(g.saved_amount)} (separado do valor pago)</div></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="openGoal('${g.id}')">Entrar no objetivo</button><button class="btn" onclick="editGoal('${g.id}')">Editar</button><button class="btn danger" onclick="del('goals','${g.id}')">Excluir</button></div></div>`}).join('')||'<div class="empty">Nenhum objetivo cadastrado. Crie um objetivo para começar.</div>'}</div>`}
async function openGoal(id){state.selectedGoalId=id;state.page='goalDetail';await render()}
async function goalDetail(){let x=await data(),g=x.goals.find(z=>z.id===state.selectedGoalId);if(!g){state.page='objetivos';return objetivos()}let q=await sb.from('goal_items').select('*').eq('goal_id',g.id).eq('couple_id',state.coupleId).order('created_at',{ascending:true});if(q.error){return layout(esc(g.name),'Não foi possível carregar as etapas.',`<button class="btn" onclick="go('objetivos')">← Voltar aos objetivos</button>`)+`<div class="notice">Não foi possível carregar os subobjetivos: ${esc(q.error.message)}. Confirme se a migração SQL dos objetivos detalhados foi executada.</div>`}let items=q.data||[];let estimated=items.reduce((a,i)=>a+Number(i.estimated_amount||0),0),paid=items.reduce((a,i)=>a+Number(i.paid_amount||0),0);let pct=items.length?items.reduce((a,i)=>a+Number(i.progress_percent||0),0)/items.length:(Number(g.target_amount)?Math.min(100,Number(g.saved_amount)/Number(g.target_amount)*100):0);return layout(esc(g.name),'Área interna do objetivo: crie subobjetivos e acompanhe o progresso de cada etapa.',`<button class="btn" onclick="go('objetivos')">← Voltar aos objetivos</button><button class="btn" onclick="editGoal('${g.id}')">Editar objetivo</button><button class="btn primary" onclick="openGoalItemForm('${g.id}')">+ Adicionar subobjetivo</button>`)+`<div class="grid g3"><div class="card metric"><small>Progresso geral</small><strong>${pct.toFixed(0)}%</strong><div class="bar"><div class="fill" style="width:${pct}%;background-color:${progressColor(pct)}"></div></div><span class="mini">${items.length?'Média do progresso das '+items.length+' etapas (não é percentual pago)':'Adicione subobjetivos para calcular o progresso das etapas'}</span></div><div class="card metric"><small>Orçamento estimado</small><strong>${brl(estimated)}</strong><span class="muted">${brl(paid)} já pago/adiantado</span></div><div class="card metric"><small>Meta financeira do objetivo</small><strong>${brl(g.target_amount)}</strong><span class="muted">Reservado: ${brl(g.saved_amount)} · Pago nas etapas: ${brl(paid)}</span><div class="mini">Total estimado das etapas: ${brl(estimated)} · Falta pagar: ${brl(Math.max(0,estimated-paid))}</div></div></div><div class="section card"><div class="row"><h2>Subobjetivos e etapas</h2><span class="tag">${items.length} itens</span></div><p class="muted">Ex.: buffet, decoração, banda, cerimonialista, local, fotógrafo, vestimentas. Cada subobjetivo tem seu próprio progresso de 0% a 100%.</p>${items.length?`<div class="grid g2">${items.map(i=>{let ip=Math.max(0,Math.min(100,Number(i.progress_percent)||0));return `<div class="card"><div class="row"><h3>${esc(i.name)}</h3><span class="tag">${esc(i.status||'Pendente')}</span></div><p class="muted">${esc(i.category||'Outros')}${i.due_date?' · Prazo: '+esc(i.due_date):''}</p><div class="row"><strong>${ip.toFixed(0)}% concluído</strong><span class="mini">${brl(i.paid_amount)} / ${brl(i.estimated_amount)} pagos</span></div><div class="bar" style="margin:8px 0 12px"><div class="fill" style="width:${ip}%;background-color:${progressColor(ip)}"></div></div><div class="progressline"><span>Orçamento: ${brl(i.estimated_amount)}</span><span>${i.estimated_amount?Math.min(100,Number(i.paid_amount||0)/Number(i.estimated_amount)*100).toFixed(0):0}% pago</span></div>${i.notes?`<p class="mini">${esc(i.notes)}</p>`:''}<div class="actions" style="margin-top:12px"><button class="btn" onclick="editGoalItem('${i.id}')">Editar</button><button class="btn danger" onclick="deleteGoalItem('${i.id}')">Excluir</button></div></div>`}).join('')}</div>`:'<div class="empty">Ainda não há subobjetivos. Clique em “+ Adicionar subobjetivo” para criar o primeiro, como buffet, decoração ou cerimonialista.</div>'}</div><div class="section card"><h2>Informações do objetivo</h2><p>${esc(g.notes||'Nenhuma observação adicionada.')}</p><p class="muted">Prazo: ${esc(g.deadline||'não definido')} · Natureza: ${g.ownership==='couple'?'Casal':'Individual'}</p></div>`}
function openGoalItemForm(goalId,item=null){let isEdit=!!item;modal(isEdit?'Editar item do objetivo':'Adicionar item ao objetivo',`<div class="formgrid"><label class="full">Nome do item / fornecedor<input id="f_item_name" required placeholder="Ex.: Buffet, decoração, banda" value="${esc(item?.name||'')}"></label><label>Categoria<select id="f_item_category">${['Fornecedor','Buffet','Decoração','Banda/DJ','Cerimonialista','Local/ espaço','Fotografia e vídeo','Vestimenta','Convites','Documentação','Pagamento','Outro'].map(c=>`<option ${item?.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label>Status<select id="f_item_status">${['Pendente','Pesquisando','Orçamento recebido','Contratado','Sinal pago','Parcialmente pago','Pago','Concluído','Cancelado'].map(c=>`<option ${item?.status===c?'selected':''}>${c}</option>`).join('')}</select></label><label>Progresso da etapa (%)<input id="f_item_progress" type="number" min="0" max="100" step="1" value="${Math.max(0,Math.min(100,Number(item?.progress_percent??(item?.status==='Concluído'?100:0))))}"></label><label>Valor estimado<input id="f_item_estimated" type="number" min="0" step="0.01" value="${Number(item?.estimated_amount||0)}"></label><label>Valor já pago<input id="f_item_paid" type="number" min="0" step="0.01" value="${Number(item?.paid_amount||0)}"></label><label>Prazo / vencimento<input id="f_item_due" type="date" value="${esc(item?.due_date||'')}"></label><label class="full">Observações<textarea id="f_item_notes">${esc(item?.notes||'')}</textarea></label></div>`,`submitGoalItem(event,'${goalId}'${isEdit?`, '${item.id}'`:''})`)}
async function submitGoalItem(e,goalId,itemId=null){e.preventDefault();let payload={goal_id:goalId,couple_id:state.coupleId,owner_user_id:state.user.id,name:v('f_item_name'),category:v('f_item_category'),status:v('f_item_status'),progress_percent:Math.max(0,Math.min(100,Number(v('f_item_progress')||0))),estimated_amount:Number(v('f_item_estimated')||0),paid_amount:Number(v('f_item_paid')||0),due_date:v('f_item_due')||null,notes:v('f_item_notes'),updated_at:new Date().toISOString()};let q=itemId?await sb.from('goal_items').update(payload).eq('id',itemId).eq('couple_id',state.coupleId):await sb.from('goal_items').insert(payload);if(q.error){toast('Não foi possível salvar o item: '+q.error.message+' (confira se a migração goal_items foi aplicada)');return}closeModal();toast(itemId?'Item atualizado':'Item adicionado');render()}
async function editGoalItem(id){let q=await sb.from('goal_items').select('*').eq('id',id).eq('couple_id',state.coupleId).single();if(q.error||!q.data){toast('Não foi possível abrir este item.');return}openGoalItemForm(q.data.goal_id,q.data)}
async function deleteGoalItem(id){if(!confirm('Excluir este item do objetivo?'))return;let q=await sb.from('goal_items').delete().eq('id',id).eq('couple_id',state.coupleId);if(q.error)toast('Não foi possível excluir: '+q.error.message);else{toast('Item excluído');render()}}
async function editGoal(id){let q=await sb.from('goals').select('*').eq('id',id).single();let g=q.data;if(q.error||!g){toast('Não foi possível abrir o objetivo.');return}modal('Editar objetivo',`<div class="formgrid"><label>Nome<input id="f_name" value="${esc(g.name)}" required></label><label>Natureza<select id="f_ownership"><option value="individual" ${g.ownership==='individual'?'selected':''}>Individual</option><option value="couple" ${g.ownership==='couple'?'selected':''}>Do casal</option></select></label><label>Meta financeira<input id="f_target" type="number" step="0.01" value="${Number(g.target_amount||0)}"></label><label>Já guardado<input id="f_saved" type="number" step="0.01" value="${Number(g.saved_amount||0)}"></label><label>Prazo<input id="f_deadline" type="date" value="${esc(g.deadline||'')}"></label><label class="full">Observações<textarea id="f_notes">${esc(g.notes||'')}</textarea></label></div>`,`submitGoalEdit(event,'${id}')`)}

async function relatorios(){let x=await data(),r=x.transactions.filter(t=>t.kind==='income').reduce((s,t)=>s+Number(t.amount),0),d=x.transactions.filter(t=>t.kind==='expense').reduce((s,t)=>s+Number(t.amount),0);return layout('Relatórios','Resumo dos dados que já estão no banco.')+`<div class="grid g3"><div class="card metric"><small>Receitas</small><strong>${brl(r)}</strong></div><div class="card metric"><small>Despesas</small><strong>${brl(d)}</strong></div><div class="card metric"><small>Comprometimento</small><strong>${r?(d/r*100).toFixed(1):0}%</strong></div></div><div class="section card"><div class="notice">📊 Os relatórios passam a refletir os lançamentos reais dos dois usuários conforme a base for preenchida.</div></div>`}
function config(){return layout('Configurações','Conta, casal e conexão.')+`<div class="card"><h2>Perfil</h2><p><b>${esc(state.profile?.display_name||'Usuário')}</b><br><span class="muted">${esc(state.user?.email||'')}</span></p><div class="notice">☁️ Conectado ao Supabase. Seus dados não dependem do navegador onde o site foi aberto.</div><div class="section"><h2>Privacidade financeira</h2><p class="muted">Ao autorizar, seu parceiro poderá ver apenas o saldo total das suas contas individuais, sem ver nomes de bancos, contas ou lançamentos privados.</p><button class="btn ${state.profile?.share_balance_with_partner?'primary':''}" onclick="toggleBalanceShare()">${state.profile?.share_balance_with_partner?'✓ Saldo compartilhado — clique para revogar':'Permitir que meu parceiro veja meu saldo total'}</button></div><button class="btn danger" onclick="logout()">Sair da conta</button></div>`}async function toggleBalanceShare(){let next=!state.profile?.share_balance_with_partner;let {data,error}=await sb.from('profiles').update({share_balance_with_partner:next}).eq('id',state.user.id).select('*').single();if(error){toast('Não foi possível alterar a permissão: '+error.message);return}state.profile=data;toast(next?'Compartilhamento do saldo ativado':'Compartilhamento do saldo revogado');render()}
async function render(){if(!state.user){document.getElementById('root').innerHTML=login();return}if(!state.coupleId){document.getElementById('root').innerHTML='<div class="login"><div class="loginbox"><h1>Quase pronto</h1><p>Seu usuário foi autenticado, mas ainda não encontramos o vínculo com o casal.</p></div></div>';return}let fn={dashboard,lancamentos,contas,dividas,projetos,objetivos,goalDetail,projectDetail,relatorios,config}[state.page]||dashboard;let content=await fn();document.getElementById('root').innerHTML=shell(content);if(state.page==='dashboard')enhanceDashboardCards();enhanceExpandableCards()}
async function doLogin(e){e.preventDefault();let email=document.getElementById('email').value,password=document.getElementById('password').value;let m=document.getElementById('loginMsg');m.classList.remove('hidden');m.textContent='Entrando...';let {error}=await sb.auth.signInWithPassword({email,password});if(error){m.textContent=error.message;return}m.textContent='Login realizado.'}
async function logout(){await sb.auth.signOut()}
function go(p){state.page=p;render()}
async function del(table,id){if(!confirm('Excluir este item?'))return;if(table==='transactions'){let q=await sb.from('transactions').select('transfer_id').eq('id',id).maybeSingle();if(q.data?.transfer_id){let r=await sb.rpc('cancel_financial_transfer',{p_transfer_id:q.data.transfer_id});if(r.error){toast(r.error.message);return}toast('Transferência cancelada dos dois lados');render();return}}let {error}=await sb.from(table).delete().eq('id',id);if(error)toast(error.message);else{toast('Excluído');render()}}
function modal(title,fields,submit){document.getElementById('modalRoot').innerHTML=`<div class="modal"><div class="modalbox"><div class="modalhead"><h2>${title}</h2><button class="close" onclick="closeModal()">×</button></div><form class="form" onsubmit="${submit}">${fields}<div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar</button></div></form></div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function ownField(){return `<label>Natureza<select id="f_ownership"><option value="individual">👤 Gasto/receita pessoal</option><option value="couple">💍 Do casal</option></select></label><label>Quem pode ver<select id="f_visibility"><option value="shared">👁 Compartilhar com Adrielly</option><option value="private">🔒 Só eu posso ver</option></select></label>`}
function accountOptions(){let {accounts=[]}=window.__nfdata||{};return accounts.filter(a=>a.ownership==='couple'||a.owner_user_id===state.user.id).map(a=>`<option value="${a.id}">${esc(a.name)} · ${brl(a.current_balance)}</option>`).join('')}async function loadPartnerTransferAccounts(){let sel=document.getElementById('f_to');if(!sel)return;try{let r=await sb.rpc('partner_transfer_accounts');if(r.error){console.warn(r.error);return}for(let a of (r.data||[])){if(![...sel.options].some(o=>o.value===a.account_id)){let op=document.createElement('option');op.value=a.account_id;op.textContent=a.account_name+' · conta da(o) parceira(o)';sel.appendChild(op)}}}catch(e){console.warn(e)}}

nta, o saldo será atualizado automaticamente quando o lançamento for salvo. Gasto pessoal pode continuar visível para o casal.</div>`,`submitTransaction(event,'${type}')`);return}
if(type==='transfer'){let ac=accountOptions();modal('Transferência entre contas',`<div class="notice">O valor sai de uma conta e entra na outra. Não será contabilizado como receita nem despesa.</div><div class="formgrid"><label class="full">Descrição<input id="f_desc" value="Transferência entre contas" required></label><label>Valor transferido<input id="f_amount" type="number" min="0.01" step="0.01" required></label><label>Data e hora<input id="f_datetime" type="datetime-local" value="${new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16)}"></label><label>Conta de origem<select id="f_from" required><option value="">Selecione</option>${ac}</select></label><label>Conta de destino<select id="f_to" required><option value="">Selecione</option>${ac}</select></label><label class="full">Quem pode ver<select id="f_visibility"><option value="shared">👁 Compartilhar com Adrielly</option><option value="private">🔒 Só eu posso ver</option></select></label><label class="full">Observações<textarea id="f_notes"></textarea></label></div>`,`submitTransfer(event)`);loadPartnerTransferAccounts();return}
if(type==='account'){modal('Nova conta ou cartão',`<div class="formgrid"><label>Nome<input id="f_name" required placeholder="Nubank"></label><label>Instituição<input id="f_inst" placeholder="Nubank"></label><label>Tipo<select id="f_type"><option value="bank">Conta bancária</option><option value="credit_card">Cartão de crédito</option><option value="savings">Poupança</option><option value="wallet">Carteira</option></select></label><label>Saldo inicial/atual<input id="f_balance" type="number" step="0.01" value="0"></label><label class="full">Logo ou imagem da conta<input id="f_image" type="file" accept="image/*" onchange="previewImage(event)"><input id="f_image_data" type="hidden"><span class="mini">Imagem opcional; prefira arquivo pequeno (até 1 MB).</span></label>${ownField()}<label>Observações<textarea id="f_notes"></textarea></label></div>`,`submitAccount(event)`);return}
if(type==='debt'){modal('Nova dívida',`<div class="formgrid"><label>Nome<input id="f_name" required placeholder="Ex.: Financiamento"></label><label>Valor total<input id="f_total" type="number" step="0.01"></label><label>Valor restante<input id="f_remaining" type="number" step="0.01"></label><label>Total de parcelas<input id="f_installments" type="number"></label>${ownField()}<label>Próximo vencimento<input id="f_due" type="date"></label><label class="full">Observações<textarea id="f_notes"></textarea></label></div>`,`submitDebt(event)`);return}
if(type==='project'){modal('Novo projeto',`<div class="formgrid"><label>Nome<input id="f_name" required placeholder="Ex.: Casamento 2027"></label><label>Emoji<input id="f_emoji" value="🎯"></label><label>Meta financeira<input id="f_target" type="number" step="0.01" value="0"></label><label>Já reservado<input id="f_saved" type="number" step="0.01" value="0"></label><label>Data<input id="f_date" type="date"></label><label>Local/destino<input id="f_place" placeholder="Recife, Santiago..."></label><label class="full">Observações<textarea id="f_notes"></textarea></label></div>`,`submitProject(event)`);return}

function v(id){return document.getElementById(id)?.value||''}function previewImage(e){let f=e.target.files?.[0];if(!f)return;if(f.size>1024*1024){toast('Escolha uma imagem de até 1 MB.');e.target.value='';return}let rd=new FileReader();rd.onload=()=>{document.getElementById('f_image_data').value=rd.result};rd.readAsDataURL(f)}
async function editTransaction(id){let t=(window.__nfdata?.allTransactions||[]).find(z=>z.id===id);if(!t){let q=await sb.from('transactions').select('*').eq('id',id).single();t=q.data}if(!t)return;if(t.transfer_id){toast('Para manter os saldos corretos, cancele a transferência e registre outra.');return}if(t.owner_user_id!==state.user.id&&t.ownership!=='couple'){toast('Você pode editar somente seus lançamentos individuais.');return}let dt=t.transaction_at?new Date(t.transaction_at):new Date((t.transaction_date||new Date().toISOString().slice(0,10))+'T12:00:00');let local=new Date(dt.getTime()-dt.getTimezoneOffset()*60000).toISOString().slice(0,16);modal('Editar lançamento',`<div class="formgrid"><label class="full">Descrição<input id="f_desc" value="${esc(t.description)}" required></label><label>Valor<input id="f_amount" type="number" step="0.01" min="0.01" value="${Number(t.amount)}" required></label><label>Data e hora<input id="f_datetime" type="datetime-local" value="${local}" required></label><label>Categoria<input id="f_category" value="${esc(t.category_label||'Outros')}"></label><label>Origem/tipo<input id="f_source" value="${esc(t.movement_source||'')}"></label><label>Forma de pagamento<input id="f_payment" value="${esc(t.payment_method||'')}"></label><label>Visibilidade<select id="f_visibility"><option value="shared" ${t.visibility==='shared'?'selected':''}>Compartilhado</option><option value="private" ${t.visibility==='private'?'selected':''}>Privado</option></select></label><label class="full">Observações<textarea id="f_notes">${esc(t.notes||'')}</textarea></label></div><div class="notice">As alterações serão registradas no histórico de auditoria.</div>`,`submitTransactionEdit(event,'${id}')`)}async function submitTransactionEdit(e,id){e.preventDefault();let patch={description:v('f_desc'),amount:Number(v('f_amount')),transaction_date:(v('f_datetime')||new Date().toISOString()).slice(0,10),transaction_at:v('f_datetime')?new Date(v('f_datetime')).toISOString():new Date().toISOString(),category_label:v('f_category'),movement_source:v('f_source'),payment_method:v('f_payment'),visibility:v('f_visibility'),notes:v('f_notes'),updated_at:new Date().toISOString()};let {error}=await sb.from('transactions').update(patch).eq('id',id);if(error)toast('Não foi possível editar: '+error.message);else{closeModal();toast('Lançamento atualizado e registrado no histórico');render()}}
async function submitTransaction(e,type){e.preventDefault();let {error}=await sb.from('transactions').insert({couple_id:state.coupleId,owner_user_id:state.user.id,description:v('f_desc'),amount:Number(v('f_amount')),kind:type==='income'?'income':'expense',ownership:v('f_ownership'),visibility:v('f_visibility')||'shared',account_id:v('f_account')||null,payment_method:v('f_payment'),category_label:v('f_category'),movement_source:v('f_source'),transaction_date:(v('f_datetime')||new Date().toISOString()).slice(0,10),transaction_at:v('f_datetime')?new Date(v('f_datetime')).toISOString():new Date().toISOString(),notes:v('f_notes')});if(error)toast(error.message);else{closeModal();toast('Lançamento salvo; saldo da conta atualizado');render()}}
async function submitTransfer(e){e.preventDefault();let from=v('f_from'),to=v('f_to'),amount=Number(v('f_amount'));if(!from||!to||from===to){toast('Escolha duas contas diferentes.');return}let {error}=await sb.rpc('create_financial_transfer',{p_couple_id:state.coupleId,p_from_account:from,p_to_account:to,p_amount:amount,p_description:v('f_desc')||'Transferência entre contas',p_transaction_at:v('f_datetime')?new Date(v('f_datetime')).toISOString():new Date().toISOString(),p_visibility:v('f_visibility')||'shared',p_notes:v('f_notes')||null});if(error){toast('Não foi possível registrar a transferência. Confirme se a atualização SQL foi aplicada: '+error.message);return}closeModal();toast('Transferência registrada; saldos atualizados');render()}
async function submitAccount(e){e.preventDefault();let own=v('f_ownership');let {error}=await sb.from('accounts').insert({couple_id:state.coupleId,owner_user_id:state.user.id,name:v('f_name'),account_type:v('f_type'),ownership:own,institution:v('f_inst'),current_balance:Number(v('f_balance')),image_url:v('f_image_data')||null,notes:v('f_notes')});if(error)toast(error.message);else{closeModal();toast('Conta salva');render()}}
async function submitDebt(e){e.preventDefault();let {error}=await sb.from('debts').insert({couple_id:state.coupleId,owner_user_id:state.user.id,name:v('f_name'),ownership:v('f_ownership'),total_amount:Number(v('f_total')),remaining_amount:Number(v('f_remaining')),installments_total:Number(v('f_installments'))||null,next_due_date:v('f_due')||null,notes:v('f_notes')});if(error)toast(error.message);else{closeModal();toast('Dívida salva');render()}}
async function submitProject(e){e.preventDefault();let {error}=await sb.from('projects').insert({couple_id:state.coupleId,name:v('f_name'),emoji:v('f_emoji'),target_amount:Number(v('f_target')),saved_amount:Number(v('f_saved')),target_date:v('f_date')||null,place:v('f_place'),notes:v('f_notes')});if(error)toast(error.message);else{closeModal();toast('Projeto salvo');render()}}
async function submitGoal(e){e.preventDefault();let {error}=await sb.from('goals').insert({couple_id:state.coupleId,owner_user_id:state.user.id,name:v('f_name'),ownership:v('f_ownership'),target_amount:Number(v('f_target')),saved_amount:Number(v('f_saved')),deadline:v('f_deadline')||null,notes:v('f_notes')});if(error)toast(error.message);else{closeModal();toast('Objetivo salvo');render()}}
async function editAccount(aid){let a=(window.__nfdata?.accounts||[]).find(z=>z.id===aid);if(!a)return;modal('Editar conta',`<div class="formgrid"><label>Nome<input id="f_name" required value="${esc(a.name)}"></label><label>Instituição<input id="f_inst" value="${esc(a.institution||'')}"></label><label>Tipo<select id="f_type"><option value="bank" ${a.account_type==='bank'?'selected':''}>Conta bancária</option><option value="credit_card" ${a.account_type==='credit_card'?'selected':''}>Cartão de crédito</option><option value="savings" ${a.account_type==='savings'?'selected':''}>Poupança</option><option value="wallet" ${a.account_type==='wallet'?'selected':''}>Carteira</option></select></label><label>Saldo atual<input id="f_balance" type="number" step="0.01" value="${Number(a.current_balance||0)}"></label><label class="full">Trocar logo/imagem<input id="f_image" type="file" accept="image/*" onchange="previewImage(event)"><input id="f_image_data" type="hidden"><span class="mini">Deixe vazio para manter a imagem atual.</span></label><label class="full">Observações<textarea id="f_notes">${esc(a.notes||'')}</textarea></label></div>`,`submitAccountEdit(event,'${aid}')`)}async function submitAccountEdit(e,aid){e.preventDefault();let patch={name:v('f_name'),institution:v('f_inst'),account_type:v('f_type'),current_balance:Number(v('f_balance')),notes:v('f_notes'),updated_at:new Date().toISOString()};if(v('f_image_data'))patch.image_url=v('f_image_data');let {error}=await sb.from('accounts').update(patch).eq('id',aid).eq('owner_user_id',state.user.id);if(error)toast(error.message);else{closeModal();toast('Conta atualizada');render()}}

async function submitProjectEdit(e,pid){e.preventDefault();let {error}=await sb.from('projects').update({name:v('f_name'),emoji:v('f_emoji'),target_amount:Number(v('f_target')),saved_amount:Number(v('f_saved')),target_date:v('f_date')||null,place:v('f_place'),notes:v('f_notes'),updated_at:new Date().toISOString()}).eq('id',pid);if(error)toast(error.message);else{closeModal();toast('Projeto atualizado');render()}}

function nfRecordActions(type,id){
 const maps={transaction:{label:'lançamento',edit:()=>editTransaction(id),table:'transactions'},
 account:{label:'conta',edit:()=>editAccount(id),table:'accounts'},
 debt:{label:'dívida',edit:()=>editDebt(id),table:'debts'},
 project:{label:'projeto',edit:()=>editProject(id),table:'projects'}};
 const a=maps[type];if(!a)return;
 const item=(window.__nfdata?.[type==='transaction'?'allTransactions':type==='account'?'accounts':type==='debt'?'debts':'projects']||[]).find(x=>x.id===id);
 const label=item?.name||item?.description||a.label;
 const root=document.getElementById('modalRoot');if(!root)return;
 root.innerHTML=`<div class="modal"><div class="modalbox"><div class="modalhead"><div><h2>${esc(label)}</h2><p class="muted" style="margin:5px 0 0">Escolha uma ação para este ${esc(a.label)}.</p></div><button class="close" type="button" onclick="closeModal()" aria-label="Fechar">×</button></div><div class="nf-record-actions"><button class="btn primary" type="button" id="nfActionEdit">Editar</button>${type==='project'?'<button class="btn" type="button" id="nfActionOpen">Abrir projeto</button>':''}<button class="btn danger" type="button" id="nfActionDelete">Excluir</button><button class="btn" type="button" onclick="closeModal()">Cancelar</button></div></div></div>`;
 document.getElementById('nfActionEdit').onclick=()=>a.edit();
 const open=document.getElementById('nfActionOpen');if(open)open.onclick=()=>{closeModal();openProject(id)};
 document.getElementById('nfActionDelete').onclick=()=>{closeModal();del(a.table,id)};
}
function nfRecordClickHandler(event){
 if(event.target.closest('button,a,input,select,textarea,label'))return;
 const target=event.target.closest('[data-nf-record][data-nf-id]');
 if(!target||!target.closest('.main'))return;
 nfRecordActions(target.dataset.nfRecord,target.dataset.nfId);
}
document.addEventListener('click',nfRecordClickHandler);
document.addEventListener('keydown',event=>{
 if(event.key!=='Enter'&&event.key!==' ')return;
 if(event.target.matches('[data-nf-record][data-nf-id]')){event.preventDefault();nfRecordActions(event.target.dataset.nfRecord,event.target.dataset.nfId)}
});
async function editDebt(id){
 let d=(window.__nfdata?.debts||[]).find(x=>x.id===id);
 if(!d){const r=await sb.from('debts').select('*').eq('id',id).eq('couple_id',state.coupleId).maybeSingle();if(r.error){toast(r.error.message);return}d=r.data}
 if(!d){toast('Dívida não encontrada');return}
 modal('Editar dívida',`<div class="formgrid"><label class="full">Nome<input id="f_name" required value="${esc(d.name)}"></label><label>Valor total<input id="f_total" type="number" step="0.01" min="0" value="${Number(d.total_amount)||0}"></label><label>Saldo restante<input id="f_remaining" type="number" step="0.01" min="0" value="${Number(d.remaining_amount)||0}"></label><label>Total de parcelas<input id="f_installments" type="number" min="0" value="${Number(d.installments_total)||0}"></label><label>Próximo vencimento<input id="f_due" type="date" value="${esc((d.next_due_date||d.due_date||'').slice(0,10))}"></label><label class="full">Observações<textarea id="f_notes">${esc(d.notes||'')}</textarea></label></div>`,`submitDebtEdit(event,'${id}')`);
}
async function submitDebtEdit(e,id){
 e.preventDefault();
 const remaining=Number(v('f_remaining')),total=Number(v('f_total'));
 if(remaining>total){toast('O saldo restante não pode ultrapassar o valor total.');return}
 const payload={name:v('f_name'),total_amount:total,remaining_amount:remaining,installments_total:Number(v('f_installments'))||null,notes:v('f_notes')};
 const current=(window.__nfdata?.debts||[]).find(x=>x.id===id);
 payload[current&&Object.prototype.hasOwnProperty.call(current,'next_due_date')?'next_due_date':'due_date']=v('f_due')||null;
 const r=await sb.from('debts').update(payload).eq('id',id).eq('couple_id',state.coupleId);
 if(r.error){toast('Não foi possível salvar: '+r.error.message);return}
 closeModal();toast('Dívida atualizada');render();
}

init();
</script>
</body></html>
