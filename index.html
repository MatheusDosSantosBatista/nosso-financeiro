/* Identidade visual profissional — cores secundárias com significado */
:root{
  --bg:#f5f7fb; --card:#ffffff; --ink:#182638; --muted:#687789;
  --navy:#193b5a; --terr:#3977a8; --moss:#23845b; --beige:#edf2f8;
  --line:#e0e7ef; --danger:#c0392b; --shadow:0 8px 26px rgba(28,48,74,.07);
  --accent-blue:#3478b8; --accent-teal:#138a8a; --accent-purple:#7564bd;
  --accent-coral:#d66b58; --accent-green:#27845b; --accent-amber:#b98220;
}
body{background:var(--bg);color:var(--ink)}
.side{background:linear-gradient(180deg,#fff 0%,#f8faff 100%);box-shadow:3px 0 18px rgba(25,59,90,.025)}
.brand{color:#193b5a;letter-spacing:-.55px;position:relative}
.brand:after{content:"";display:block;width:42px;height:4px;border-radius:5px;margin:12px 0 0 0;background:linear-gradient(90deg,#3478b8 0 34%,#138a8a 34% 67%,#7564bd 67%)}
.brand small{letter-spacing:.1px}
.nav{gap:7px}
.nav button{border:1px solid transparent;transition:background .18s ease,border-color .18s ease,transform .18s ease;font-weight:500}
.nav button:hover{transform:translateX(2px)}
.nav button:nth-child(1).active{background:#e7f0fb;color:#245f9b;border-color:#d3e4f7}
.nav button:nth-child(2).active{background:#e1f5f2;color:#087b76;border-color:#c5eae5}
.nav button:nth-child(3).active{background:#eee9fc;color:#6651ad;border-color:#ded5fa}
.nav button:nth-child(4).active{background:#fff0e9;color:#b84d35;border-color:#f8d9cc}
.nav button:nth-child(5).active{background:#fbe8ef;color:#ad3e69;border-color:#f4d1df}
.nav button:nth-child(6).active{background:#e5f5e9;color:#237348;border-color:#cdebd6}
.nav button:nth-child(7).active{background:#fff4d9;color:#91600b;border-color:#f5e4b1}
.nav button:nth-child(8).active{background:#e9eef3;color:#4a5b6c;border-color:#d9e1e9}
.title h1{color:#183b5b;letter-spacing:-.8px;font-weight:800;position:relative;padding-left:14px}
.title h1:before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:4px;border-radius:5px;background:linear-gradient(180deg,#3478b8,#138a8a)}
.title p{font-size:13px}
.section h2{color:#234765;font-weight:750;letter-spacing:-.25px}
.card{box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease;border-radius:16px}
.card:hover{box-shadow:0 12px 30px rgba(28,48,74,.09)}
.grid.g4>.card:nth-child(4n+1){border-top:3px solid #3478b8}
.grid.g4>.card:nth-child(4n+2){border-top:3px solid #138a8a}
.grid.g4>.card:nth-child(4n+3){border-top:3px solid #7564bd}
.grid.g4>.card:nth-child(4n){border-top:3px solid #d66b58}
.grid.g3>.card:nth-child(3n+1){border-top:3px solid #3478b8}
.grid.g3>.card:nth-child(3n+2){border-top:3px solid #138a8a}
.grid.g3>.card:nth-child(3n){border-top:3px solid #7564bd}
.grid.g2>.card:nth-child(2n+1){border-top:3px solid #3478b8}
.grid.g2>.card:nth-child(2n){border-top:3px solid #138a8a}
.metric strong{letter-spacing:-.7px;font-weight:800}
.metric small{font-weight:650;letter-spacing:.15px}
.tag{background:#e8f0f8;color:#355b7c;font-weight:650}
.thumb{background:#edf3fa}
.btn{transition:filter .15s ease,transform .15s ease;box-shadow:0 1px 2px rgba(15,23,42,.025)}
.btn:hover{filter:brightness(.98);transform:translateY(-1px)}
.btn.primary{background:#244f76;border-color:#244f76}
.form input:focus,.form select:focus,.form textarea:focus{border-color:#5d9bd0;box-shadow:0 0 0 3px rgba(52,120,184,.13)}
.notice{background:#eaf2fa;color:#2d4d69;border-left:3px solid #3478b8}
.status{background:#eaf2fa;color:#2d4d69}
.loginbox h1{color:#193b5a;letter-spacing:-.8px}
.avatar{background:#dceafa;color:#244f76}

/* Paleta equivalente no tema escuro, mantendo contraste e identidade */
body.dark-mode{--bg:#07090d;--card:#11161d;--ink:#f4f7fb;--muted:#a4afbd;--navy:#9ac7f0;--terr:#78b4e5;--moss:#65d29b;--beige:#202a36;--line:#2a3542;--danger:#ff8178;--shadow:0 8px 28px rgba(0,0,0,.32);background:#07090d;color:#f4f7fb}

body.dark-mode .brand{color:#e8f2fc}
body.dark-mode .title h1{color:#f0f6fc}
body.dark-mode .section h2{color:#d8e8f7}
body.dark-mode .nav button:nth-child(1).active{background:#1b3045;color:#b7dcff;border-color:#294866}
body.dark-mode .nav button:nth-child(2).active{background:#153533;color:#a4eee5;border-color:#245451}
body.dark-mode .nav button:nth-child(3).active{background:#292340;color:#d2c7ff;border-color:#403565}
body.dark-mode .nav button:nth-child(4).active{background:#3a2522;color:#ffc0ad;border-color:#5b3731}
body.dark-mode .nav button:nth-child(5).active{background:#3a202c;color:#ffc0d5;border-color:#5c3043}
body.dark-mode .nav button:nth-child(6).active{background:#1b3327;color:#b0efc3;border-color:#2b513a}
body.dark-mode .nav button:nth-child(7).active{background:#382e19;color:#ffe1a0;border-color:#594824}
body.dark-mode .nav button:nth-child(8).active{background:#252d36;color:#d3dee8;border-color:#3b4856}
body.dark-mode .tag{background:#202c39;color:#d2e5f7}
body.dark-mode .thumb{background:#202c39}

body.dark-mode .grid.g4>.card,body.dark-mode .grid.g3>.card,body.dark-mode .grid.g2>.card{border-left-color:var(--line);border-right-color:var(--line);border-bottom-color:var(--line)}
body.dark-mode .grid.g4>.card:nth-child(4n+1),body.dark-mode .grid.g3>.card:nth-child(3n+1),body.dark-mode .grid.g2>.card:nth-child(2n+1){border-top-color:#5b9fe0}
body.dark-mode .grid.g4>.card:nth-child(4n+2),body.dark-mode .grid.g3>.card:nth-child(3n+2),body.dark-mode .grid.g2>.card:nth-child(2n){border-top-color:#45bdb3}
body.dark-mode .grid.g4>.card:nth-child(4n+3),body.dark-mode .grid.g3>.card:nth-child(3n){border-top-color:#a397ec}
body.dark-mode .grid.g4>.card:nth-child(4n){border-top-color:#ee927e}
@media(max-width:900px){.nav button:hover{transform:none}}



/* Cores semânticas para receitas e despesas */
:root{--income:#21845b;--income-soft:#e4f5eb;--expense:#c44848;--expense-soft:#fdeaea;--progress-red:#e04444;--progress-orange:#f39a38;--progress-yellow:#d8bd42;--progress-green:#27845b}
.positive{color:var(--income)!important;font-weight:700}
.negative{color:var(--expense)!important;font-weight:700}
.finance-positive-value{color:var(--income)!important}
.finance-negative-value{color:var(--expense)!important}
.item strong.positive,.item strong.negative{padding:6px 9px;border-radius:8px;white-space:nowrap;font-size:13px}
.item strong.positive{background:var(--income-soft)}
.item strong.negative{background:var(--expense-soft)}
.metric .positive,.metric .negative{display:inline-flex;align-items:center;gap:5px;width:max-content;max-width:100%;padding:5px 8px;border-radius:8px;font-size:11px}
.metric .positive{background:var(--income-soft)}
.metric .negative{background:var(--expense-soft)}
.bar{height:10px;background:#e9edf2;border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(15,23,42,.06)}
.fill{height:100%;border-radius:99px;background:var(--progress-red);transition:width .45s ease,background-color .45s ease;box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.nav button{display:flex;align-items:center;gap:11px;min-height:43px}
.nav button .nav-icon{width:19px;height:19px;flex:0 0 19px;display:inline-grid;place-items:center;color:currentColor;opacity:.9}
.nav button .nav-icon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.active .nav-icon{opacity:1}
.thumb{border:1px solid rgba(100,116,139,.12);box-shadow:0 2px 5px rgba(15,23,42,.035);font-size:19px}
body.dark-mode{--income:#70d6a0;--income-soft:#153a2b;--expense:#ff8b8b;--expense-soft:#421f25;--progress-red:#f06c6c;--progress-orange:#f4a261;--progress-yellow:#e2cc5c;--progress-green:#55c98b}
body.dark-mode .bar{background:#252d37}
body.dark-mode .item strong.positive{background:var(--income-soft)}
body.dark-mode .item strong.negative{background:var(--expense-soft)}
body.dark-mode .metric .positive{background:var(--income-soft)}
body.dark-mode .metric .negative{background:var(--expense-soft)}
body.dark-mode .nav button .nav-icon{color:currentColor}


/* Ícones com cores próprias: paleta profissional, sem monocromia */
.nav button:nth-child(1) .nav-icon{color:#3978b8}
.nav button:nth-child(2) .nav-icon{color:#15968b}
.nav button:nth-child(3) .nav-icon{color:#7962c4}
.nav button:nth-child(4) .nav-icon{color:#d46b4f}
.nav button:nth-child(5) .nav-icon{color:#c4547c}
.nav button:nth-child(6) .nav-icon{color:#34865b}
.nav button:nth-child(7) .nav-icon{color:#b98520}
.nav button:nth-child(8) .nav-icon{color:#64748b}
.nav button .nav-icon{opacity:1}
.nav button.active .nav-icon{filter:saturate(1.12)}
/* Emojis permanecem coloridos; o fundo recebe uma tonalidade discreta */
.thumb{background:linear-gradient(145deg,#f1f5f9,#e8eef5);border-color:#e1e7ef;color:inherit}
.item:nth-child(6n+1) .thumb{background:#e7f0fb;border-color:#d5e4f6}

.item:nth-child(6n+5) .thumb{background:#fbe8ef;border-color:#f3d5e0}
.item:nth-child(6n) .thumb{background:#e5f5e9;border-color:#d1ebd8}

body.dark-mode .item:nth-child(6n+4) .thumb{background:#3a2522;border-color:#5b3731}

/* Minimizar cartões diretamente no painel */
.dash-card-minimize{position:absolute;right:12px;top:12px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:8px;width:30px;height:28px;display:inline-grid;place-items:center;font-size:18px;line-height:1;flex:0 0 auto;padding:0;z-index:2}
.dash-card-minimize:hover{color:var(--navy);background:var(--beige)}
.dash-card-collapsed-label{display:none;font-weight:700;font-size:14px;padding:2px 40px 2px 0;color:var(--ink)}
.card.dash-card-is-collapsed{padding-top:15px;padding-bottom:15px;min-height:56px}
.card.dash-card-is-collapsed .dash-card-content{display:none!important}
.card.dash-card-is-collapsed .dash-card-collapsed-label{display:block}
.card.dash-card-is-collapsed .dash-card-minimize{position:absolute;right:12px;top:12px}
.card.dash-card-has-minimize{position:relative}
.card.dash-card-has-minimize h2,.card.dash-card-has-minimize h3{padding-right:42px}
body.dark-mode .dash-card-minimize{background:#202833;color:#e8edf3;border-color:var(--line)}


/* Central de alertas: compatível com tema claro/escuro e cartões minimizáveis */
.alert-center{min-width:0}.alert-title{align-items:flex-start;gap:12px;flex-wrap:wrap}.alert-title h2{margin:0}.alert-title p{margin:5px 0 0}.alert-title .btn{margin-left:auto}
.alert-pills{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.alert-pill{border-radius:100px;padding:6px 10px;font-size:12px;font-weight:700}

.card{padding:20px;min-width:0;overflow-wrap:break-word;transition:border-color .15s ease,box-shadow .15s ease}

/* remove as faixas multicoloridas e mantém a mesma identidade em todos os cartões */
.grid.g4>.card,.grid.g3>.card,.grid.g2>.card{border-top:1px solid var(--line)!important}
.card h2,.card h3,.card h4{line-height:1.35;overflow-wrap:anywhere;letter-spacing:-.025em}
.card h2{font-size:17px}.card h3{font-size:16px}
.card .mini,.card .muted,.card p{line-height:1.55;overflow-wrap:anywhere}
.card .row{min-width:0;gap:12px}
.card .row>*{min-width:0}
.card .row>.actions,.card .row>.btn,.card .row>button{flex-shrink:0}
.metric strong{font-size:clamp(20px,2vw,26px);line-height:1.2;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.metric small{line-height:1.5}
.item{min-width:0;gap:12px;padding:12px 0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent}
.item:last-child{border-bottom:0}
.item .info{min-width:0;overflow-wrap:anywhere}
.item .info b,.item .info span{overflow-wrap:anywhere;line-height:1.45}
.item>strong{font-variant-numeric:tabular-nums;max-width:46%;text-align:right;overflow-wrap:anywhere}
.thumb{width:40px;height:40px;flex:0 0 40px;border:1px solid var(--line);border-radius:11px}
.tag{max-width:100%;display:inline-flex;align-items:center;width:max-content;white-space:normal;line-height:1.4;border-radius:8px;padding:4px 8px;font-size:11px}
.btn{border-radius:9px;min-height:38px;max-width:100%;white-space:normal;line-height:1.3;box-shadow:none}
.btn:hover{transform:none}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-width:0}
.actions>*{min-width:0}
.bar{height:7px}
.progressline{gap:12px;flex-wrap:wrap;line-height:1.5}
.table{table-layout:auto}.table td,.table th{overflow-wrap:anywhere;vertical-align:middle}
.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.form input,.form select,.form textarea{width:100%;min-width:0}
.modalbox{max-width:min(720px,calc(100vw - 28px))}
.modalhead{gap:14px}.modalhead>*{min-width:0}
/* Cartões de projeto: controles em fluxo, sem competir com título ou etiqueta */
.nf-project-card{padding:20px!important}
.nf-project-card>.nf-project-header{display:grid!important;grid-template-columns:40px minmax(0,1fr) 38px!important;gap:10px!important;align-items:center!important;min-height:40px;margin:0 0 16px!important}
.nf-project-card>.nf-project-header>.thumb{grid-column:1;grid-row:1}
.nf-project-card>.nf-project-header>.tag{display:none!important}
.nf-project-card>.nf-project-header>.nf-project-menu{grid-column:3!important;grid-row:1!important;justify-self:end;position:relative!important;inset:auto!important;z-index:5}
.nf-project-card>.nf-project-header>.nf-project-menu>.nf-menu-items{position:absolute;right:0;top:42px;z-index:10}
.nf-project-card h3{margin:0 0 8px!important;font-size:18px}
.nf-project-card .nf-goal-rollup{padding-top:12px;margin-top:12px;border-top:1px solid var(--line)}
.nf-project-card .nf-goal-rollup>.row{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(85px,max-content)!important;gap:8px!important}
.nf-project-card .nf-goal-rollup>.row>b{text-align:right;white-space:normal!important}
/* Dashboard: reservar faixa exclusiva ao controle de minimizar */
.nf-dashboard-slot .card.dash-card-has-minimize{position:relative;padding:20px!important}
.nf-dashboard-slot .card.dash-card-has-minimize>.dash-card-content{padding-top:32px!important;min-width:0}
.nf-dashboard-slot .dash-card-minimize{position:absolute!important;top:12px!important;right:12px!important;width:28px;height:28px;z-index:4}
.nf-dashboard-slot .card.dash-card-is-collapsed>.dash-card-content{display:none!important}
.nf-dashboard-slot .card.dash-card-is-collapsed{min-height:56px}
.nf-dashboard-slot .dash-card-collapsed-label{padding-right:38px}
.nf-dashboard-slot .nf-panel-head{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px;padding-right:0!important;margin-bottom:14px}
.nf-dashboard-slot .nf-panel-head>div{flex:1 1 180px;min-width:0}
.nf-dashboard-slot .nf-panel-head>.nf-text-action{flex:0 0 auto;max-width:100%;white-space:normal;margin:0}
.nf-dashboard-slot .nf-project-line{min-width:0;gap:10px}
.nf-dashboard-slot .nf-project-detail{min-width:0}
.nf-dashboard-slot .nf-project-detail>.row{gap:10px}
.nf-dashboard-slot .nf-project-detail>.row>b{min-width:0;overflow-wrap:anywhere}
.nf-dashboard-slot .item>strong{max-width:40%}
.nf-dashboard-slot .nf-expand-action{width:100%;min-height:36px}
/* neutralizar fundos e efeitos incompatíveis com o tema escuro */
body.dark-mode .card,body.dark-mode .item,body.dark-mode .modalbox{background:var(--card);color:var(--ink);border-color:var(--line)}
body.dark-mode .card:hover{box-shadow:0 4px 18px rgba(0,0,0,.24)}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.main{padding:16px}.card{padding:16px}.grid{gap:12px}.g2,.g3,.g4{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.top{flex-wrap:wrap}.nf-dashboard-slot .card.dash-card-has-minimize{padding:16px!important}.nf-dashboard-slot .card.dash-card-has-minimize>.dash-card-content{padding-top:30px!important}.nf-project-card{padding:16px!important}}
@media(max-width:420px){.card .row{flex-wrap:wrap}.nf-project-card .nf-goal-rollup>.row{grid-template-columns:minmax(0,1fr) auto!important}.item{flex-wrap:wrap}.item .info{flex:1 1 calc(100% - 58px)}.item>strong{margin-left:52px;max-width:calc(100% - 52px)}}

/* Identidade discreta: todos os cartões, sem sobreposição */
.card .thumb,.nf-project-symbol,.nf-panel-projects .thumb,.nf-personal-card .thumb{background:none!important;border:0!important;box-shadow:none!important;border-radius:0!important;padding:0!important;width:25px!important;height:25px!important;min-width:25px!important;font-size:21px!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;opacity:.78;filter:saturate(.65)}

.elo-text{line-height:1.65;overflow-wrap:anywhere}
.elo-text p{margin:0 0 12px}.elo-text p:last-child{margin-bottom:0}
.elo-text h2,.elo-text h3,.elo-text h4{font-size:1.04em;line-height:1.35;margin:18px 0 8px;font-weight:750}
.elo-text h2:first-child,.elo-text h3:first-child,.elo-text h4:first-child{margin-top:0}
.elo-text ul,.elo-text ol{margin:8px 0 14px;padding-left:24px}
.elo-text li{margin:5px 0}.elo-text li::marker{color:#317453}
.elo-text hr{border:0;border-top:1px solid var(--line,#e5e7eb);margin:17px 0}
.elo-text blockquote{border-left:3px solid #408364;padding:5px 0 5px 13px;margin:12px 0;color:var(--muted)}
.elo-text code{font-size:.9em;background:rgba(100,116,139,.12);border-radius:5px;padding:2px 5px}
.elo-text pre{overflow:auto;background:rgba(100,116,139,.09);padding:12px;border-radius:10px;margin:10px 0}
.elo-text pre code{background:none;padding:0;white-space:pre}
.elo-table-wrap{overflow-x:auto;margin:12px 0}.elo-text table{width:100%;border-collapse:collapse;font-size:.94em}
.elo-text th,.elo-text td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line,#e5e7eb)}
.elo-text th{font-weight:700;background:rgba(100,116,139,.08)}

/* Dashboard v6: cartões se encaixam verticalmente sem deixar buracos */

.nf-elo-mini-head h2{margin:0;font-size:17px}

.nf-elo-mini-form input{flex:1;min-width:0;border:0!important;box-shadow:none!important;background:transparent!important;padding:9px 8px!important}
.nf-elo-mini-form button{border:0;border-radius:9px;background:#26734f;color:white;width:38px;height:36px;cursor:pointer;flex-shrink:0}
.nf-elo-mini-form button:disabled{opacity:.5;cursor:wait}
body.dark-mode .nf-elo-mini-user{background:#253e53;color:#e7eef6}
body.dark-mode .nf-elo-mini-icon{background:#193b2d;color:#8ad5ab}
@media(max-width:850px){.nf-dashboard-grid{grid-template-columns:minmax(0,1fr)}.nf-dashboard-grid>.nf-dashboard-slot{grid-column:1/-1!important}}

 .nf-home-head>.title{flex:0 0 auto!important}

}

/* Inicialização discreta: identidade visual enquanto a sessão é verificada */
.nf-startup{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px;background:var(--bg);color:var(--ink)}
.nf-startup-inner{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;width:min(360px,100%)}
.nf-startup-icon{width:106px;height:106px;object-fit:contain;border-radius:24px;animation:nf-startup-breathe 2.2s ease-in-out infinite}
.nf-startup-name{font-size:22px;font-weight:800;letter-spacing:-.6px;color:var(--ink)}
.nf-startup-caption{font-size:13px;color:var(--muted);line-height:1.5}
.nf-startup-spinner{width:24px;height:24px;margin-top:10px;border:2.5px solid var(--line);border-top-color:#3978b8;border-radius:50%;animation:nf-startup-spin .8s linear infinite}
.nf-startup-error{margin-top:12px;padding:14px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:13px;line-height:1.6;overflow-wrap:anywhere}
@keyframes nf-startup-spin{to{transform:rotate(360deg)}}
@keyframes nf-startup-breathe{50%{transform:scale(1.045);opacity:.85}}
@media(prefers-reduced-motion:reduce){.nf-startup-icon,.nf-startup-spinner{animation:none}}

<body>
<div id="root"></div>
<script>
try{if(localStorage.getItem('nf-theme')==='dark')document.body.classList.add('dark-mode')}catch(e){}
const SUPABASE_URL='https://tkbzgewhaguetumpqweq.supabase.co';
const SUPABASE_KEY='sb_publishable_qAiYf6vwU_pYY8LZDNt1rg_VWctios6';
if(!window.supabase || typeof window.supabase.createClient!=='function'){document.getElementById('root').innerHTML='<div class="login"><div class="loginbox"><h1>Nosso Financeiro</h1><div class="status">Não foi possível carregar o módulo de conexão. Verifique sua internet e tente abrir novamente.</div></div></div>'; throw new Error('Supabase JS não carregou');}
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let state={user:null,profile:null,coupleId:null,page:'dashboard',view:'individual',loading:true,realtime:null,period:'today',from:'',to:'',selectedGoalId:null,selectedProjectId:null};
const brl=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const toast=(m)=>{let e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)};
function diag(msg,ok=false){let r=document.getElementById('diag');if(!r)return;let d=document.createElement('div');d.className='status';d.style.marginTop='8px';d.style.background=ok?'#e5f5ec':'#fdecea';d.innerHTML=(ok?'✅ ':'❌ ')+esc(msg);r.appendChild(d)}
function nfStartupScreen(message='Preparando seu espaço financeiro...',error=false){
 const root=document.getElementById('root');
 if(!root)return;
 root.innerHTML=`<div class="nf-startup" role="status" aria-live="polite"><div class="nf-startup-inner"><img class="nf-startup-icon" src="/apple-touch-icon.png" alt="Alianças do Nosso Financeiro"><div class="nf-startup-name">Nosso Financeiro</div><div class="nf-startup-caption">${esc(message)}</div>${error?'<div class="nf-startup-error">Não foi possível concluir a conexão. Verifique sua internet e tente novamente.</div><button class="btn primary" type="button" onclick="init()">Tentar novamente</button>':'<div class="nf-startup-spinner" aria-hidden="true"></div>'}</div></div>`;
}
async function init(){
 nfStartupScreen();
 try{
  if(!window.supabase||typeof window.supabase.createClient!=='function')throw new Error('Biblioteca Supabase não carregou');
  const res=await fetch(SUPABASE_URL+'/auth/v1/settings',{method:'GET',headers:{'apikey':SUPABASE_KEY}});
  if(!res.ok)throw new Error('Endpoint auth/v1/settings retornou HTTP '+res.status);
  const {data:{session},error}=await sb.auth.getSession();
  if(error)throw new Error('Auth getSession: '+error.message);
  state.user=session?.user||null;
  if(state.user)await loadContext();
  await render();
  if(!window.__nfAuthListenerAttached){
   window.__nfAuthListenerAttached=true;
   sb.auth.onAuthStateChange(async(_e,s)=>{
    state.user=s?.user||null;
    if(state.user)await loadContext();
    else{state.profile=null;state.coupleId=null}
    await render();
   });
  }
 }catch(e){
  console.error('Erro na inicialização do Nosso Financeiro:',e);
  nfStartupScreen('Não foi possível carregar o sistema.',true);
 }
}
async function setupRealtime(){if(!state.coupleId)return;if(state.realtime){try{await sb.removeChannel(state.realtime)}catch(e){}}state.realtime=sb.channel('nosso-financeiro-'+state.coupleId).on('postgres_changes',{event:'*',schema:'public',table:'transactions',filter:'couple_id=eq.'+state.coupleId},()=>render()).on('postgres_changes',{event:'*',schema:'public',table:'accounts',filter:'couple_id=eq.'+state.coupleId},()=>render()).on('postgres_changes',{event:'*',schema:'public',table:'debts',filter:'couple_id=eq.'+state.coupleId},()=>render()).on('postgres_changes',{event:'*',schema:'public',table:'projects',filter:'couple_id=eq.'+state.coupleId},()=>render()).on('postgres_changes',{event:'*',schema:'public',table:'goals',filter:'couple_id=eq.'+state.coupleId},()=>render()).on('postgres_changes',{event:'*',schema:'public',table:'goal_items',filter:'couple_id=eq.'+state.coupleId},()=>render()).on('postgres_changes',{event:'*',schema:'public',table:'project_items',filter:'couple_id=eq.'+state.coupleId},()=>render()).on('postgres_changes',{event:'*',schema:'public',table:'project_payments',filter:'couple_id=eq.'+state.coupleId},()=>render()).subscribe();}
async function loadContext(){let r=await sb.from('profiles').select('*').eq('id',state.user.id).maybeSingle();if(r.error)throw new Error('Tabela profiles: '+r.error.message+' (HTTP '+(r.status||'?')+')');state.profile=r.data;diag('Tabela profiles acessível',true);let {data:cm,error,status}=await sb.from('couple_members').select('couple_id,role').eq('user_id',state.user.id).maybeSingle();if(error)throw new Error('Tabela couple_members: '+error.message+' (HTTP '+(status||'?')+')');state.coupleId=cm?.couple_id||null;diag(state.coupleId?'Vínculo com o casal encontrado':'Usuário sem vínculo com casal',!!state.coupleId);if(state.coupleId){await ensureProjects();await setupRealtime();}}
async function ensureProjects(){let {count}=await sb.from('projects').select('*',{count:'exact',head:true}).eq('couple_id',state.coupleId);if(count===0){await sb.from('projects').insert([{couple_id:state.coupleId,name:'Casamento',emoji:'💍',target_amount:60000,saved_amount:0},{couple_id:state.coupleId,name:'Casa',emoji:'🏠',target_amount:0,saved_amount:0},{couple_id:state.coupleId,name:'Carro',emoji:'🚗',target_amount:0,saved_amount:0},{couple_id:state.coupleId,name:'Viagem',emoji:'✈️',target_amount:0,saved_amount:0},{couple_id:state.coupleId,name:'Filho',emoji:'👶',target_amount:0,saved_amount:0}]);}}
function login(){return `<div class="login"><div class="loginbox"><div class="nf-login-brand" aria-label="Nosso Financeiro">${nfLogoMarkup()}</div><p>Organização financeira para vocês dois. Entre com sua própria conta para manter seus dados individuais separados e compartilhar o que for do casal.</p><div id="loginMsg" class="status hidden"></div><form class="form" onsubmit="doLogin(event)"><label>E-mail<input id="email" type="email" required autocomplete="email"></label><label>Senha<input id="password" type="password" required autocomplete="current-password"></label><button class="btn primary" type="submit">Entrar</button></form></div></div>`}
function nfRestoreUserAppearance(){if(!state.user)return;try{const key='nf-theme-'+state.user.id;let value=localStorage.getItem(key);if(value!== 'dark' && value!=='light'){value=localStorage.getItem('nf-theme')||'light';localStorage.setItem(key,value)}document.body.classList.toggle('dark-mode',value==='dark')}catch(e){}}
function toggleTheme(){const dark=!document.body.classList.contains('dark-mode');document.body.classList.toggle('dark-mode',dark);try{if(state.user)localStorage.setItem('nf-theme-'+state.user.id,dark?'dark':'light');localStorage.setItem('nf-theme',dark?'dark':'light')}catch(e){}render()}
function profileAvatar(profile, name, size=36){const url=profile?.avatar_url;const initial=esc((name||'U').charAt(0).toUpperCase());return url&&/^https:\/\//i.test(url)?`<img class="nf-avatar-photo" style="width:${size}px;height:${size}px" src="${esc(url)}" alt="Foto de ${esc(name||'usuário')}" referrerpolicy="no-referrer">`:`<div class="avatar" style="width:${size}px;height:${size}px" aria-label="Sem foto de perfil">${initial}</div>`}
function profileAge(value){if(!value)return '—';const d=new Date(value+'T12:00:00');if(isNaN(d.getTime()))return '—';const n=new Date();let age=n.getFullYear()-d.getFullYear();if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate()))age--;return age>=0&&age<130?`${age} anos`:'—'}
function profilePage(){const p=state.profile||{},name=p.nickname||p.display_name||'Usuário';return layout('Meu perfil','Seus dados e sua foto de identificação.')+`<div class="card" style="max-width:720px"><div class="row" style="justify-content:flex-start;margin-bottom:22px">${profileAvatar(p,name,64)}<div><b>${esc(name)}</b><p class="muted" style="margin:4px 0">${esc(state.user?.email||'')}</p></div></div><form class="form" onsubmit="savePersonalProfile(event)"><div class="nf-profile-grid"><label>Nome completo<input id="nfFullName" required maxlength="160" value="${esc(p.full_name||'')}"></label><label>Apelido<input id="nfNickname" maxlength="60" value="${esc(p.nickname||p.display_name||'')}"></label><label>Data de nascimento<input type="date" id="nfBirthday" value="${esc(p.birth_date||'')}" max="${new Date().toISOString().slice(0,10)}" onchange="document.getElementById('nfAge').textContent=profileAge(this.value)"></label><label>Idade (calculada automaticamente)<div id="nfAge" style="padding:10px 0;font-weight:700">${profileAge(p.birth_date)}</div></label></div><label>Foto de perfil (JPG, PNG ou WebP, até 3 MB)<input type="file" id="nfAvatarFile" accept="image/jpeg,image/png,image/webp" onchange="nfOpenCrop(this)"></label><div id="nfCropStatus" class="mini" aria-live="polite"></div><p class="mini">Sua foto também aparecerá para seu companheiro no cartão de saldo, sem revelar suas movimentações privadas.</p><div class="actions"><button class="btn primary" type="submit" id="nfProfileSave">Salvar perfil</button><button class="btn" type="button" onclick="go('dashboard')">Voltar ao painel</button></div></form></div>`}
async function savePersonalProfile(event){event.preventDefault();const btn=document.getElementById('nfProfileSave');btn.disabled=true;try{const full_name=document.getElementById('nfFullName').value.trim(),nickname=document.getElementById('nfNickname').value.trim(),birth_date=document.getElementById('nfBirthday').value||null;let avatar_url=state.profile?.avatar_url||null;const file=document.getElementById('nfAvatarFile').files[0];if(file){if(!nfCroppedAvatar)throw new Error('Antes de salvar, ajuste e confirme o recorte da foto.');const path=`${state.user.id}/avatar-${Date.now()}.jpg`;const uploaded=await sb.storage.from('profile-photos').upload(path,nfCroppedAvatar,{contentType:'image/jpeg',upsert:false});if(uploaded.error)throw uploaded.error;avatar_url=sb.storage.from('profile-photos').getPublicUrl(path).data.publicUrl;}const {data,error}=await sb.from('profiles').update({full_name,nickname,display_name:nickname||full_name,birth_date,avatar_url}).eq('id',state.user.id).select('*').single();if(error)throw error;state.profile=data;toast('Perfil atualizado com sucesso.');render()}catch(e){toast('Erro ao salvar perfil: '+e.message)}finally{if(btn.isConnected)btn.disabled=false}}

let nfCroppedAvatar=null;
let nfCropState=null;
function nfOpenCrop(input){
 const file=input.files?.[0];nfCroppedAvatar=null;
 if(!file)return;
 if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>3*1024*1024){toast('Use JPG, PNG ou WebP com até 3 MB.');input.value='';return}
 const url=URL.createObjectURL(file);const img=new Image();
 img.onload=()=>{URL.revokeObjectURL(url);nfCropState={img,zoom:1,dx:0,dy:0,drag:null};nfShowCrop()};
 img.onerror=()=>{URL.revokeObjectURL(url);input.value='';toast('Não foi possível abrir esta imagem.')};
 img.src=url;
}
function nfShowCrop(){
 const old=document.getElementById('nfCropOverlay');if(old)old.remove();
 const wrap=document.createElement('div');wrap.id='nfCropOverlay';wrap.className='nf-crop-overlay';
 wrap.innerHTML=`<div class="nf-crop-dialog" role="dialog" aria-modal="true" aria-label="Ajustar foto de perfil"><div class="row"><h3 style="margin:0">Ajustar foto</h3><button type="button" class="btn" onclick="nfCancelCrop()" aria-label="Fechar">✕</button></div><p class="muted" style="font-size:13px">Arraste para centralizar o rosto e ajuste o tamanho da foto.</p><canvas id="nfCropCanvas" width="320" height="320" aria-label="Prévia do recorte quadrado"></canvas><label style="display:grid;gap:8px;margin-top:12px">Zoom <input id="nfCropZoom" type="range" min="1" max="3" step="0.01" value="1" oninput="nfCropZoomChanged(this.value)"></label><div class="actions" style="justify-content:flex-end;margin-top:16px"><button class="btn" type="button" onclick="nfCancelCrop()">Cancelar</button><button class="btn primary" type="button" onclick="nfConfirmCrop()">Confirmar recorte</button></div></div>`;
 document.body.appendChild(wrap);const canvas=document.getElementById('nfCropCanvas');
 canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);nfCropState.drag={x:e.clientX,y:e.clientY,dx:nfCropState.dx,dy:nfCropState.dy}});
 canvas.addEventListener('pointermove',e=>{if(!nfCropState?.drag)return;const rect=canvas.getBoundingClientRect(),factor=320/rect.width;nfCropState.dx=nfCropState.drag.dx+(e.clientX-nfCropState.drag.x)*factor;nfCropState.dy=nfCropState.drag.dy+(e.clientY-nfCropState.drag.y)*factor;nfClampCrop();nfDrawCrop()});
 canvas.addEventListener('pointerup',()=>{if(nfCropState)nfCropState.drag=null});canvas.addEventListener('pointercancel',()=>{if(nfCropState)nfCropState.drag=null});
 nfDrawCrop();
}
function nfCropDimensions(){const c=nfCropState;const scale=Math.max(320/c.img.naturalWidth,320/c.img.naturalHeight)*c.zoom;return {w:c.img.naturalWidth*scale,h:c.img.naturalHeight*scale}}
function nfClampCrop(){const c=nfCropState;const {w,h}=nfCropDimensions();c.dx=Math.max(-(w-320)/2,Math.min((w-320)/2,c.dx));c.dy=Math.max(-(h-320)/2,Math.min((h-320)/2,c.dy))}
function nfDrawCrop(){const c=nfCropState,canvas=document.getElementById('nfCropCanvas');if(!c||!canvas)return;const ctx=canvas.getContext('2d');const {w,h}=nfCropDimensions();ctx.clearRect(0,0,320,320);ctx.drawImage(c.img,(320-w)/2+c.dx,(320-h)/2+c.dy,w,h);ctx.save();ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(160,160,158,0,Math.PI*2);ctx.stroke();ctx.restore()}
function nfCropZoomChanged(value){if(!nfCropState)return;nfCropState.zoom=Number(value);nfClampCrop();nfDrawCrop()}
function nfCancelCrop(){document.getElementById('nfCropOverlay')?.remove();nfCropState=null;nfCroppedAvatar=null;const f=document.getElementById('nfAvatarFile');if(f)f.value='';const st=document.getElementById('nfCropStatus');if(st)st.textContent=''}
function nfConfirmCrop(){if(!nfCropState)return;const canvas=document.getElementById('nfCropCanvas');canvas.toBlob(blob=>{if(!blob){toast('Não foi possível recortar a foto.');return}nfCroppedAvatar=blob;const st=document.getElementById('nfCropStatus');if(st)st.textContent='✓ Foto recortada e pronta para salvar.';document.getElementById('nfCropOverlay')?.remove();nfCropState=null},'image/jpeg',0.9)}

async function loadPartnerProfile(){try{const m=await sb.from('couple_members').select('user_id').eq('couple_id',state.coupleId).neq('user_id',state.user.id).limit(1);if(m.error||!m.data?.length)return null;const r=await sb.from('profiles').select('id,display_name,nickname,avatar_url').eq('id',m.data[0].user_id).maybeSingle();return r.error?null:r.data}catch(e){return null}}
function nfLogoMarkup(){return `<span class="nf-logo-upper">NOSSO</span>
<span class="nf-logo-main"><span>Financeir</span><svg class="nf-logo-rings" viewBox="0 0 62 55" aria-hidden="true" focusable="false">
<defs>
 <linearGradient id="nfGold" x1="0%" y1="10%" x2="100%" y2="90%">
  <stop offset="0%" stop-color="#fff1c8"/><stop offset="24%" stop-color="#e9ba6d"/>

async function data(){if(!state.coupleId)return {transactions:[],accounts:[],debts:[],projects:[],goals:[]};let [t,a,d,p,g]=await Promise.all([sb.from('transactions').select('*').eq('couple_id',state.coupleId).order('transaction_date',{ascending:false}),sb.from('accounts').select('*').eq('couple_id',state.coupleId).order('created_at',{ascending:false}),sb.from('debts').select('*').eq('couple_id',state.coupleId).order('created_at',{ascending:false}),sb.from('projects').select('*').eq('couple_id',state.coupleId).order('created_at'),sb.from('goals').select('*').eq('couple_id',state.coupleId).order('created_at')]);let bounds=periodBounds();let tx=t.data||[];if(bounds.start)tx=tx.filter(z=>new Date(z.transaction_at||z.transaction_date+'T00:00:00')>=bounds.start);if(bounds.end)tx=tx.filter(z=>new Date(z.transaction_at||z.transaction_date+'T00:00:00')<bounds.end);let out={transactions:tx,allTransactions:t.data||[],accounts:a.data||[],debts:d.data||[],projects:p.data||[],goals:g.data||[]};window.__nfdata=out;return out}
function progressColor(percent){let p=Math.max(0,Math.min(100,Number(percent)||0));const stops=[{p:0,c:[224,68,68]},{p:35,c:[243,154,56]},{p:65,c:[216,189,66]},{p:100,c:[39,132,91]}];let a=stops[0],b=stops[stops.length-1];for(let i=0;i<stops.length-1;i++){if(p>=stops[i].p&&p<=stops[i+1].p){a=stops[i];b=stops[i+1];break}}let t=(p-a.p)/(b.p-a.p||1),c=a.c.map((v,i)=>Math.round(v+(b.c[i]-v)*t));return `rgb(${c[0]}, ${c[1]}, ${c[2]})`}

function enhanceExpandableCards(){

  cards.forEach((card,index)=>{

    else body.classList.add('nf-limit-content');

      card.style.setProperty('--nf-card-limit',limit+'px');

    const label=card.querySelector('h2,h3,small')?.textContent?.trim()||'cartão';
    const key='nf-expand-'+state.user.id+'-'+state.page+'-'+index+'-'+label.slice(0,40);
    let expanded=false;try{expanded=localStorage.getItem(key)==='1'}catch(e){}
    const button=document.createElement('button');button.type='button';button.className='nf-expand-action';button.textContent=expanded?'Ver menos ↑':'Ver mais ↓';button.setAttribute('aria-label',(expanded?'Ver menos de ':'Ver mais de ')+label);
    card.classList.toggle('nf-card-expanded',expanded);

      try{localStorage.setItem(key,expanded?'1':'0')}catch(e){}

    card.appendChild(button);
    const height=parseFloat(getComputedStyle(body).maxHeight)||260;
    // The button only exists visually if the natural content exceeds its limit.

function alertDueInfo(raw){
  if(!raw)return null;
  const m=String(raw).slice(0,10).match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return null;
  const due=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]),12);
  if(due.getFullYear()!==Number(m[1])||due.getMonth()!==Number(m[2])-1||due.getDate()!==Number(m[3]))return null;
  const today=new Date();today.setHours(12,0,0,0);
  const days=Math.round((due-today)/86400000);
  const level=days<0?'overdue':days<=3?'urgent':days<=7?'attention':'ok';
  const label=days<0?'Atrasado':days<=3?'Urgente':days<=7?'Atenção':'No prazo';
  const when=days<0?`Atrasado há ${-days} dia(s)`:days===0?'Vence hoje':`Vence em ${days} dia(s)`;
  return {days,level,label,when,date:due.toLocaleDateString('pt-BR')};
}

/* Acompanhamento local, calculado ao abrir o painel; não é uma IA em execução contínua. */
function nfDashboardAiSignals(x,isCoupleView){
 const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
 const rows=[];
 const push=(name,date,amount,kind)=>{
  if(!date)return;const dt=new Date(String(date).slice(0,10)+'T12:00:00');if(Number.isNaN(dt.getTime()))return;
  const days=Math.round((new Date(dt.getFullYear(),dt.getMonth(),dt.getDate())-today)/86400000);
  if(days>30)return;
  rows.push({name,days,amount,kind});
 };
 for(const d of (x.debts||[])){
  if(isCoupleView?d.ownership!=='couple':!(d.ownership==='individual'&&d.owner_user_id===state.user.id))continue;
  if(Number(d.remaining_amount||0)<=0)continue;
  push(d.name||d.description||'Dívida',d.due_date,Number(d.remaining_amount||0),'vencimento');
 }
 for(const g of (x.goals||[])){
  if(isCoupleView?g.ownership!=='couple':g.owner_user_id!==state.user.id)continue;
  const missing=Math.max(0,Number(g.target_amount||0)-Number(g.saved_amount||0));
  if(missing>0)push(g.name||'Objetivo',g.deadline,missing,'meta');
 }
 if(isCoupleView)for(const p of (x.projects||[])){
  const missing=Math.max(0,Number(p.target_amount||0)-Number(p.saved_amount||0));
  if(missing>0)push(p.name||'Projeto',p.target_date,missing,'projeto');
 }
 rows.sort((a,b)=>a.days-b.days);
 return rows.slice(0,3);
}

function nfDashboardMasonry(){
 const grid=document.querySelector('.nf-dashboard-grid');if(!grid)return;
 // Mantém Receita, Despesa e Dívidas na mesma faixa, lado a lado.
 // Os demais cartões continuam com distribuição dinâmica.
 let pending=false;
 const update=()=>{
  pending=false;
  if(!grid.isConnected)return;
  const slots=[...grid.children].filter(el=>el.classList.contains('nf-dashboard-slot'));
  const oneColumn=window.matchMedia('(max-width:850px)').matches;
  const cs=getComputedStyle(grid),row=parseFloat(cs.gridAutoRows)||8,gap=parseFloat(cs.rowGap)||12;
  const occupied=[1,1];
  slots.forEach(slot=>{
   slot.style.gridRow='auto';slot.style.gridColumn='auto';
  });
  slots.forEach(slot=>{
   const height=slot.getBoundingClientRect().height;
   const span=Math.max(1,Math.ceil((height+gap)/(row+gap)));
   const full=oneColumn||slot.classList.contains('nf-slot-organization')||slot.classList.contains('nf-slot-metrics');
   const col=full?0:(occupied[0]<=occupied[1]?0:1);
   const start=full?Math.max(...occupied):occupied[col];
   slot.style.gridColumn=full?'1 / -1':String(col+1);
   slot.style.gridRow=String(start)+' / span '+span;
   if(full){occupied[0]=start+span;occupied[1]=start+span}
   else occupied[col]=start+span;
  });
 };
 const schedule=()=>{if(!pending){pending=true;requestAnimationFrame(update)}};
 schedule();
 if(window.ResizeObserver){
  const ro=new ResizeObserver(schedule);
  [...grid.children].filter(el=>el.classList.contains('nf-dashboard-slot')).forEach(el=>ro.observe(el));
  // A grade é recriada quando se troca de página, mas desconectamos o observer anterior.
  if(window.__nfMasonryObserver)window.__nfMasonryObserver.disconnect();
  window.__nfMasonryObserver=ro;
 }
 if(window.__nfMasonryResize)window.removeEventListener('resize',window.__nfMasonryResize);
 window.__nfMasonryResize=schedule;
 window.addEventListener('resize',schedule);
}

 go('assistente');
}

async function dividas(){let x=await data();return layout('Dívidas e parcelas','Acompanhe o que falta pagar.',`<button class="btn primary" onclick="openForm('debt')">+ Nova dívida</button>`)+`<div class="list">${x.debts.map(d=>{let pct=Number(d.total_amount)?(Number(d.total_amount)-Number(d.remaining_amount))/Number(d.total_amount)*100:0;return `<div class="card nf-record-click" role="button" tabindex="0" data-nf-record="debt" data-nf-id="${esc(d.id)}" title="Abrir opções da dívida"><div class="row"><div><h3>${esc(d.name)}</h3><span class="muted">${d.installments_total||'-'} parcelas · ${d.ownership==='couple'?'Casal':'Individual'}</span></div><strong class="finance-negative-value">${brl(d.remaining_amount)}</strong></div><div class="progressline"><span>Pago ${brl(Number(d.total_amount)-Number(d.remaining_amount))}</span><span>${pct.toFixed(0)}%</span></div><div class="bar"><div class="fill" style="width:${pct}%;background-color:${progressColor(pct)}"></div></div><div style="margin-top:12px"><button class="btn" onclick="del('debts','${d.id}')">Excluir</button></div></div>`}).join('')||'<div class="empty">Nenhuma dívida cadastrada.</div>'}</div>`}
async function projetos(){let x=await data();let qi=await sb.from('project_items').select('project_id,estimated_amount,paid_amount,progress_percent').eq('couple_id',state.coupleId);window.__nfProjectItems=qi.error?[]:(qi.data||[]);return (qi.error?`<div class="notice">Não foi possível carregar os valores das etapas: ${esc(qi.error.message)}</div>`:'')+layout('Projetos do casal','Grandes planos com meta, data, local e informações editáveis.',`<button class="btn primary" onclick="openForm('project')">+ Novo projeto</button>`)+`<div class="grid g3">${x.projects.map(projectCard).join('')||'<div class="empty">Nenhum projeto.</div>'}</div>`}
async function openProject(id){if(state.page!=='objetivos'&&!state.projectOrigin)state.projectOrigin='projetos';state.selectedProjectId=id;state.page='projectDetail';await render()}
async function projectDetail(){let x=await data(),p=x.projects.find(z=>z.id===state.selectedProjectId);if(!p){state.page='projetos';return projetos()}let q=await sb.from('project_items').select('*').eq('project_id',p.id).eq('couple_id',state.coupleId).order('created_at',{ascending:true});if(q.error){return layout(esc(p.name),'Detalhamento do projeto do casal.',`<button class="btn" onclick="go(state.projectOrigin==='objetivos'?'objetivos':'projetos')">← Voltar aos planejamentos</button>`)+`<div class="notice">Não foi possível carregar as etapas: ${esc(q.error.message)}. Confirme se a migração SQL de projetos detalhados foi executada.</div>`}let items=q.data||[];let pct=items.length?items.reduce((a,i)=>a+Number(i.progress_percent||0),0)/items.length:(Number(p.target_amount)?Math.min(100,Number(p.saved_amount)/Number(p.target_amount)*100):0);let estimated=items.reduce((a,i)=>a+Number(i.estimated_amount||0),0),paid=items.reduce((a,i)=>a+Number(i.paid_amount||0),0);return layout(`<button class="nf-project-back" type="button" onclick="go('projetos')" title="Voltar aos projetos" aria-label="Voltar aos projetos">←</button>${esc(p.name)}`,'Área interna do projeto: organize subobjetivos, etapas, fornecedores e progresso.',`<button class="btn" onclick="editProject('${p.id}')">Editar projeto</button><button class="btn primary" onclick="openProjectItemForm('${p.id}')">+ Adicionar subobjetivo</button>`)+`<div class="grid g3"><div class="card metric"><small>Progresso geral</small><strong>${pct.toFixed(0)}%</strong><div class="bar"><div class="fill" style="width:${pct}%;background-color:${progressColor(pct)}"></div></div><span class="mini">${items.length?'Média do progresso das '+items.length+' etapas':'Adicione subobjetivos para calcular o progresso'}</span></div><div class="card metric"><small>Orçamento das etapas</small><strong>${brl(estimated)}</strong><span class="muted">${brl(paid)} já pago · ${brl(Math.max(0,estimated-paid))} falta pagar</span></div><div class="card metric"><small>Meta do projeto</small><strong>${brl(p.target_amount)}</strong><span class="muted">Reservado: ${brl(p.saved_amount)} (separado do valor pago)</span></div></div><div class="section card"><div class="row"><h2>Subobjetivos e etapas</h2><span class="tag">${items.length} itens</span></div><p class="muted">Ex.: fornecedores, buffet, decoração, banda, cerimonialista, local, fotógrafo ou qualquer etapa deste projeto.</p>${items.length?`<div class="grid g2">${items.map(i=>{let ip=Math.max(0,Math.min(100,Number(i.progress_percent)||0));return `<div class="card"><div class="row"><h3>${esc(i.name)}</h3><span class="tag">${esc(i.status||'Pendente')}</span></div><p class="muted">${esc(i.category||'Outros')}${i.due_date?' · Prazo: '+esc(i.due_date):''}</p><div class="row"><strong>${ip.toFixed(0)}% concluído</strong><span class="mini">${brl(i.paid_amount)} / ${brl(i.estimated_amount)} pagos</span></div><div class="bar" style="margin:8px 0 12px"><div class="fill" style="width:${ip}%;background-color:${progressColor(ip)}"></div></div><div class="progressline"><span>Orçamento: ${brl(i.estimated_amount)}</span><span>${i.estimated_amount?Math.min(100,Number(i.paid_amount||0)/Number(i.estimated_amount)*100).toFixed(0):0}% pago</span></div>${i.notes?`<p class="mini">${esc(i.notes)}</p>`:''}<div class="actions" style="margin-top:12px"><button class="btn primary" onclick="openPaymentForm('${i.id}')">+ Pagamento</button><button class="btn" onclick="showPaymentHistory('${i.id}')">Histórico</button><button class="btn" onclick="editProjectItem('${i.id}')">Editar</button><button class="btn danger" onclick="deleteProjectItem('${i.id}')">Excluir</button></div></div>`}).join('')}</div>`:'<div class="empty">Ainda não há subobjetivos. Clique em “+ Adicionar subobjetivo” para criar o primeiro.</div>'}</div><div class="section card"><h2>Informações do projeto</h2><p>${esc(p.notes||'Nenhuma observação adicionada.')}</p><p class="muted">Data: ${esc(p.target_date||'não definida')} · Local/destino: ${esc(p.place||'não definido')}</p></div>`}
function openProjectItemForm(projectId,item=null){let isEdit=!!item;modal(isEdit?'Editar etapa do projeto':'Adicionar subobjetivo ao projeto',`<div class="formgrid"><label class="full">Nome do subobjetivo<input id="f_pi_name" required placeholder="Ex.: Buffet, decoração, banda" value="${esc(item?.name||'')}"></label><label>Categoria<select id="f_pi_category">${['Fornecedor','Buffet','Decoração','Banda/DJ','Cerimonialista','Local/espaço','Fotografia e vídeo','Vestimenta','Convites','Documentação','Pagamento','Outra'].map(c=>`<option ${item?.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label>Status<select id="f_pi_status">${['Pendente','Pesquisando','Orçamento recebido','Contratado','Sinal pago','Parcialmente pago','Pago','Concluído','Cancelado'].map(c=>`<option ${item?.status===c?'selected':''}>${c}</option>`).join('')}</select></label><label>Progresso (%)<input id="f_pi_progress" type="number" min="0" max="100" step="1" value="${Math.max(0,Math.min(100,Number(item?.progress_percent||0)))}"></label><label>Valor estimado<input id="f_pi_estimated" type="number" min="0" step="0.01" value="${Number(item?.estimated_amount||0)}"></label><label>Valor já pago<input id="f_pi_paid" type="number" min="0" step="0.01" value="${Number(item?.paid_amount||0)}" ${isEdit?'readonly title="Total controlado pelo histórico de pagamentos"':''}></label><label>Prazo/vencimento<input id="f_pi_due" type="date" value="${esc(item?.due_date||'')}"></label><label class="full">Observações<textarea id="f_pi_notes">${esc(item?.notes||'')}</textarea></label></div>`,`submitProjectItem(event,'${projectId}'${isEdit?`, '${item.id}'`:''})`)}
async function submitProjectItem(e,projectId,itemId=null){e.preventDefault();let payload={project_id:projectId,couple_id:state.coupleId,owner_user_id:state.user.id,name:v('f_pi_name'),category:v('f_pi_category'),status:v('f_pi_status'),progress_percent:Math.max(0,Math.min(100,Number(v('f_pi_progress')||0))),estimated_amount:Number(v('f_pi_estimated')||0),paid_amount:Number(v('f_pi_paid')||0),due_date:v('f_pi_due')||null,notes:v('f_pi_notes'),updated_at:new Date().toISOString()};if(itemId){const pr=await sb.from('project_payments').select('id').eq('project_item_id',itemId).limit(1);if(pr.error){toast(pr.error.message);return}if(pr.data?.length){const current=await nfPaymentItem(itemId);payload.paid_amount=Number(current.paid_amount||0)}}let q=itemId?await sb.from('project_items').update(payload).eq('id',itemId).eq('couple_id',state.coupleId):await sb.from('project_items').insert(payload);if(q.error){toast('Não foi possível salvar a etapa: '+q.error.message+' (confirme a migração SQL de projetos detalhados)');return}closeModal();toast(itemId?'Etapa atualizada':'Subobjetivo adicionado');render()}
// Pagamentos: o registro financeiro e o pagamento do projeto são entidades distintas.
// Um lançamento existente pode ser associado apenas uma vez; nenhum lançamento é criado ao associá-lo.
async function nfPaymentItem(id){const r=await sb.from('project_items').select('*').eq('id',id).eq('couple_id',state.coupleId).single();if(r.error)throw r.error;return r.data}
async function openPaymentForm(itemId){
 try{
  const item=await nfPaymentItem(itemId);
  const tx=await sb.from('transactions').select('id,description,amount,kind,transaction_date,ownership,visibility,deleted_at').eq('couple_id',state.coupleId).eq('kind','expense').is('deleted_at',null).order('transaction_date',{ascending:false}).limit(200);
  if(tx.error)throw tx.error;
  const used=await sb.from('project_payments').select('transaction_id').eq('couple_id',state.coupleId).not('transaction_id','is',null);
  if(used.error)throw used.error;
  const linked=new Set((used.data||[]).map(x=>x.transaction_id));
  const available=(tx.data||[]).filter(t=>!linked.has(t.id));
  const options=available.map(t=>`<option value="${esc(t.id)}">${esc(t.transaction_date)} · ${esc(t.description)} · ${brl(t.amount)}</option>`).join('');
  modal('Registrar pagamento — '+esc(item.name),`<div class="notice">O pagamento ficará no histórico da etapa. Escolha vincular uma despesa já cadastrada ou criar uma despesa compartilhada. Valores antigos da etapa não serão apagados.</div><div class="formgrid"><label class="full">Como registrar<select id="nf_pay_mode" onchange="nfPaymentMode()"><option value="existing">Vincular despesa existente</option><option value="new">Criar despesa e vincular</option><option value="manual">Registrar apenas no projeto (sem movimentar conta)</option></select></label><label class="full" id="nf_pay_existing">Despesa disponível<select id="nf_pay_tx" onchange="nfPaymentSelected()"><option value="">Selecione...</option>${options}</select></label><label>Valor pago<input id="nf_pay_amount" type="number" min="0.01" step="0.01" required></label><label>Data<input id="nf_pay_date" type="date" value="${new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10)}" required></label><label class="full" id="nf_pay_account_label" style="display:none">Conta para a nova despesa<select id="nf_pay_account"><option value="">Sem conta</option>${accountOptions()}</select></label><label class="full">Observações<input id="nf_pay_notes" placeholder="Ex.: sinal, parcela 1"></label></div><p class="mini">Ao criar despesa, será feito o alerta de duplicidade habitual. A vinculação usa apenas despesas que sua conta pode consultar.</p>`,`saveProjectPayment(event,'${itemId}')`);
  window.__nfPaymentOptions=available;
  nfPaymentMode();
 }catch(e){toast('Não foi possível abrir pagamentos: '+e.message)}
}
function nfPaymentMode(){let mode=v('nf_pay_mode');let existing=document.getElementById('nf_pay_existing'),account=document.getElementById('nf_pay_account_label');if(existing)existing.style.display=mode==='existing'?'':'none';if(account)account.style.display=mode==='new'?'':'none';if(mode==='existing')nfPaymentSelected()}
function nfPaymentSelected(){const t=(window.__nfPaymentOptions||[]).find(x=>x.id===v('nf_pay_tx'));if(t){document.getElementById('nf_pay_amount').value=t.amount;document.getElementById('nf_pay_date').value=t.transaction_date}}
async function saveProjectPayment(e,itemId){
 e.preventDefault();const mode=v('nf_pay_mode'),amount=Number(v('nf_pay_amount')),date=v('nf_pay_date');
 if(!Number.isFinite(amount)||amount<=0||!date){toast('Informe valor e data válidos.');return}
 let transactionId=null,createdTransactionId=null;
 try{
  const item=await nfPaymentItem(itemId);
  if(mode==='existing'){
   transactionId=v('nf_pay_tx');if(!transactionId){toast('Escolha uma despesa.');return}
   const t=(window.__nfPaymentOptions||[]).find(x=>x.id===transactionId);
   if(!t||Math.abs(Number(t.amount)-amount)>0.009||t.transaction_date!==date){toast('O valor e a data precisam corresponder à despesa existente.');return}
  }else if(mode==='new'){
   const candidate={couple_id:state.coupleId,owner_user_id:state.user.id,description:item.name,amount,kind:'expense',ownership:'couple',visibility:'shared',account_id:v('nf_pay_account')||null,payment_method:'Outro',category_label:'Projetos',movement_source:'Pagamento de projeto',transaction_date:date,transaction_at:new Date(date+'T12:00:00').toISOString(),notes:v('nf_pay_notes')};
   if(!await nfCheckDuplicate(candidate,null))return;
   const created=await sb.from('transactions').insert(candidate).select('id').single();if(created.error)throw created.error;
   transactionId=created.data.id;createdTransactionId=transactionId;
  }
  if(transactionId){const dup=await sb.from('project_payments').select('id').eq('transaction_id',transactionId).limit(1);if(dup.error)throw dup.error;if(dup.data?.length)throw new Error('Esta despesa já está vinculada a um pagamento de projeto.');}
  const saved=await sb.from('project_payments').insert({couple_id:state.coupleId,project_item_id:itemId,transaction_id:transactionId,amount,paid_on:date,paid_at:new Date().toISOString(),owner_user_id:state.user.id,notes:v('nf_pay_notes')}).select('id').single();
  if(saved.error)throw saved.error;
  // Incrementa o valor já pago, preservando eventuais valores de testes anteriores.
  const refreshed=await nfPaymentItem(itemId);
  const upd=await sb.from('project_items').update({paid_amount:Number(refreshed.paid_amount||0)+amount,updated_at:new Date().toISOString()}).eq('id',itemId).eq('couple_id',state.coupleId);
  if(upd.error){await sb.from('project_payments').delete().eq('id',saved.data.id);throw upd.error}
  closeModal();toast('Pagamento registrado e etapa atualizada');render();
 }catch(err){toast('Erro ao registrar pagamento: '+err.message+(createdTransactionId?' A despesa foi criada; confira Lançamentos antes de tentar novamente.':''))}
}

async function nfLinkedTransaction(id){const r=await sb.from('project_payments').select('id').eq('transaction_id',id).limit(1);if(r.error){toast('Não foi possível verificar vínculo financeiro: '+r.error.message);return null}return (r.data||[]).length>0}
async function editPayment(paymentId,itemId){
 try{const r=await sb.from('project_payments').select('*').eq('id',paymentId).eq('couple_id',state.coupleId).single();if(r.error)throw r.error;const p=r.data;
 modal('Editar pagamento',`<div class="notice">${p.transaction_id?'Pagamento vinculado a uma despesa. Para alterar o valor ou a data, desvincule o pagamento primeiro; a despesa original será preservada.':'Pagamento registrado somente no projeto.'}</div><div class="formgrid"><label>Valor pago<input id="nf_ep_amount" type="number" min="0.01" step="0.01" value="${Number(p.amount)}" ${p.transaction_id?'disabled':''}></label><label>Data<input id="nf_ep_date" type="date" value="${esc(p.paid_on)}" ${p.transaction_id?'disabled':''}></label><label class="full">Observações<input id="nf_ep_notes" value="${esc(p.notes||'')}"></label></div>`,`saveEditedPayment(event,'${paymentId}','${itemId}')`);
 }catch(e){toast('Não foi possível editar: '+e.message)}
}
async function saveEditedPayment(e,paymentId,itemId){e.preventDefault();try{
 const r=await sb.from('project_payments').select('*').eq('id',paymentId).eq('couple_id',state.coupleId).single();if(r.error)throw r.error;const p=r.data;
 const amount=p.transaction_id?Number(p.amount):Number(v('nf_ep_amount'));const paid_on=p.transaction_id?p.paid_on:v('nf_ep_date');if(!(amount>0)||!paid_on){toast('Valor ou data inválidos.');return}
 const diff=amount-Number(p.amount);const item=await nfPaymentItem(itemId);
 if(diff){const upd=await sb.from('project_items').update({paid_amount:Math.max(0,Number(item.paid_amount||0)+diff),updated_at:new Date().toISOString()}).eq('id',itemId).eq('couple_id',state.coupleId);if(upd.error)throw upd.error}
 const upd=await sb.from('project_payments').update({amount,paid_on,notes:v('nf_ep_notes'),updated_at:new Date().toISOString()}).eq('id',paymentId).eq('couple_id',state.coupleId);
 if(upd.error){if(diff)await sb.from('project_items').update({paid_amount:Number(item.paid_amount||0)}).eq('id',itemId);throw upd.error}
 await showPaymentHistory(itemId);toast('Pagamento atualizado');render();
 }catch(e){toast('Erro ao editar pagamento: '+e.message)}
}
async function deletePayment(paymentId,itemId){
 if(!confirm('Excluir este registro de pagamento? Se houver despesa vinculada, ela permanecerá em Lançamentos, apenas o vínculo será removido.'))return;
 try{const r=await sb.from('project_payments').select('*').eq('id',paymentId).eq('couple_id',state.coupleId).single();if(r.error)throw r.error;
 const item=await nfPaymentItem(itemId);const old=Number(item.paid_amount||0);const amount=Number(r.data.amount||0);
 const upd=await sb.from('project_items').update({paid_amount:Math.max(0,old-amount),updated_at:new Date().toISOString()}).eq('id',itemId).eq('couple_id',state.coupleId);if(upd.error)throw upd.error;
 const del=await sb.from('project_payments').delete().eq('id',paymentId).eq('couple_id',state.coupleId);
 if(del.error){await sb.from('project_items').update({paid_amount:old}).eq('id',itemId);throw del.error}
 await showPaymentHistory(itemId);toast('Pagamento removido; despesa vinculada preservada');render();
 }catch(e){toast('Erro ao excluir pagamento: '+e.message)}
}

async function showPaymentHistory(itemId){
 try{const item=await nfPaymentItem(itemId);const r=await sb.from('project_payments').select('*').eq('couple_id',state.coupleId).eq('project_item_id',itemId).order('paid_on',{ascending:false});if(r.error)throw r.error;
 const rows=r.data||[];const total=rows.reduce((sum,x)=>sum+Number(x.amount||0),0);
 document.getElementById('modalRoot').innerHTML=`<div class="modal"><div class="modalbox"><div class="modalhead"><h2>Pagamentos — ${esc(item.name)}</h2><button class="close" onclick="closeModal()">×</button></div><div class="notice">Total no histórico: <b>${brl(total)}</b>. Valor total na etapa: <b>${brl(item.paid_amount)}</b>. A diferença pode corresponder a valores cadastrados antes desta funcionalidade.</div><div class="list">${rows.map(x=>`<div class="item"><div class="info"><b>${brl(x.amount)}</b><span>${esc(x.paid_on)} · ${x.transaction_id?'Vinculado a lançamento':'Somente no projeto'} · ${x.owner_user_id===state.user.id?'Registrado por você':'Registrado pelo parceiro'}</span><span>${esc(x.notes||'')}</span></div><div class="actions"><button class="btn" onclick="editPayment('${x.id}','${itemId}')">Editar</button><button class="btn danger" onclick="deletePayment('${x.id}','${itemId}')">Excluir</button></div></div>`).join('')||'<div class="empty">Nenhum pagamento registrado no histórico.</div>'}</div><div class="actions" style="margin-top:16px"><button class="btn" onclick="closeModal()">Fechar</button><button class="btn primary" onclick="openPaymentForm('${itemId}')">+ Pagamento</button></div></div></div>`;
 }catch(e){toast('Erro ao consultar histórico: '+e.message)}
}
async function editProjectItem(id){let q=await sb.from('project_items').select('*').eq('id',id).eq('couple_id',state.coupleId).single();if(q.error||!q.data){toast('Não foi possível abrir esta etapa.');return}openProjectItemForm(q.data.project_id,q.data)}
async function deleteProjectItem(id){const pr=await sb.from('project_payments').select('id').eq('project_item_id',id).limit(1);if(pr.error){toast(pr.error.message);return}if(pr.data?.length){toast('Esta etapa possui pagamentos. Remova os registros do histórico antes de excluir a etapa.');return}if(!confirm('Excluir este subobjetivo do projeto?'))return;let q=await sb.from('project_items').delete().eq('id',id).eq('couple_id',state.coupleId);if(q.error)toast('Não foi possível excluir: '+q.error.message);else{toast('Subobjetivo excluído');render()}}
async function objetivos(){
 const {data:goals,error}=await sb.from('personal_goals').select('*').eq('owner_user_id',state.user.id).order('created_at',{ascending:false});
 if(error)return layout('Objetivos pessoais','Seus planos individuais, separados dos projetos do casal.')+`<div class="notice">Não foi possível carregar os objetivos pessoais: ${esc(error.message)}. Execute primeiro o SQL de Objetivos Pessoais no Supabase.</div>`;
 let linkedTotals={},purchaseTotals={};
 if((goals||[]).length){
  const ids=goals.map(g=>g.id);
  const purchases=await sb.from('personal_goal_purchases').select('goal_id,amount').in('goal_id',ids).eq('owner_user_id',state.user.id);
  if(purchases.error){toast('Não foi possível consultar compras com reserva: '+purchases.error.message)}
  else for(const purchase of purchases.data||[]){purchaseTotals[purchase.goal_id]=(purchaseTotals[purchase.goal_id]||0)+Number(purchase.amount||0)}
  const lr=await sb.from('personal_goal_links').select('goal_id,transaction_id').eq('owner_user_id',state.user.id).in('goal_id',ids);
  if(lr.error){toast('Não foi possível consultar as despesas vinculadas: '+lr.error.message)}
  else if(lr.data?.length){
   const txids=[...new Set(lr.data.map(l=>l.transaction_id))];
   const tr=await sb.from('transactions').select('id,amount').eq('owner_user_id',state.user.id).eq('ownership','individual').eq('kind','expense').is('deleted_at',null).in('id',txids);
   if(tr.error){toast('Não foi possível calcular despesas vinculadas: '+tr.error.message)}
   else {const amounts=new Map((tr.data||[]).map(t=>[t.id,Number(t.amount)||0]));for(const l of lr.data){linkedTotals[l.goal_id]=(linkedTotals[l.goal_id]||0)+(amounts.get(l.transaction_id)||0)}}
  }
 }
 const cards=(goals||[]).map(g=>{
  const target=Number(g.target_amount)||0,saved=Number(g.saved_amount)||0,linked=linkedTotals[g.id]||0,pct=target?Math.min(100,100*saved/target):0;
  return `<div class="card nf-personal-card"><div class="row nf-personal-head"><h3>${esc(g.name)}</h3><button class="nf-mini-menu" type="button" onclick="event.stopPropagation();personalGoalMenu('${g.id}')" aria-label="Opções do objetivo">⋯</button></div><div class="mini">${g.deadline?'Prazo: '+esc(g.deadline):'Sem prazo definido'}</div><div class="progressline"><span>Progresso da reserva</span><span>${pct.toFixed(0)}%</span></div><div class="bar"><div class="fill" style="width:${pct}%;background:var(--navy)"></div></div>${nfFinancialDetails([['Meta financeira',target],['Valor reservado',saved,'positive'],['Falta reservar',Math.max(0,target-saved)],['Compras pagas com reserva',purchaseTotals[g.id]||0],['Outras despesas vinculadas',linked]])}<p class="mini nf-financial-note">Compras com reserva reduzem o valor reservado; outras despesas vinculadas são informativas.</p>${g.notes?`<p class="mini">${esc(g.notes)}</p>`:''}<div class="actions"><button class="btn primary" onclick="personalGoalReserve('${g.id}','reserve')">+ Reservar</button><button class="btn" onclick="personalGoalReserve('${g.id}','return')">Devolver</button><button class="btn" onclick="personalGoalPurchase('${g.id}')">Pagar com reserva</button><button class="btn" onclick="personalGoalReserveHistory('${g.id}')">Histórico</button><button class="btn" onclick="personalGoalPurchaseHistory('${g.id}')">Compras</button><button class="btn" onclick="personalGoalLinks('${g.id}')">Lançamentos vinculados</button><button class="btn" onclick="personalGoalForm('${g.id}')">Editar</button></div></div>`
 }).join('');
 return layout('Objetivos pessoais','Metas que pertencem somente à sua conta.',`<button class="btn primary" onclick="personalGoalForm()">+ Novo objetivo</button>`)+`<div class="grid g3">${cards||'<div class="empty">Você ainda não tem objetivos pessoais. Crie uma meta, como um videogame ou celular.</div>'}</div>`;
}

 modal(id?'Editar objetivo pessoal':'Novo objetivo pessoal',`<div class="formgrid"><label class="full">Nome<input id="pg_name" required value="${esc(g?.name||'')}" placeholder="Ex.: PlayStation, celular"></label><label>Meta financeira<input id="pg_target" type="number" min="0" step="0.01" value="${Number(g?.target_amount||0)}"></label><label>Prazo<input id="pg_deadline" type="date" value="${esc(g?.deadline||'')}"></label><label class="full">Observações<textarea id="pg_notes">${esc(g?.notes||'')}</textarea></label></div><p class="mini">Para movimentar o valor reservado, utilize o botão + Reservar no cartão do objetivo.</p>`,`savePersonalGoal(event,${id?`'${id}'`:'null'})`)

function nfReportDonut(items,total){

 let pos=0;
 const stops=items.map((item,i)=>{const from=pos;pos+=nfReportPct(item.total,total);return `${colors[i%colors.length]} ${from.toFixed(3)}% ${pos.toFixed(3)}%`});
 return `<div class="nf-report-donut" style="background:${stops.length?'conic-gradient('+stops.join(',')+')':'var(--line)'}"><div class="nf-report-donut-hole"><span>Total</span><strong>${brl(total)}</strong></div></div>`;

/* Elo: conversa atual e arquivo por inatividade (7 dias). Mensagens não são excluídas. */
let nfAiHistory=[];
let nfEloShowArchive=false;
const NF_ELO_ARCHIVE_DAYS=7;
function nfEloSessions(rows){
 const sessions=[];let group=[];let prev=0;
 for(const msg of rows){const at=new Date(msg.created_at).getTime();
  if(group.length && at-prev>NF_ELO_ARCHIVE_DAYS*86400000){sessions.push(group);group=[]}
  group.push(msg);prev=at;
 }
 if(group.length)sessions.push(group);
 return sessions;
}
function nfEloFormat(text){
 // Interpretador Markdown seguro: todo conteúdo é escapado antes de criar HTML.
 const raw=String(text||'').replace(/\r\n?/g,'\n');
 const lines=raw.split('\n');
 let html='',list=null,paragraph=[],quote=[];
 function inline(value){
  let t=esc(value);
  t=t.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  t=t.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
  t=t.replace(/__([^_\n]+)__/g,'<strong>$1</strong>');
  t=t.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>');
  t=t.replace(/(^|[^_])_([^_\n]+)_(?!_)/g,'$1<em>$2</em>');
  return t;
 }
 function flushP(){if(paragraph.length){html+='<p>'+paragraph.map(inline).join('<br>')+'</p>';paragraph=[]}}
 function flushList(){if(list){html+='</'+list+'>';list=null}}
 function flushQuote(){if(quote.length){html+='<blockquote>'+quote.map(inline).join('<br>')+'</blockquote>';quote=[]}}
 function closeBlocks(){flushP();flushList();flushQuote()}
 let fence=false,code=[];
 for(let i=0;i<lines.length;i++){
  const line=lines[i],trim=line.trim();
  if(/^```/.test(trim)){closeBlocks();if(fence){html+='<pre><code>'+esc(code.join('\n'))+'</code></pre>';code=[];fence=false}else fence=true;continue}
  if(fence){code.push(line);continue}
  if(!trim){closeBlocks();continue}
  const heading=trim.match(/^(#{1,6})\s+(.+)$/);
  if(heading){closeBlocks();const level=Math.min(4,heading[1].length+1);html+='<h'+level+'>'+inline(heading[2])+'</h'+level+'>';continue}
  if(/^(?:---+|___+|\*\*\*+)\s*$/.test(trim)){closeBlocks();html+='<hr>';continue}
  const item=line.match(/^\s*([-*+]\s+|\d+[.)]\s+)(.+)$/);
  if(item){flushP();flushQuote();const kind=/\d/.test(item[1][0])?'ol':'ul';if(list!==kind){flushList();list=kind;html+='<'+kind+'>'}html+='<li>'+inline(item[2])+'</li>';continue}
  const q=line.match(/^\s*>\s?(.*)$/);
  if(q){flushP();flushList();quote.push(q[1]);continue}
  // Tabelas Markdown (cabeçalho | separador | linhas)
  if(trim.includes('|')&&i+1<lines.length&&/^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[i+1])){
   closeBlocks();const cells=x=>x.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
   const head=cells(line);html+='<div class="elo-table-wrap"><table><thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>';i++;
   while(i+1<lines.length&&lines[i+1].trim()&&lines[i+1].includes('|')){i++;html+='<tr>'+cells(lines[i]).map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>'}
   html+='</tbody></table></div>';continue;
  }
  flushList();flushQuote();paragraph.push(trim);
 }
 closeBlocks();if(fence)html+='<pre><code>'+esc(code.join('\n'))+'</code></pre>';
 return html;
}

 return `<div class="elo-message ${mine?'elo-mine':'elo-theirs'}"><div class="elo-bubble"><div class="elo-text">${nfEloFormat(m.content)}</div><div class="elo-time">${mine?'Você':'Elo'} · ${esc(when)}</div></div></div>`;
}

async function assistente(){
 const r=await sb.from('ai_messages').select('id,role,content,created_at').eq('owner_user_id',state.user.id).order('created_at',{ascending:false}).limit(500);
 const error=r.error;
 // A API grava pergunta e resposta juntas; ambas podem ter o mesmo created_at.
 // Nesse empate, exibir primeiro a pergunta e depois a resposta.
 nfAiHistory=error?[]:(r.data||[]).sort((a,b)=>{
  const delta=new Date(a.created_at).getTime()-new Date(b.created_at).getTime();
  if(delta!==0)return delta;
  if(a.role===b.role)return 0;
  return a.role==='user'?-1:1;
 });
 const sessions=nfEloSessions(nfAiHistory);
 const now=Date.now();
 const latest=sessions[sessions.length-1]||[];
 const lastTime=latest.length?new Date(latest[latest.length-1].created_at).getTime():0;
 const active=lastTime&&now-lastTime<=NF_ELO_ARCHIVE_DAYS*86400000?latest:[];
 const archived=sessions.filter(group=>group!==active);
 const oldCount=archived.reduce((n,g)=>n+g.length,0);
 const archiveContent=archived.map(group=>`<div class="elo-archive-date">Conversa de ${new Date(group[0].created_at).toLocaleDateString('pt-BR')}</div>${group.map(nfEloMessage).join('')}`).join('');
 const messages=nfEloShowArchive?archiveContent:(active.length?active.map(nfEloMessage).join(''):`<div class="elo-welcome"><div class="elo-welcome-icon">✦</div><h2>Como posso ajudar?</h2><p>Sou o Elo, seu parceiro para organizar as finanças e realizar os planos de vocês.</p><div class="elo-suggestions"><button type="button" onclick="nfEloSuggestion('Como estão nossas finanças este mês?')">Como estão nossas finanças?</button><button type="button" onclick="nfEloSuggestion('Quanto falta para nossos projetos?')">Como estão nossos projetos?</button><button type="button" onclick="nfEloSuggestion('Quais despesas merecem atenção?')">Onde podemos economizar?</button></div></div>`);
 return `<div class="elo-shell"><div class="elo-header"><div class="elo-logo">✦</div><div class="elo-heading"><h1>Elo</h1><p>Seu parceiro de planos</p></div><div class="elo-header-actions">${oldCount?`<button type="button" class="elo-history-btn" onclick="nfEloToggleArchive()">${nfEloShowArchive?'← Conversa atual':'Conversas anteriores'}</button>`:''}</div></div>
 ${error?`<div class="notice">Não foi possível acessar o histórico: ${esc(error.message)}</div>`:''}
 <div id="nfAiMessages" class="elo-chat" role="log" aria-live="polite">${messages}</div>
 <form id="nfAiForm" class="elo-compose" onsubmit="nfAiSaveQuestion(event)"><div class="elo-compose-line"><textarea id="nfAiText" rows="1" maxlength="4000" onkeydown="nfEloKeyboard(event)" placeholder="Pergunte alguma coisa ao Elo..." aria-label="Mensagem para o Elo" required ${error?'disabled':''}></textarea><button type="submit" class="elo-send" aria-label="Enviar mensagem" title="Enviar mensagem" ${error?'disabled':''}>➤</button></div><div class="elo-compose-foot"><span>Enter para enviar · Shift + Enter para nova linha</span><span>O Elo pode cometer erros. Confira valores importantes.</span></div></form>
 <details class="elo-privacy"><summary>Privacidade e uso da IA</summary><p>As perguntas e os dados financeiros autorizados são enviados ao provedor de IA para gerar respostas. Não compartilhe senhas ou informações bancárias sensíveis. Conversas antigas ficam ocultas após 7 dias sem atividade, mas permanecem armazenadas.</p></details></div>`;
}
